<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ジャムおじさんのビルだいさくせん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#23324d; --bg2:#141d2e; --ink:#1f1a17; --cream:#fff8e8;
    --red:#e8483f; --red-d:#b5312a; --pad:#f4ead7; --pad-d:#cbbd9f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2e4266,var(--bg2));
    color:var(--cream);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-weight:800;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  #cv{position:absolute;display:block;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45);background:#bfe6ff;touch-action:none}
  .ctl{position:absolute;touch-action:none;display:none}
  body.touch .ctl{display:block}
  #dpad{border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,var(--pad) 60%,var(--pad-d));border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35)}
  #dpad::before,#dpad::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(31,26,23,.08);border-radius:8px}
  #dpad::before{width:34%;height:86%}
  #dpad::after{width:86%;height:34%}
  #dpad .ar{position:absolute;width:0;height:0;border-style:solid;z-index:1}
  #dpad .u{left:50%;top:9%;transform:translateX(-50%);border-width:0 14px 18px 14px;border-color:transparent transparent var(--ink) transparent}
  #dpad .d{left:50%;bottom:9%;transform:translateX(-50%);border-width:18px 14px 0 14px;border-color:var(--ink) transparent transparent transparent}
  #dpad .l{top:50%;left:9%;transform:translateY(-50%);border-width:14px 18px 14px 0;border-color:transparent var(--ink) transparent transparent}
  #dpad .r{top:50%;right:9%;transform:translateY(-50%);border-width:14px 0 14px 18px;border-color:transparent transparent transparent var(--ink)}
  #dpad .u.on{border-bottom-color:var(--red)} #dpad .d.on{border-top-color:var(--red)}
  #dpad .l.on{border-right-color:var(--red)} #dpad .r.on{border-left-color:var(--red)}
  #jumpBtn{border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff8a7a,var(--red) 55%,var(--red-d));border:3px solid var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,.35);color:#fff;align-items:center;justify-content:center;text-align:center;line-height:1.1;
    text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.02em}
  body.touch #jumpBtn{display:flex}
  #jumpBtn.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  #mini{position:absolute;display:flex;gap:10px}
  #mini button{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--pad);color:var(--ink);
    font:inherit;font-size:15px;padding:0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  #mini button.off{opacity:.55;text-decoration:line-through}
  #help{position:absolute;left:0;right:0;text-align:center;font-size:13px;opacity:.85;display:none;padding:0 8px}
  body:not(.touch) #help{display:block}
  noscript{display:block;padding:2em;text-align:center}
</style>
</head>
<body>
<noscript>このゲームを あそぶには JavaScript を ゆうこうに してください。</noscript>
<canvas id="cv" aria-label="ゲームがめん"></canvas>

<div id="help">← → いどう　↑ ↓ はしご　スペース / Z ジャンプ　P ポーズ　M おと</div>
<script>
'use strict';
// ============================================================
//  ジャムおじさんのビルだいさくせん  — core / audio
// ============================================================
const W = 224, H = 288, TAU = Math.PI * 2;
const OL = '#1f1a17';          // outline color (thick Anpanman-style lines)
const LW = 0.8;                // outline width in logical px
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
const COL = {
  skin: '#eba98a', skinD: '#c97b66', hair: '#c3d5cf', white: '#fbfaf5', shoe: '#7a9a8b',
  bskin: '#f8d6b8', bcheek: '#f59a95', bhair: '#2f2626', bdress: '#e4473d', bshoe: '#8c3b2c',
  bk: '#1f2b2e', bkPurple: '#9b80c6', bkNose: '#8a6fb6', bkEye: '#f7dbe9', wing: '#eef3f3',
  kabi: '#566b42', kabiD: '#3e4f30',
  girder: '#ee5e44', girderT: '#b53a2a', girderH: '#ff9f86',
  beam: '#f2a43c', beamT: '#b8701f', beamH: '#ffd08a',
  ladder: '#ffd84d', bolt: '#dfe4ea', boltD: '#8d96a3', column: '#93a7bb', columnD: '#6c8197',
};
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
let VS = 2, DPR = 1;           // view scale (logical -> css px), device pixel ratio

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------
//  Sound (WebAudio synth, no external files)
// ------------------------------------------------------------
const Snd = {
  ac: null, out: null, bgmBus: null, sfxBus: null, noiseBuf: null, muted: false,
  init() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ac = new AC(); } catch (e) { return; }
      this.out = this.ac.createGain(); this.out.gain.value = this.muted ? 0 : 0.6; this.out.connect(this.ac.destination);
      this.bgmBus = this.ac.createGain(); this.bgmBus.gain.value = 0.34; this.bgmBus.connect(this.out);
      this.sfxBus = this.ac.createGain(); this.sfxBus.gain.value = 0.6; this.sfxBus.connect(this.out);
      const len = Math.floor(this.ac.sampleRate * 0.5);
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state === 'suspended' && !G.paused) this.ac.resume();
  },
  setMuted(m) {
    this.muted = m;
    if (this.out) this.out.gain.setTargetAtTime(m ? 0 : 0.6, this.ac.currentTime, 0.02);
  },
  tone(f, dur, o = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + (o.delay || 0);
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.sfxBus);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, o = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + (o.delay || 0);
    const src = this.ac.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const filt = this.ac.createBiquadFilter(); filt.type = o.ftype || 'lowpass';
    filt.frequency.setValueAtTime(o.freq || 2000, t);
    if (o.fslide) filt.frequency.exponentialRampToValueAtTime(o.fslide, t + dur);
    const g = this.ac.createGain(); const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + dur + 0.03);
  },
  note(bus, f, t, dur, type, vol) {
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = type; osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
};

const SFX = {
  jump() { Snd.tone(330, 0.16, { slide: 760, vol: 0.17 }); },
  step(i) { Snd.tone(i ? 190 : 235, 0.035, { type: 'triangle', vol: 0.22 }); },
  climb(i) { Snd.tone(i ? 520 : 610, 0.03, { type: 'triangle', vol: 0.15 }); },
  land() { Snd.noise(0.05, { freq: 900, vol: 0.18 }); },
  over() { Snd.tone(988, 0.07, { vol: 0.15 }); Snd.tone(1319, 0.12, { vol: 0.15, delay: 0.07 }); },
  smash() { Snd.noise(0.18, { freq: 3000, fslide: 300, vol: 0.35 }); Snd.tone(700, 0.15, { slide: 120, vol: 0.2 }); },
  swing() { Snd.noise(0.035, { freq: 1500, vol: 0.1 }); },
  item() { [1047, 1319, 1568, 2093].forEach((f, i) => Snd.tone(f, 0.09, { vol: 0.15, delay: i * 0.06 })); },
  hammer() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => Snd.tone(f, 0.08, { vol: 0.15, delay: i * 0.05 })); },
  bolt() { Snd.tone(420, 0.09, { slide: 1400, vol: 0.2 }); Snd.tone(1760, 0.08, { vol: 0.12, delay: 0.08, type: 'triangle' }); },
  throw() { Snd.noise(0.22, { freq: 400, fslide: 2400, vol: 0.16, ftype: 'bandpass' }); },
  drop() { Snd.tone(1400, 0.45, { slide: 300, vol: 0.08, type: 'triangle' }); },
  laugh() { [620, 540, 660, 520, 470].forEach((f, i) => Snd.tone(f, 0.12, { type: 'sawtooth', vol: 0.08, delay: i * 0.13, slide: f * 0.85 })); },
  warn() { Snd.tone(880, 0.06, { vol: 0.12 }); },
  oneup() { [784, 988, 1175, 1568, 1175, 1568].forEach((f, i) => Snd.tone(f, 0.08, { vol: 0.15, delay: i * 0.07 })); },
  crash() { Snd.noise(1.2, { freq: 700, fslide: 80, vol: 0.5 }); Snd.tone(110, 0.5, { slide: 40, vol: 0.3, type: 'triangle' }); },
  rumble() { Snd.noise(0.5, { freq: 220, vol: 0.22 }); },
  poof() { Snd.noise(0.12, { freq: 2500, fslide: 600, vol: 0.14 }); },
  heart() { [1319, 1568, 2093].forEach((f, i) => Snd.tone(f, 0.12, { type: 'triangle', vol: 0.18, delay: i * 0.09 })); },
  breakHeart() { Snd.tone(600, 0.35, { slide: 180, vol: 0.14, type: 'sawtooth' }); },
  tick() { Snd.tone(1760, 0.025, { vol: 0.07 }); },
  select() { Snd.tone(660, 0.06, { vol: 0.15 }); Snd.tone(990, 0.08, { vol: 0.15, delay: 0.06 }); },
  whoosh() { Snd.noise(0.35, { freq: 300, fslide: 3000, vol: 0.14, ftype: 'bandpass' }); },
};

// ------------------------------------------------------------
//  Music: tiny step sequencer. All melodies are original.
//  token = one 8th note.  "-" holds the previous note, "." rests, "|" is ignored.
// ------------------------------------------------------------
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function nfreq(n) {
  const m = /^([A-G]#?)(\d)$/.exec(n);
  const midi = NOTE[m[1]] + (+m[2] + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function parseTrack(str) {
  const out = [];
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === '|') continue;
    if (tok === '-') { if (out.length) out[out.length - 1].len++; }
    else if (tok === '.') out.push({ f: 0, len: 1 });
    else out.push({ f: nfreq(tok), len: 1 });
  }
  return out;
}
const SONGS = {
  stage1: { bpm: 152, loop: true, tracks: [
    { type: 'square', vol: 0.15, gate: 0.85, notes: `
      C5 E5 G5 E5 F5 A5 G5 . | E5 G5 C6 B5 A5 G5 E5 . | F5 F5 A5 F5 E5 E5 G5 E5 | D5 E5 F5 D5 G5 - - . |
      C5 E5 G5 E5 F5 A5 G5 . | E5 G5 C6 D6 E6 D6 C6 . | A5 C6 B5 A5 G5 F5 E5 D5 | C5 - G4 - C5 - - .` },
    { type: 'triangle', vol: 0.3, gate: 0.7, notes: `
      C3 . G3 . C3 . G3 . | C3 . G3 . E3 . G3 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . B2 . |
      C3 . G3 . C3 . G3 . | A2 . E3 . A2 . E3 . | F2 . C3 . G2 . D3 . | C3 . G2 . C3 . . .` }] },
  stage2: { bpm: 140, loop: true, tracks: [
    { type: 'square', vol: 0.14, gate: 0.8, notes: `
      F5 . A5 C6 . A5 F5 . | G5 . A5 A#5 . A5 G5 . | E5 . G5 C6 . G5 E5 . | F5 G5 A5 G5 F5 - . . |
      D5 . F5 A5 . F5 D5 . | C5 . E5 G5 . A#5 A5 G5 | F5 . A5 G5 . E5 C5 . | F5 - - . C5 - F5 .` },
    { type: 'triangle', vol: 0.3, gate: 0.7, notes: `
      F2 . C3 . A2 . C3 . | C3 . G2 . C3 . E3 . | C3 . G2 . E3 . G2 . | F2 . C3 . F2 . A2 . |
      D3 . A2 . F3 . A2 . | C3 . G2 . A#2 . C3 . | F2 . C3 . C3 . G2 . | F2 . C3 . F2 . . .` }] },
  stage3: { bpm: 160, loop: true, tracks: [
    { type: 'square', vol: 0.13, gate: 0.8, notes: `
      A4 . C5 E5 A5 . G5 E5 | F5 . E5 D5 E5 - . . | A4 . C5 E5 A5 . B5 C6 | B5 . G5 E5 G5 - . . |
      F5 . A5 F5 E5 . G5 E5 | D5 . F5 D5 C5 . E5 C5 | B4 C5 D5 E5 F5 E5 D5 B4 | A4 - E4 - A4 - . .` },
    { type: 'triangle', vol: 0.32, gate: 0.6, notes: `
      A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 G2 G3 G2 G3 | A2 A3 A2 A3 A2 A3 A2 A3 | E2 E3 E2 E3 E2 E3 G#2 G#3 |
      F2 F3 F2 F3 C3 C4 C3 C4 | D2 D3 D2 D3 A2 A3 A2 A3 | E2 E3 E2 E3 E2 E3 E2 E3 | A2 A3 A2 A3 A2 . . .` }] },
  hammer: { bpm: 210, loop: true, tracks: [
    { type: 'square', vol: 0.12, gate: 0.7, notes: `C5 E5 G5 C6 G5 E5 C5 E5 | D5 F5 A5 D6 A5 F5 D5 F5 | E5 G5 B5 E6 B5 G5 E5 G5 | F5 A5 C6 F6 G5 B5 D6 G6` },
    { type: 'triangle', vol: 0.3, gate: 0.5, notes: `C3 . C4 . C3 . C4 . | D3 . D4 . D3 . D4 . | E3 . E4 . E3 . E4 . | F3 . F4 . G3 . G4 .` }] },
  start: { bpm: 180, loop: false, tracks: [
    { type: 'square', vol: 0.15, gate: 0.9, notes: `G4 C5 E5 G5 - E5 G5 - C6 - - .` },
    { type: 'triangle', vol: 0.3, gate: 0.8, notes: `C3 . G3 . C3 . G3 . C3 - - .` }] },
  clear: { bpm: 170, loop: false, tracks: [
    { type: 'square', vol: 0.15, gate: 0.9, notes: `C5 E5 G5 C6 . G5 C6 . E6 - D6 - C6 - - -` },
    { type: 'triangle', vol: 0.3, gate: 0.8, notes: `C3 . G3 . E3 . G3 . F3 - G3 - C3 - - -` }] },
  roundclear: { bpm: 160, loop: false, tracks: [
    { type: 'square', vol: 0.15, gate: 0.9, notes: `G5 E5 G5 C6 - B5 A5 B5 G5 - - . A5 F5 A5 D6 - C6 B5 C6 E6 - - . G6 - - - E6 - C6 - - - - -` },
    { type: 'triangle', vol: 0.3, gate: 0.8, notes: `C3 . G3 . C3 . G3 . G2 . D3 . G2 . D3 . F2 . C3 . F2 . C3 . C3 . G3 . E3 . G3 . C3 - - - - -` }] },
  death: { bpm: 200, loop: false, tracks: [
    { type: 'square', vol: 0.14, gate: 0.9, notes: `B5 A#5 A5 G#5 G5 F#5 F5 E5 . . C5 . G4 . C4 - -` }] },
  gameover: { bpm: 110, loop: false, tracks: [
    { type: 'square', vol: 0.14, gate: 0.9, notes: `E5 . D5 . C5 . B4 . A4 - - - . . . .` },
    { type: 'triangle', vol: 0.3, gate: 0.9, notes: `A2 - - - G2 - - - F2 - - - E2 - - -` }] },
};
for (const k in SONGS) for (const tr of SONGS[k].tracks) tr.ev = parseTrack(tr.notes);

const Music = {
  cur: null, curName: null, timer: null,
  play(name) {
    this.stop();
    if (!Snd.ac) return;
    const song = SONGS[name]; if (!song) return;
    const bus = Snd.ac.createGain(); bus.connect(Snd.bgmBus);
    const t0 = Snd.ac.currentTime + 0.06;
    this.curName = name;
    this.cur = { song, bus, tracks: song.tracks.map(tr => ({ tr, i: 0, t: t0 })) };
    this.timer = setInterval(() => this.pump(), 30);
    this.pump();
  },
  want(name) { if (this.curName !== name) this.play(name); },
  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    if (this.cur && Snd.ac) {
      const bus = this.cur.bus;
      bus.gain.setTargetAtTime(0, Snd.ac.currentTime, 0.015);
      setTimeout(() => bus.disconnect(), 400);
    }
    this.cur = null; this.curName = null;
  },
  pump() {
    const c = this.cur; if (!c || !Snd.ac) return;
    const spb = 60 / c.song.bpm / 2;
    const horizon = Snd.ac.currentTime + 0.2;
    let busy = false;
    for (const st of c.tracks) {
      while (st.t < horizon) {
        if (st.i >= st.tr.ev.length) { if (c.song.loop) st.i = 0; else break; }
        const e = st.tr.ev[st.i++], dur = e.len * spb;
        if (e.f) Snd.note(c.bus, e.f, st.t, dur * (st.tr.gate || 0.9), st.tr.type, st.tr.vol);
        st.t += dur;
      }
      if (c.song.loop || st.i < st.tr.ev.length) busy = true;
    }
    // a finished jingle keeps its name so want() doesn't restart it
    if (!busy) { clearInterval(this.timer); this.timer = null; }
  },
};

// ------------------------------------------------------------
//  Drawing helpers
// ------------------------------------------------------------
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rrect(x, y, w, h, r, fill, stroke = true) {
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) ctx.stroke();
}
function circ(x, y, r, fill, stroke = true) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) ctx.stroke();
}
function ell(x, y, rx, ry, fill, stroke = true, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) ctx.stroke();
}
// union of circles with a single outline (stroke wide, then fill over the inner half)
function blob(cs, fill) {
  const lw = ctx.lineWidth;
  ctx.lineWidth = lw * 2;
  for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, TAU); ctx.stroke(); }
  ctx.lineWidth = lw; ctx.fillStyle = fill;
  for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, TAU); ctx.fill(); }
}
function puff(x, y, r, fill) {
  blob([[x - r * .45, y - r * .35, r * .62], [x + r * .42, y - r * .4, r * .6], [x - r * .5, y + r * .38, r * .6],
    [x + r * .45, y + r * .38, r * .6], [x, y, r * .62]], fill);
}
function limb(x1, y1, x2, y2, w, fill) {
  const lw = ctx.lineWidth;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.lineWidth = w + lw * 2; ctx.strokeStyle = OL; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = fill; ctx.stroke();
  ctx.lineWidth = lw; ctx.strokeStyle = OL;
}

function fy(f, x) { return f.x2 === f.x1 ? f.y1 : f.y1 + (f.y2 - f.y1) * (x - f.x1) / (f.x2 - f.x1); }
function floorContains(f, x) {
  if (x < f.x1 - 0.01 || x > f.x2 + 0.01) return false;
  for (const g of f.gaps) if (g.active && x > g.a && x < g.b) return false;
  return true;
}
function floorAtSameHeight(x, y, tol = 2.5) {
  let best = null, bd = tol;
  for (const f of G.st.floors) {
    if (!floorContains(f, x)) continue;
    const d = Math.abs(fy(f, x) - y);
    if (d <= bd) { bd = d; best = f; }
  }
  return best;
}
function landFloor(x, y0, y1) {
  let best = null, by = Infinity;
  for (const f of G.st.floors) {
    if (!floorContains(f, x)) continue;
    const sy = fy(f, x);
    if (y0 <= sy + 0.6 && y1 >= sy && sy < by) { by = sy; best = f; }
  }
  return best;
}
function F(x1, y1, x2, y2, rollDir = 0, lv = 0) { return { kind: 'girder', x1, y1, x2, y2, rollDir, lv, gaps: [] }; }
function beam(st, y, a, b, w, phase, lv) {
  const bm = { kind: 'beam', x1: a, x2: a + w, y1: y, y2: y, w, mid: (a + b) / 2, amp: (b - a) / 2, phase, lv, gaps: [], rollDir: 0, dx: 0 };
  st.beams.push(bm); st.floors.push(bm);
  return bm;
}
// full ladder, or a broken one (two short stubs the player can't climb through)
function addLadder(st, x, upper, lower, broken = false, noEnemy = false) {
  const top = fy(upper, x), bot = fy(lower, x);
  st.descents.push({ x, upper, lower, top, bot });
  if (!broken) st.ladders.push({ x, top, bot, topExit: true, botExit: true, upper, lower, full: !noEnemy });
  else {
    st.ladders.push({ x, top: bot - 11, bot, topExit: false, botExit: true, upper: null, lower, full: false });
    st.ladders.push({ x, top, bot: top + 12, topExit: true, botExit: false, upper, lower: null, full: false });
  }
}

function drawGirder(x1, y1, x2, y2, T, kind) {
  const c = kind === 'beam' ? [COL.beam, COL.beamT, COL.beamH] : [COL.girder, COL.girderT, COL.girderH];
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x2, y2 + T); ctx.lineTo(x1, y1 + T); ctx.closePath();
  ctx.fillStyle = c[0]; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = c[1]; ctx.lineWidth = 0.75; ctx.lineJoin = 'round'; ctx.beginPath();
  const n = Math.max(2, Math.round((x2 - x1) / 6));
  for (let i = 0; i <= n; i++) {
    const xa = x1 + (x2 - x1) * i / n, ya = y1 + (y2 - y1) * i / n;
    const yy = i % 2 ? ya + T - 1.5 : ya + 1.5;
    if (i === 0) ctx.moveTo(xa, yy); else ctx.lineTo(xa, yy);
  }
  ctx.stroke();
  ctx.strokeStyle = c[2]; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x1, y1 + 0.9); ctx.lineTo(x2, y2 + 0.9); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = OL; ctx.lineWidth = LW; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x2, y2 + T); ctx.lineTo(x1, y1 + T); ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawFloor(f) {
  let x = f.x1;
  const gaps = f.gaps.filter(g => g.active).sort((a, b) => a.a - b.a);
  for (const g of gaps) { if (g.a > x) drawGirder(x, fy(f, x), g.a, fy(f, g.a), 6, f.kind); x = g.b; }
  if (f.x2 > x) drawGirder(x, fy(f, x), f.x2, fy(f, f.x2), 6, f.kind);
}
function drawLadder(x, top, bot) {
  ctx.save(); ctx.lineWidth = 0.65; ctx.strokeStyle = OL;
  for (let y = bot - 3.6; y > top + 0.8; y -= 4.4) rrect(x - 3.4, y - 0.75, 6.8, 1.5, 0.5, COL.ladder);
  rrect(x - 4.6, top, 1.9, bot - top, 0.8, COL.ladder);
  rrect(x + 2.7, top, 1.9, bot - top, 0.8, COL.ladder);
  ctx.restore();
}
function drawColumn(x, top, bot) {
  ctx.save(); ctx.lineWidth = LW; ctx.strokeStyle = OL;
  rrect(x - 4.2, top, 8.4, bot - top, 0.5, COL.column);
  ctx.fillStyle = COL.columnD; ctx.fillRect(x - 1.1, top + 1, 2.2, bot - top - 2);
  ctx.restore();
}
function cloud(x, y, s, col) {
  ctx.fillStyle = col;
  for (const [dx, dy, r] of [[-9, 2, 6], [-2, -3, 8], [7, 0, 6.5], [13, 3, 4.5], [-15, 4, 4]]) {
    ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); ctx.fill();

  ctx.fillRect(x - 15 * s, y + 2 * s, 28 * s, 6 * s);
}

function drawCraneBG() {
  ctx.save(); ctx.strokeStyle = 'rgba(214,140,50,0.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(206, 28, 8, 254);

function drawBackground(n) {
  const sky = [['#86cff7', '#e4f6ff'], ['#6fc0ee', '#fff1c8'], ['#ff9a73', '#ffe2a6']][n - 1];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (n === 3) { ctx.fillStyle = 'rgba(255,240,170,0.9)'; ctx.beginPath(); ctx.arc(176, 214, 22, 0, TAU); ctx.fill(); }
  else if (n === 1) { ctx.fillStyle = 'rgba(255,250,215,0.9)'; ctx.beginPath(); ctx.arc(30, 46, 10, 0, TAU); ctx.fill(); }
  const cc = n === 3 ? 'rgba(255,236,228,0.75)' : 'rgba(255,255,255,0.88)';
  for (const [x, y, s] of [[44, 116, 1], [176, 150, 0.85], [104, 196, 1.1], [196, 74, 0.7], [30, 232, 0.8]]) cloud(x, y, s, cc);
  ctx.fillStyle = n === 3 ? 'rgba(150,80,110,0.26)' : 'rgba(110,160,205,0.26)';
  for (const [x, w, h] of [[0, 30, 46], [26, 22, 30], [44, 26, 58], [66, 18, 38], [80, 30, 70], [106, 24, 44], [126, 20, 62], [142, 28, 36], [166, 22, 54], [184, 26, 40], [204, 20, 60]])
    ctx.fillRect(x, 282 - h, w, h);
  ctx.fillStyle = n === 3 ? '#d99a6c' : '#a6db78';
  ctx.beginPath(); ctx.moveTo(0, 288); ctx.lineTo(0, 262); ctx.quadraticCurveTo(40, 244, 88, 262);
  ctx.quadraticCurveTo(130, 246, 170, 260); ctx.quadraticCurveTo(200, 250, 224, 258); ctx.lineTo(224, 288); ctx.closePath(); ctx.fill();
  if (n === 1) drawBakery(170, 262);
  if (n === 2) drawCraneBG();
  ctx.fillStyle = n === 3 ? '#a4683e' : '#b98a5a'; ctx.fillRect(0, 283, W, 5);
}
function renderStatic() {
  const st = G.st; if (!st) return;
  if (!st.canvas) st.canvas = document.createElement('canvas');
  const c = st.canvas; c.width = cv.width; c.height = cv.height;
  const main = ctx; ctx = c.getContext('2d');
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  drawBackground(st.n);
  if (!st.collapsed) {
    for (const col of st.columns) drawColumn(col.x, col.y, 282);
    for (const L of st.ladders) drawLadder(L.x, L.top, L.bot);
  }
  for (const f of st.floors) if (f.kind !== 'beam') drawFloor(f);
  ctx = main;
}

const keys = {}, touchIn = {}, padIn = {};
const input = { left: false, right: false, up: false, down: false, jump: false, jumpPressed: false, confirm: false };
let jumpQueued = false, confirmQueued = false, prevJump = false, prevPadStart = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', Space: 'jump', KeyZ: 'jump', KeyX: 'jump', KeyJ: 'jump' };
window.addEventListener('keydown', e => {
  Snd.init();
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; if (k === 'jump' && !e.repeat) jumpQueued = true; e.preventDefault(); }
  if (e.code === 'Enter' && !e.repeat) { confirmQueued = true; e.preventDefault(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const dpadEl = document.getElementById('dpad'), jumpEl = document.getElementById('jumpBtn');
const arrowEls = { up: dpadEl.querySelector('.u'), down: dpadEl.querySelector('.d'), left: dpadEl.querySelector('.l'), right: dpadEl.querySelector('.r') };
let dpadPointer = null, jumpPointer = null;
function setDpad(e) {
  const r = dpadEl.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  touchIn.left = touchIn.right = touchIn.up = touchIn.down = false;
  if (Math.hypot(dx, dy) > r.width * 0.12) {
    // 4-way, slightly favouring horizontal so walking never grabs a ladder by accident
    if (Math.abs(dx) * 1.15 > Math.abs(dy)) touchIn[dx < 0 ? 'left' : 'right'] = true;
    else touchIn[dy < 0 ? 'up' : 'down'] = true;
  }

// stage 1: rolled up into a ball, zig-zags down the girders and sometimes drops down ladders

  if (p.hammerT > 0) {
    const hb = hammerBox(p);
    for (const e of G.enemies) if (!e.dead && overlap(hb, ebox(e))) smash(e);
  }
  for (const e of G.enemies) {
    if (e.dead || !overlap(pb, ebox(e))) continue;
    if (p.hammerT > 0 && (e.x - p.x) * p.dir >= -1) { smash(e); continue; }
    kill('enemy'); return;
  }
  const b = G.boss;
  if (b && overlap(pb, { x1: b.x - 7, x2: b.x + 7, y1: b.y - 24, y2: b.y })) kill('boss');
}
function updFx() {
  for (const f of G.fx) {
    f.t++;
    if (f.type === 'pop') { f.y -= 0.35; if (f.t > 48) f.dead = true; }
    else if (f.type === 'poof') { if (f.t > 24) f.dead = true; }
    else if (f.type === 'bolt') { f.vy += 0.15; f.x += f.vx; f.y += f.vy; f.r += f.vr; if (f.y > H + 10) f.dead = true; }
    else if (f.type === 'spark') { f.x += f.vx; f.y += f.vy; f.vy += 0.06; if (f.t > (f.life || 30)) f.dead = true; }
    else if (f.type === 'dust') { f.x += f.vx; f.y += f.vy; f.vx *= 0.94; f.vy *= 0.94; if (f.t > 40) f.dead = true; }
  }
  G.fx = G.fx.filter(f => !f.dead);
}
function poofAll() {
  for (const e of G.enemies) if (!e.dead) { G.fx.push({ type: 'poof', x: e.x, y: e.y - 4, t: 0 }); e.dead = true; }
  G.enemies = [];
  SFX.poof();
}

// ------------------------------------------------------------
//  Game flow
// ------------------------------------------------------------
function startGame() {
  G.round = 1; G.stageNo = 1; G.score = 0; G.lives = 3; G.extraGiven = false;
  beginStage();
}
function beginStage() {
  G.st = buildStage(G.stageNo);
  renderStatic();
  resetStage();
  G.state = 'intro'; G.stateT = 0; G.introShort = false;
  Music.play('start');
}
// (re)start the current stage; pulled bolts and eaten bread stay as they are
function resetStage() {
  const st = G.st;
  G.player = makePlayer(st);
  G.enemies = []; G.fx = []; G.debris = [];
  G.bonus = diff().bonusStart; G.bonusT = 0; G.t = 0; G.shake = 0;
  for (const h of st.hammers) h.taken = false;
  for (const b of st.beams) { b.x1 = b.mid; b.x2 = b.x1 + b.w; b.dx = 0; }
  G.boss = makeBoss(st);
  G.ufo = st.n === 2 ? makeUFO() : null;
  G.bat = { x: st.batako.x, y: fy(st.batako.f, st.batako.x), dir: 1, held: false };
}
function nextStage() {
  if (G.stageNo < 3) G.stageNo++;
  else { G.stageNo = 1; G.round++; }
  saveHi();
  beginStage();
}
function updBeams() {
  const sp = diff().beamSpeed;
  for (const b of G.st.beams) {
    const nx = b.mid + b.amp * Math.sin(b.phase + G.t * sp);
    b.dx = nx - b.x1; b.x1 = nx; b.x2 = nx + b.w;
  }
}

function update() {
  if (G.paused) { if (input.confirm) togglePause(false); return; }
  G.stateT++;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 0.15);
  switch (G.state) {
    case 'title': if (input.confirm) { SFX.select(); startGame(); } break;
    case 'intro': if (G.stateT > (G.introShort ? 90 : 165)) { G.state = 'play'; G.stateT = 0; } break;
    case 'play': updPlay(); break;
    case 'dying': updDying(); break;
    case 'clear': updClear(); break;
    case 'collapse': updCollapse(); break;
    case 'tally': updTally(); break;
    case 'gameover': if (G.stateT > 100 && input.confirm) { G.state = 'title'; G.stateT = 0; Music.stop(); } break;
  }
}
function updPlay() {
  const st = G.st, p = G.player;
  G.t++;
  updBeams();
  updatePlayer(p);
  if (G.state !== 'play') return;
  if (st.n === 1) updBoss1(G.boss);
  else if (st.n === 3) updBoss3(G.boss);
  else updUFO(G.ufo);
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.type === 'roll') updRoll(e); else if (e.type === 'walk') updWalker(e); else updLem(e);
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  checkPickups();
  if (st.n === 3) checkBolts();
  checkCollisions();
  updFx();
  if (G.state !== 'play') return;
  if (++G.bonusT >= 120) {
    G.bonusT = 0; G.bonus = Math.max(0, G.bonus - 100);
    if (G.bonus > 0 && G.bonus <= 1000) SFX.warn();
    if (G.bonus === 0) { kill('time'); return; }
  }
  if (st.n !== 3 && p.state === 'walk' && p.floor === st.goal) startClear();
  else if (st.n === 3 && st.bolts.every(b => b.out) && st.boltFloors.every(f => f.gaps.every(g => g.active))) startCollapse();
  if (G.state === 'play') Music.want(p.hammerT > 0 ? 'hammer' : 'stage' + st.n);
}
function updDying() {
  const t = G.stateT;
  updFx();
  if (t === 30) Music.play('death');
  if (t === 60) SFX.laugh();
  if (t >= 190) {
    G.lives--;
    if (G.lives <= 0) { G.state = 'gameover'; G.stateT = 0; Music.play('gameover'); saveHi(); }
    else { resetStage(); G.state = 'intro'; G.stateT = 0; G.introShort = true; }
  }
}

// --- stage 1 & 2 clear: reach Batako-san, then Baikinman snatches her away again ---
function startClear() {
  const p = G.player, bat = G.bat;
  G.state = 'clear'; G.stateT = 0;
  poofAll();
  p.hammerT = 0;
  p.dir = bat.x < p.x ? -1 : 1; bat.dir = -p.dir;
  Music.play('clear'); SFX.heart();
  const b = G.boss;
  if (b) { b.sx = b.x; b.sy = b.y; }
  if (G.ufo) { G.ufo.sx = G.ufo.x; G.ufo.sy = G.ufo.y; }
}
function updClear() {
  const t = G.stateT, bat = G.bat, b = G.boss, u = G.ufo;
  updFx();
  if (b) {   // stage 1: Baikinman flies over, grabs her and flies off
    if (t >= 100 && t < 140) {
      const k = (t - 100) / 40;
      b.state = 'fly'; b.dir = bat.x < b.sx ? -1 : 1;
      b.x = lerp(b.sx, bat.x + 3, k); b.y = lerp(b.sy, bat.y - 26, k) - Math.sin(k * Math.PI) * 24;
      if (t === 100) SFX.whoosh();
    } else if (t >= 140) {
      if (t === 140) { bat.held = true; SFX.breakHeart(); SFX.laugh(); }
      b.y -= 1.6; b.x += 0.4;
    }
  }
  if (u) {   // stage 2: the UFO swoops in and its magic hand picks her up
    if (t >= 100 && t < 140) {
      const k = (t - 100) / 40;
      u.x = lerp(u.sx, bat.x, k); u.y = lerp(u.sy, bat.y - 42, k);
      if (t === 100) SFX.whoosh();
    } else if (t >= 140 && t < 165) { u.hand = (t - 140) / 25; }
    else if (t >= 165) {
      if (t === 165) { bat.held = true; SFX.breakHeart(); SFX.laugh(); }
      u.y -= 1.6;
    }
  }
  if (bat.held) {
    if (b) { bat.x = b.x - 2; bat.y = b.y + 26; }
    if (u) { bat.x = u.x; bat.y = u.y + 42; }
  }
  if (t > 250) { G.state = 'tally'; G.stateT = 0; G.tallyWait = 0; }
}

// --- stage 3: every bolt is out, the frame collapses and Baikinman falls head first ---
function startCollapse() {
  const st = G.st, p = G.player;
  G.state = 'collapse'; G.stateT = 0;
  poofAll();
  p.hammerT = 0; p.state = 'walk';
  Music.stop();
  G.boss.state = 'stand';
  p.sx = p.x; p.sy = p.y;
}
function updCollapse() {
  const t = G.stateT, st = G.st, b = G.boss, p = G.player;
  updFx();
  for (const d of G.debris) { d.vy += 0.16; d.cy += d.vy; d.rot += d.vr; }
  G.debris = G.debris.filter(d => d.cy < H + 60);
  if (t < 60) {
    if (t % 12 === 0) SFX.rumble();
    G.shake = 2;
    if (t === 20) b.angry = true;
  }
  if (t === 60) {
    // floors (except ground and Batako's platform) and columns become falling debris
    for (const f of st.floors) {
      if (f === st.bottom || f === st.top) continue;
      let x = f.x1;
      const pieces = [];
      for (const g of f.gaps.filter(g => g.active).sort((a, c) => a.a - c.a)) { if (g.a > x) pieces.push([x, g.a]); x = g.b; }
      if (f.x2 > x) pieces.push([x, f.x2]);
      for (const [a, c] of pieces) G.debris.push({ kind: 'girder', w: c - a, cx: (a + c) / 2, cy: f.y1 + 3, vy: rand(-1.2, 0), rot: 0, vr: rand(-0.02, 0.02) });
    }
    for (const c of st.columns) G.debris.push({ kind: 'column', w: 282 - c.y, cx: c.x, cy: (c.y + 282) / 2, vy: rand(-0.5, 0), rot: 0, vr: rand(-0.015, 0.015) });
    st.floors = [st.bottom, st.top]; st.collapsed = true; st.ladders = []; st.items = []; st.hammers = [];
    renderStatic();
    SFX.crash(); G.shake = 4;
    b.state = 'fall'; b.vy = -1.5; b.rot = 0;
  }
  if (t > 60 && b.state === 'fall') {
    b.vy = Math.min(b.vy + 0.13, 4); b.y += b.vy;
    b.rot = Math.min(Math.PI, b.rot + 0.13);       // まっさかさま
    if (b.y >= st.bottom.y1 && b.rot >= Math.PI) {
      b.y = st.bottom.y1; b.state = 'crashed'; b.ct = 0;
      SFX.crash(); G.shake = 5;
      for (let i = 0; i < 12; i++) G.fx.push({ type: 'dust', x: b.x + rand(-10, 10), y: b.y - 2, vx: rand(-1.4, 1.4), vy: rand(-1.2, -0.2), t: 0 });
    }
  }
  if (b.state === 'crashed') {
    b.ct++;
    if (b.ct === 80) { b.state = 'byebye'; b.vy = -3.2; SFX.whoosh(); }
  }
  if (b.state === 'byebye') { b.bt = (b.bt || 0) + 1; b.y += b.vy; b.vy *= 0.995; b.rot += 0.35; b.x += 0.6; }
  // Jam leaps up beside Batako-san
  if (t >= 70 && t <= 130) {
    const k = (t - 70) / 60, tx = G.bat.x - 16, ty = st.top.y1;
    p.x = lerp(p.sx, tx, k); p.y = lerp(p.sy, ty, k) - Math.sin(k * Math.PI) * 50;
    p.dir = 1; p.state = k < 1 ? 'jump' : 'walk';
    if (t === 70) SFX.jump();
  }
  if (t === 130) G.bat.dir = -1;
  if (t === 140) { Music.play('roundclear'); SFX.heart(); }
  if (t > 420) { G.state = 'tally'; G.stateT = 0; G.tallyWait = 0; }
}
function updTally() {
  updFx();
  if (G.bonus > 0) {
    if (G.stateT % 2 === 0) { const d = Math.min(100, G.bonus); G.bonus -= d; addScore(d); SFX.tick(); }
  } else if (++G.tallyWait > 50) nextStage();
}

// ------------------------------------------------------------
//  Rendering
// ------------------------------------------------------------
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const k = VS * DPR;
  if (G.state === 'title') { ctx.setTransform(k, 0, 0, k, 0, 0); drawTitle(); return; }
  const sx = G.shake ? rand(-G.shake, G.shake) : 0, sy = G.shake ? rand(-G.shake, G.shake) : 0;
  if (sx || sy) ctx.drawImage(G.st.canvas, 0, 0);   // keeps the edges covered while shaking
  ctx.drawImage(G.st.canvas, sx * k, sy * k);
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  drawWorld();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawHUD();
  if (G.state === 'clear') {   // the snatch happens near the top edge: keep it in front of the HUD
    ctx.setTransform(k, 0, 0, k, sx * k, sy * k); drawBatakoScene(); drawBossScene(); drawBubbles();
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  if (G.state === 'intro') drawIntro();
  else if (G.state === 'tally') drawTally();
  else if (G.state === 'gameover') drawGameOver();
  if (G.paused) drawPause();
}
function sparkle(x, y) {
  ctx.fillStyle = '#fffbe0'; ctx.beginPath();
  ctx.moveTo(x, y - 2.5); ctx.lineTo(x + 0.7, y - 0.7); ctx.lineTo(x + 2.5, y); ctx.lineTo(x + 0.7, y + 0.7);
  ctx.lineTo(x, y + 2.5); ctx.lineTo(x - 0.7, y + 0.7); ctx.lineTo(x - 2.5, y); ctx.lineTo(x - 0.7, y - 0.7);
  ctx.closePath(); ctx.fill();
}
function drawWorld() {
  const st = G.st, T = G.t;
  for (const d of G.debris) {
    ctx.save(); ctx.translate(d.cx, d.cy); ctx.rotate(d.rot);
    if (d.kind === 'girder') drawGirder(-d.w / 2, -3, d.w / 2, -3, 6, 'girder'); else drawColumn(0, -d.w / 2, d.w / 2);
    ctx.restore();
  }
  for (const b of st.beams) drawBeamRig(b);
  const glow = 0.25 + 0.2 * Math.sin(G.stateT * 0.1);
  for (const b of st.bolts) if (!b.out) drawBolt(b.x, b.y + 3, 0, glow);
  for (const it of st.items) if (!it.got) { drawItem(it.type, it.x, it.y); if ((T + it.x * 3) % 90 < 14) sparkle(it.x + 4, it.y - 8); }
  for (const h of st.hammers) if (!h.taken) drawHammerItem(h.x, h.y, T);
  if (st.n === 1 && G.boss) for (const [dx, dy] of [[0, 0], [9, 0], [4.5, -8]]) drawKabiBall(206 + dx, st.throwFloor.y1 + dy, 0.3 * dx);
  drawBatakoScene();
  drawBossScene();
  for (const e of G.enemies) drawEnemy(e);
  drawPlayer();
  drawFx();
  drawBubbles();
}
function drawBeamRig(b) {
  const cx = (b.x1 + b.x2) / 2, hy = b.y1 - 15;
  ctx.save();
  ctx.strokeStyle = '#3b3b48'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(cx, 26); ctx.lineTo(cx, hy); ctx.lineTo(b.x1 + 2, b.y1); ctx.moveTo(cx, hy); ctx.lineTo(b.x2 - 2, b.y1); ctx.stroke();
  ctx.strokeStyle = OL; ctx.lineWidth = 0.6;
  rrect(cx - 4, 22, 8, 4.5, 1, COL.beam);
  circ(cx, hy, 1.5, COL.ladder);
  ctx.restore();
  drawGirder(b.x1, b.y1, b.x2, b.y2, 6, 'beam');
}
function drawMagicHand(x, y0, y1) {
  ctx.save(); ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x, y0);
  const n = 6;
  for (let i = 1; i <= n; i++) ctx.lineTo(x + (i === n ? 0 : i % 2 ? 2.4 : -2.4), lerp(y0, y1, i / n));
  ctx.strokeStyle = OL; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.strokeStyle = '#8d78b8'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.lineWidth = 0.7; ctx.strokeStyle = OL;
  circ(x, y1, 3, COL.bkPurple);
  ctx.restore();
}
function drawBatakoScene() {
  const bat = G.bat; if (!bat || bat.y < -40) return;
  const s = G.state, gt = G.stateT, n = G.st.n;
  const grabT = G.boss ? 140 : 165;
  const happy = (s === 'clear' && gt < grabT) || (s === 'collapse' && gt > 130) || (s === 'tally' && n === 3);
  drawBatako(bat.x, bat.y, bat.dir, { t: G.t + gt, wave: !happy && !bat.held, shout: !happy, hop: happy, held: bat.held });
  const p = G.player, beat = 1 + Math.sin(gt * 0.25) * 0.08;
  if (s === 'clear' && gt < grabT + 30) heart((bat.x + p.x) / 2, bat.y - 32, 8 * beat, gt > grabT ? (gt - grabT) / 15 : 0);
  if ((s === 'collapse' && gt > 140) || (s === 'tally' && n === 3)) heart((bat.x + p.x) / 2, bat.y - 32, 8 * beat);
}
function drawBossScene() {
  const b = G.boss, u = G.ufo, T = G.t + G.stateT;
  if (u) {
    if (u.y < -40) return;
    if (G.state === 'clear' && G.stateT >= 140) drawMagicHand(u.x, u.y + 7, lerp(u.y + 7, G.bat.y - 27, Math.min(1, u.hand || 0)));
    drawUFO(u.x, u.y, { t: T, arm: u.arm, pose: G.state === 'dying' ? 'laugh' : 'ufo' });
    return;
  }
  if (!b || b.y < -60) return;
  const poses = { idle: 'stand', walk: 'stand', grab: 'grab', lift: 'lift', throw: 'throw', fly: 'fly', byebye: 'fly' };
  let pose = poses[b.state] || 'stand';
  let dir = b.dir;
  if (G.st.n === 1 && b.state === 'grab') dir = 1;
  if (pose === 'stand' && (G.state === 'dying' || G.state === 'gameover' || (b.state === 'idle' && G.t % 300 < 50))) pose = 'laugh';
  let s = 0.66;
  if (b.state === 'byebye') {
    s = 0.66 * Math.max(0, 1 - (b.bt || 0) / 70);
    if (s < 0.1) { if ((b.bt >> 2) % 2 === 0) { ctx.lineWidth = 0.5; ctx.strokeStyle = OL; star5(b.x, b.y, 3, '#fff6a8'); } return; }
  }
  drawBaikin(b.x, b.y, dir, { t: T, pose, s, rot: b.rot || 0, angry: !!b.angry, dizzy: b.state === 'crashed' });
  if (b.state === 'lift') drawKabiBall(b.x, b.y - 26, 0);
  if (b.state === 'crashed') {
    ctx.lineWidth = 0.5; ctx.strokeStyle = OL;
    for (let i = 0; i < 3; i++) { const a = T * 0.15 + i * TAU / 3; star5(b.x + Math.cos(a) * 9, b.y - 3 + Math.sin(a) * 2.5, 2.2, '#ffe14d'); }
  }
}
function drawEnemy(e) {
  if (e.type === 'roll') {
    if (e.state !== 'wake') drawKabiBall(e.x, e.y, e.ang);
    else if (e.t < 18) drawKabiBall(e.x, e.y, Math.sin(e.t * 0.8) * 0.4);
    else { drawKabi(e.x, e.y, -1, { t: e.t }); text('!', e.x, e.y - 15, 8, '#e8483f', 'center', '#fff', 2); }
  } else if (e.state === 'arc') drawKabiBall(e.x, e.y, e.t * 0.3);
  else drawKabi(e.x, e.y, e.dir || 1, { t: e.t });
}
function drawPlayer() {
  const p = G.player; if (!p) return;
  if (p.state === 'dead') {
    const t = G.stateT;
    if (t < 30) drawJam(p.x, p.y, p.dir, { pose: 'jump' });
    else if (t < 80) drawJam(p.x, p.y, p.dir, { pose: 'stand', rot: (t - 30) * 0.4 });
    else {
      const ld = p.x < 30 ? -1 : p.x > W - 30 ? 1 : p.dir;   // which way his head points while lying down
      ctx.save(); ctx.translate(p.x, p.y - 4.5); ctx.rotate(-Math.PI / 2 * ld);
      drawJam(0, 0, ld, { pose: 'stand', dizzy: true });
      ctx.restore();
      ctx.lineWidth = 0.5; ctx.strokeStyle = OL;
      for (let i = 0; i < 3; i++) { const a = t * 0.12 + i * TAU / 3; star5(p.x - ld * 14 + Math.cos(a) * 7, p.y - 11 + Math.sin(a) * 2.5, 2, '#ffe14d'); }
    }
    return;
  }
  let pose = 'stand', ph = 0, ham = null;
  if (p.state === 'climb') { pose = 'climb'; ph = (p.climbT % 20) / 20; }
  else if (p.state === 'jump' || p.state === 'fall') pose = 'jump';
  else if (p.walkT > 0) { pose = 'walk'; ph = (p.walkT % 18) / 18; }
  if (p.hammerT > 0 && p.state !== 'climb') ham = hammerUp(p) ? 'up' : 'down';
  const s = G.state, happy = s === 'clear' || s === 'tally' || (s === 'collapse' && G.stateT > 130);
  if (happy && pose === 'walk') pose = 'stand';
  const fading = p.hammerT > 0 && p.hammerT < 120 && (p.hammerT >> 3) % 2 === 0;
  if (fading) ctx.globalAlpha = 0.6;
  drawJam(p.x, p.y, p.dir, { pose, ph, ham, happy: happy && pose !== 'jump' });
  ctx.globalAlpha = 1;
}
function drawFx() {
  for (const f of G.fx) {
    if (f.type === 'pop') text(f.text, f.x, f.y, f.big ? 9 : 6.5, f.big ? '#ff5d7a' : '#fff', 'center', OL, 2);
    else if (f.type === 'poof') {
      const k = f.t / 24;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = OL; ctx.lineWidth = 0.5;
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6; circ(f.x + Math.cos(a) * (2 + k * 9), f.y + Math.sin(a) * (2 + k * 7), 2.6 * (1 - k * 0.6), '#f4f1ea'); }
      ctx.restore();
    } else if (f.type === 'bolt') drawBolt(f.x, f.y, f.r);
    else if (f.type === 'dust') {
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - f.t / 40); circ(f.x, f.y, 2 + f.t * 0.12, '#d8c2a0', false); ctx.restore();
    }
  }
}
function drawBubbles() {
  const s = G.state, gt = G.stateT, bat = G.bat, b = G.boss, u = G.ufo, p = G.player;
  if (bat && !bat.held && (s === 'play' || s === 'intro') && G.t % 260 < 110) bubble(bat.x + 26, bat.y - 25, 'たすけてー！', 6, -18);
  if (s === 'clear') {
    const grabT = b ? 140 : 165;
    if (b && gt >= grabT && gt < grabT + 50) bubble(b.x - 34, Math.max(32, b.y), 'まだまだー！', 6, 26);
    if (gt >= grabT + 40) bubble(p.x, 30, 'まてー！ バイキンマン！', 6, 0);
  }
  if (s === 'dying' && gt > 60 && gt < 185) {
    if (b) bubble(b.x - 12, b.y - 34, 'は〜ひふ〜へほ〜！', 6, 8);
    else if (u) bubble(u.x - 12, u.y + 22, 'は〜ひふ〜へほ〜！', 6, null);
  }
  if (s === 'collapse') {
    if (gt > 8 && gt < 60) text('ゴゴゴゴ…', W / 2, 160, 12, '#fff', 'center', OL, 3);
    if (b.state === 'crashed' && b.ct > 10) bubble(b.x, b.y - 26, 'あいたたた…', 6, 0);
    if (b.state === 'byebye' && b.bt < 80) bubble(clamp(b.x, 50, 174), clamp(b.y - 22, 60, 240), 'ばいばいきーん！', 7, null);
  }
  if ((s === 'collapse' && gt > 150) || (s === 'tally' && G.st.n === 3)) bubble(bat.x + 48, bat.y - 22, 'ありがとう！ ジャムおじさん', 6, -44);
}

// ------------------------------------------------------------
//  HUD & overlays
// ------------------------------------------------------------
const pad6 = n => String(n).padStart(6, '0');
function drawHUD() {
  ctx.fillStyle = 'rgba(28,34,58,0.8)'; ctx.fillRect(0, 0, W, 21);
  text('SCORE', 4, 6.5, 5.2, '#ffd84d', 'left'); text(pad6(G.score), 4, 15, 7.5, '#fff', 'left');
  text('HI', 58, 6.5, 5.2, '#ffd84d', 'left'); text(pad6(G.hi), 58, 15, 7.5, '#fff', 'left');
  text('のこり', 110, 6.5, 5.2, '#ffd84d', 'left');
  beginChar(114, 17.4, 0.26, 1); jamHead(); endChar();
  text('×' + G.lives, 119, 15, 7, '#fff', 'left');
  text('ステージ', 140, 6.5, 5.2, '#ffd84d', 'left'); text(`${G.round}-${G.stageNo}`, 140, 15, 7.5, '#fff', 'left');
  ctx.lineWidth = 0.7; ctx.strokeStyle = OL;
  rrect(172, 2.5, 48, 16.5, 3, '#fff8e8');
  const low = G.bonus <= 1000 && G.state === 'play' && (G.t >> 4) % 2 === 0;
  text('BONUS', 196, 7.2, 5, '#e8483f'); text(String(G.bonus), 196, 14.6, 7.5, low ? '#e8483f' : OL);
}
function drawIntro() {
  ctx.save(); ctx.globalAlpha = Math.min(1, G.stateT / 10);
  ctx.fillStyle = 'rgba(20,24,40,0.35)'; ctx.fillRect(0, 21, W, H - 21);
  ctx.lineWidth = 1; ctx.strokeStyle = OL;
  if (G.introShort) {
    rrect(W / 2 - 54, 126, 108, 40, 8, 'rgba(255,248,232,0.96)');
    text('READY!', W / 2, 139, 11, '#e8483f');
    text('のこり ×' + G.lives, W / 2, 155, 7, OL);
  } else {
    rrect(W / 2 - 86, 106, 172, 82, 10, 'rgba(255,248,232,0.96)');
    text(`ROUND ${G.round}`, W / 2, 119, 7, '#e8483f');
    text(`ステージ ${G.stageNo}`, W / 2, 134, 12, OL);
    text(STAGE_NAMES[G.stageNo - 1], W / 2, 152, 9.5, '#2f6db5');
    text(STAGE_GOALS[G.stageNo - 1], W / 2, 171, 7, OL);
  }
  ctx.restore();
}
function drawTally() {
  ctx.lineWidth = 1; ctx.strokeStyle = OL;
  rrect(W / 2 - 64, 152, 128, 44, 8, 'rgba(255,248,232,0.96)');
  text(G.st.n === 3 ? 'ラウンド クリア！' : 'ステージ クリア！', W / 2, 165, 9, '#e8483f');
  text('ボーナス  ' + G.bonus, W / 2, 183, 8, OL);
}
function drawPause() {
  ctx.fillStyle = 'rgba(20,24,40,0.55)'; ctx.fillRect(0, 0, W, H);
  text('ポーズ', W / 2, 136, 16, '#fff', 'center', OL, 3);
  text(isTouch() ? 'タップで さいかい' : 'P キーで さいかい', W / 2, 158, 7, '#fff', 'center', OL, 2);
}
function drawGameOver() {
  ctx.save(); ctx.globalAlpha = Math.min(1, G.stateT / 30);
  ctx.fillStyle = 'rgba(20,24,40,0.6)'; ctx.fillRect(0, 0, W, H);
  drawBaikin(W / 2, 168, 1, { pose: 'laugh', t: G.stateT, s: 1.2 });
  bubble(W / 2 + 10, 98, 'は〜ひふ〜へほ〜！', 7, -10);
  text('ゲームオーバー', W / 2, 198, 17, '#fff', 'center', OL, 3.5);
  ctx.restore();
  if (G.stateT > 100 && (G.stateT >> 5) % 2 === 0) text(isTouch() ? 'タップで タイトルへ' : 'Enter / スペースで タイトルへ', W / 2, 224, 7, '#fff', 'center', OL, 2);
}
let titleCanvas = null;
function renderTitleBG() {
  titleCanvas = titleCanvas || document.createElement('canvas');
  titleCanvas.width = cv.width; titleCanvas.height = cv.height;
  const main = ctx; ctx = titleCanvas.getContext('2d');
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  drawBackground(1);
  drawLadder(148, 142, 222);
  drawGirder(62, 142, 162, 142, 6, 'girder');
  drawGirder(0, 222, 224, 222, 6, 'girder');
  ctx = main;
}
function drawTitle() {
  if (!titleCanvas || titleCanvas.width !== cv.width || titleCanvas.height !== cv.height) renderTitleBG();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(titleCanvas, 0, 0); ctx.restore();
  const t = G.stateT;
  text('ジャムおじさんの', W / 2, 40, 12, '#fff', 'center', OL, 3);
  const gr = ctx.createLinearGradient(0, 58, 0, 80); gr.addColorStop(0, '#ffe066'); gr.addColorStop(1, '#ff7a3d');
  ctx.font = `800 21px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 6.5; ctx.strokeStyle = '#fff'; ctx.strokeText('ビルだいさくせん', W / 2, 68);
  ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.strokeText('ビルだいさくせん', W / 2, 68);
  ctx.fillStyle = gr; ctx.fillText('ビルだいさくせん', W / 2, 68);
  text('〜 バタコさんを たすけだせ！ 〜', W / 2, 92, 7.5, '#fff', 'center', OL, 2.2);
  drawBatako(112, 142, 1, { t, wave: true, shout: true });
  bubble(138, 117, 'たすけてー！', 6, -18);
  drawJam(44, 222, 1, { pose: 'walk', ph: (t % 36) / 36, ham: Math.floor(t / 9) % 2 ? 'down' : 'up' });
  const kx = 104 + Math.sin(t * 0.02) * 14;
  drawKabi(kx, 222, Math.cos(t * 0.02) > 0 ? 1 : -1, { t });
  drawKabiBall(132, 222, t * 0.08);
  drawBaikin(186, 222, -1, { pose: 'laugh', t });
  if ((t >> 5) % 2 === 0) text(isTouch() ? '▶ タップして スタート' : '▶ Enter / スペースで スタート', W / 2, 245, 8.5, '#fff', 'center', OL, 2.5);
  text('HI-SCORE  ' + pad6(G.hi), W / 2, 262, 7, '#ffd84d', 'center', OL, 2);
  if (!isTouch()) text('← → いどう　↑ ↓ はしご　スペース ジャンプ', W / 2, 276, 5.6, '#fff', 'center', OL, 1.8);
}

// ------------------------------------------------------------
//  Layout (canvas + on-screen pad) and main loop
// ------------------------------------------------------------
function isTouch() { return document.body.classList.contains('touch'); }
function setTouchMode(on) { if (isTouch() !== on) { document.body.classList.toggle('touch', on); layout(); } }
const miniEl = document.getElementById('mini'), helpEl = document.getElementById('help');
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ds = dpadEl.style, js = jumpEl.style, ms = miniEl.style;
  let cx, cy, cw, ch;
  if (!isTouch()) {
    VS = Math.max(0.8, Math.min((vw - 24) / W, (vh - 64) / H));
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = Math.max(8, (vh - ch - 44) / 2);
    helpEl.style.top = (cy + ch + 14) + 'px';
    if (vw - (cx + cw) > 64) { ms.left = (cx + cw + 12) + 'px'; ms.top = cy + 'px'; ms.flexDirection = 'column'; }
    else { ms.left = (cx + cw - 94) + 'px'; ms.top = (cy + ch + 34) + 'px'; ms.flexDirection = 'row'; }
  } else if (vh >= vw * 1.15) {
    const ctrl = clamp(vh * 0.3, 170, 280);
    VS = Math.min(vw / W, (vh - ctrl - 12) / H);
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = Math.max(6, (vh - ctrl - ch) / 3);
    const top = cy + ch + 8, area = vh - top - 8;
    const D = Math.min(area * 0.9, vw * 0.44, 200), J = D * 0.64;
    ds.width = ds.height = D + 'px'; ds.left = (vw * 0.05) + 'px'; ds.top = (top + (area - D) / 2) + 'px';
    const jx = vw - vw * 0.06 - J, jy = top + (area - J) / 2 + D * 0.1;
    js.width = js.height = J + 'px'; js.left = jx + 'px'; js.top = jy + 'px'; js.fontSize = (J * 0.19) + 'px';
    ms.flexDirection = 'row'; ms.left = (jx + J / 2 - 47) + 'px'; ms.top = Math.max(top + 2, jy - 54) + 'px';
  } else {
    VS = Math.min((vw - 2 * clamp(vw * 0.24, 130, 230)) / W, (vh - 12) / H);
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = (vh - ch) / 2;
    const side = cx, D = Math.min(side * 0.85, vh * 0.42, 200), J = D * 0.68;
    ds.width = ds.height = D + 'px'; ds.left = ((side - D) / 2) + 'px'; ds.top = (vh - D - vh * 0.1) + 'px';
    js.width = js.height = J + 'px'; js.left = (cx + cw + (side - J) / 2) + 'px'; js.top = (vh - J - vh * 0.12) + 'px'; js.fontSize = (J * 0.19) + 'px';
    ms.flexDirection = 'row'; ms.left = (cx + cw + (side - 94) / 2) + 'px'; ms.top = '12px';
  }
  cv.style.left = cx + 'px'; cv.style.top = cy + 'px'; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  renderStatic();
  titleCanvas = null;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

let lastT = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { pollInput(); update(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}
document.body.classList.toggle('touch', matchMedia('(pointer: coarse)').matches);
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { titleCanvas = null; });
requestAnimationFrame(frame);
</script>
