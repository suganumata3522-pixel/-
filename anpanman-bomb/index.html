<!DOCTYPE html>

<style>

.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*.5);gap:calc(var(--u)*.26)}
.ov.show{display:flex}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.82) 0%,rgba(255,255,255,.5) 58%,rgba(255,255,255,.22) 100%)}

.logo span{display:block;letter-spacing:.02em}
.logo .a{font-size:calc(var(--u)*.92);color:#ffe03d;text-shadow:0 .07em 0 #8e1612,.06em 0 0 #d32f2f,-.06em 0 0 #d32f2f,0 .06em 0 #d32f2f,0 -.06em 0 #d32f2f,.045em .045em 0 #d32f2f,-.045em .045em 0 #d32f2f,.045em -.045em 0 #d32f2f,-.045em -.045em 0 #d32f2f}
.logo .b{font-size:calc(var(--u)*1.2);color:#fff;text-shadow:0 .08em 0 #8e1612,.07em 0 0 #e8322e,-.07em 0 0 #e8322e,0 .07em 0 #e8322e,0 -.07em 0 #e8322e,.05em .05em 0 #e8322e,-.05em .05em 0 #e8322e,.05em -.05em 0 #e8322e,-.05em -.05em 0 #e8322e}

#pause,#result{background:rgba(40,20,10,.5)}
#demoTag{position:absolute;left:50%;bottom:calc(var(--u)*.25);transform:translateX(-50%);display:none;white-space:nowrap;font-family:"Mochiy Pop One",sans-serif;font-size:calc(var(--u)*.3);color:#fff;background:rgba(232,50,46,.9);border:3px solid #fff;border-radius:999px;padding:.25em .9em}

#dpad .u{left:32.7%;top:0}#dpad .u::after{border-bottom-color:#e8322e;margin-top:-6px}

<body>
<div id="app">
  <div id="screen">
    <canvas id="cv"></canvas>
    <div id="title" class="ov show">
      <canvas id="logoBomb" width="160" height="160"></canvas>
      <div class="logo"><span class="a">ドッカン！</span><span class="b">アンパンボム</span></div>
      <p class="sub">顔ボムでバイキンたちをやっつけろ！</p>
      <button class="btn" id="btnStart">▶ スタート</button>
      <button class="btn sec" id="btnDemo">デモを見る</button>
      <div class="help">移動：矢印キー / WASD　ボム：スペース<br>スマホは下のボタンでそうさ</div>

  </div>
  <div id="pad">
    <div id="dpad"><div class="k u"></div><div class="k l"></div><div class="k hub"></div><div class="k r"></div><div class="k d"></div></div>

  </div>
</div>
<div id="sysbtns"><button id="btnPause" aria-label="ポーズ">⏸</button><button id="btnMute" aria-label="音">🔊</button></div>

<script>
'use strict';
(function () {
// =====================================================================
//  定数・ユーティリティ
// =====================================================================
const COLS = 11, ROWS = 13, N = COLS * ROWS, HUD_ROWS = 1.1;
const FLOOR = 0, HARD = 1, SOFT = 2;
const DX = [0, 0, 0, -1, 1], DY = [0, -1, 1, 0, 0], OPP = [0, 2, 1, 4, 3];
const BIT = [0, 4, 8, 1, 2];                 // 上=4 下=8 左=1 右=2 (中心=16)
const FUSE = 2.4, FLAME_DUR = 0.55, CHAIN_DELAY = 0.08, BREAK_TIME = 0.45, DT = 1 / 60;
const IT_BOMB = 1, IT_FIRE = 2, IT_SPEED = 3, IT_LIFE = 4;
const ITEM_LABEL = ['', '顔ボム+1', 'パンチ力UP', 'スピードUP', '顔+1'];
const FONT_POP = '"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
const FONT_UI = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// =====================================================================
//  ステージ ( # 壁 / . 床(箱が置かれるかも) / o 必ず空き / P 自分 / K カビルンルン / R バイキンロボ / B バイキンマン )
// =====================================================================
const STAGES = [
  { name: 'おひさまの丘', theme: 'hill', bgm: 'main', soft: 0.5, items: [IT_BOMB, IT_FIRE, IT_BOMB, IT_FIRE, IT_SPEED],
    map: ['###########',
          '#Poo.....K#',
          '#o#.#.#.#.#',
          '#o........#',
          '#.#.#.#.#.#',
          '#....o....#',
          '#.#.o#o.#.#',
          '#....o....#',
          '#.#.#.#.#.#',
          '#.........#',
          '#K#.#.#.#.#',
          '#o.......K#',
          '###########'] },
  { name: 'ジャムおじさんのパン工場', theme: 'bakery', bgm: 'main', soft: 0.62, items: [IT_BOMB, IT_FIRE, IT_SPEED, IT_BOMB, IT_FIRE, IT_LIFE],
    map: ['###########',
          '#Poo......#',
          '#o##.#.##.#',
          '#o........#',
          '#.#.#.#.#.#',
          '#...R....K#',
          '##.##.##.##',
          '#K........#',
          '#.#.#.#.#.#',
          '#.....R...#',
          '#.##.#.##.#',
          '#K.......K#',
          '###########'] },
  { name: 'バイキンの森', theme: 'forest', bgm: 'main', soft: 0.6, items: [IT_BOMB, IT_FIRE, IT_FIRE, IT_SPEED, IT_BOMB],
    map: ['###########',
          '#Poo..R...#',
          '#o#.#.#.#.#',
          '#o.#...#..#',
          '#.#.#.#.#.#',
          '#K..#R#..K#',
          '#.#.#.#.#.#',
          '#...#.#...#',
          '#.#.#.#.#.#',
          '#..#...#..#',
          '#R#.#.#.#.#',
          '#o..K....R#',
          '###########'] },
  { name: 'バイキン城', theme: 'castle', bgm: 'boss', soft: 0.32, boss: true, items: [IT_BOMB, IT_FIRE, IT_SPEED],
    map: ['###########',
          '#K.......K#',
          '#.#.#.#.#.#',
          '#....B....#',
          '#.#.o.o.#.#',
          '#...o.o...#',
          '#.#.#.#.#.#',
          '#.........#',
          '#.#.#.#.#.#',
          '#.........#',
          '#.#.#o#.#.#',
          '#...oPo...#',
          '###########'] },
];

const THEMES = {
  hill:   { floorA: '#a8dd7a', floorB: '#9dd46e', deco: 'flower', wall: 'brick', wallC: ['#d77a4e', '#b25634', '#f1b892'], pillar: 'tree', soft: 'crate', debris: ['#d9984f', '#a8682c'] },
  bakery: { floorA: '#f7e4c0', floorB: '#efd5a6', deco: 'tile', wall: 'brick', wallC: ['#c76944', '#a04a2b', '#ecb38c'], pillar: 'oven', soft: 'bread', debris: ['#e8a957', '#fff3dc'] },
  forest: { floorA: '#82ba6e', floorB: '#77af63', deco: 'leaf', wall: 'hedge', wallC: ['#3f7d45', '#2b5a31', '#62a463'], pillar: 'darktree', soft: 'bush', debris: ['#5aa851', '#2f6e2e'] },
  castle: { floorA: '#a99bc8', floorB: '#9e90be', deco: 'crack', wall: 'stone', wallC: ['#5a4d80', '#3a3157', '#7d6fa6'], pillar: 'stone', soft: 'junk', debris: ['#9d8bd3', '#5d4c96'] },
};

// =====================================================================
//  ゲーム本体（描画に依存しない決定論的シミュレーション）
// =====================================================================
class Game {
  constructor(opt = {}) {
    this.opt = opt;
    this.seed = (opt.seed != null ? opt.seed : Math.floor(Math.random() * 1e9)) >>> 0;
    this.rng = mulberry32(this.seed);
    this.stageList = opt.stages || STAGES.map((_, i) => i);
    this.stagePos = 0;
    this.introTime = opt.introTime != null ? opt.introTime : 1.8;
    this.clearTime = opt.clearTime != null ? opt.clearTime : 3.0;
    this.player = { lives: opt.lives || 3, score: 0, bombs: opt.bombs || 1, range: opt.range || 2, speedLv: opt.speedLv || 0 };
    this.input = { dir: 0, bomb: false };
    this.events = [];
    this.time = 0;
    this.bombLatch = false;
    this.nextId = 1;
    this.combo = 0; this.comboT = 9;
    this.loadStage();
  }
  get stage() { return STAGES[this.stageList[this.stagePos]]; }
  get stageNo() { return this.stageList[this.stagePos] + 1; }
  get isLastStage() { return this.stagePos >= this.stageList.length - 1; }
  emit(type, d = {}) { d.type = type; d.t = this.time; this.events.push(d); }
  playerSpeed() { return 3.7 + 0.5 * this.player.speedLv; }

  loadStage() {
    const st = this.stage, rng = this.rng;
    this.grid = new Uint8Array(N); this.hidden = new Uint8Array(N); this.items = new Uint8Array(N);
    this.flameT = new Float32Array(N); this.flameMask = new Uint8Array(N); this.flameStart = new Float32Array(N);
    this.breakingSet = new Uint8Array(N);
    this.bombs = []; this.breaking = []; this.enemies = [];
    const keep = new Uint8Array(N), spawns = [];
    let px = 1, py = 1;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = st.map[r][c], k = r * COLS + c;
      if (ch === '#') { this.grid[k] = HARD; continue; }
      if (ch === 'P') { px = c; py = r; keep[k] = 1; }
      else if (ch === 'o') keep[k] = 1;
      else if (ch === 'K' || ch === 'R' || ch === 'B') { spawns.push({ ch, c, r }); keep[k] = 1; }
    }
    for (const s of spawns) for (let d = 1; d <= 4; d++) {
      const k = (s.r + DY[d]) * COLS + s.c + DX[d];
      if (this.grid[k] !== HARD) keep[k] = 1;
    }
    const softCells = [];
    for (let k = 0; k < N; k++) {
      if (this.grid[k] !== FLOOR || keep[k]) continue;
      if (rng() < st.soft) { this.grid[k] = SOFT; softCells.push(k); }
    }
    shuffle(softCells, rng);
    st.items.forEach((it, i) => { if (i < softCells.length) this.hidden[softCells[i]] = it; });
    this.pl = { x: px, y: py, dir: 2, moving: false, anim: 0, state: 'alive', stateT: 0, inv: 0, active: 0 };
    for (const s of spawns) this.spawnEnemy(s.ch === 'K' ? 'kabi' : s.ch === 'R' ? 'robo' : 'boss', s.c, s.r);
    this.phase = 'intro'; this.phaseT = this.introTime; this.stageTime = 0;
    this.emit('stage_start', { stage: this.stagePos, no: this.stageNo, name: st.name, boss: !!st.boss });
  }

  spawnEnemy(kind, c, r, spawning) {
    const e = { id: this.nextId++, kind, x: c, y: r, tx: c, ty: r, fx: c, fy: r, dir: 2, anim: this.rng() * 10,
      dead: false, deadT: 0, idle: 0.3 + this.rng() * 0.6, spawnT: spawning ? 0.6 : 0 };
    if (kind === 'kabi') e.speed = 1.5;
    else if (kind === 'robo') e.speed = 2.3;
    else { e.speed = 1.55; e.hp = 3; e.inv = 0; e.state = 'enter'; e.stateT = 0; e.summonT = 7; e.idle = 0; }
    this.enemies.push(e);
    return e;
  }

  bombAt(c, r) { for (const b of this.bombs) if (b.c === c && b.r === r) return b; return null; }
  canWalk(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
    if (this.grid[r * COLS + c] !== FLOOR) return false;
    const b = this.bombAt(c, r);
    return !b || b.pass;
  }
  enemyCan(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
    return this.grid[r * COLS + c] === FLOOR && !this.bombAt(c, r);
  }

  // グリッド移動（角のすべり補正つき）
  move(e, dir, dist) {
    const horiz = dir >= 3, s = horiz ? DX[dir] : DY[dir];
    let m = horiz ? e.x : e.y, q = horiz ? e.y : e.x;
    const cell = (mm, qq) => (horiz ? this.canWalk(mm, qq) : this.canWalk(qq, mm));
    const qc = Math.round(q), off = q - qc;
    let mc = Math.round(m);
    if (Math.abs(off) <= 1e-4) q = qc;
    else if (cell(mc + s, qc)) {
      const a = Math.min(Math.abs(off), dist);
      q -= Math.sign(off) * a; dist -= a;
      if (Math.abs(q - qc) <= 1e-4) q = qc;
    } else {
      const so = Math.sign(off), q2 = qc + so;
      if (Math.abs(off) > 0.22 && cell(mc, q2) && cell(mc + s, q2)) q += so * Math.min(dist, Math.abs(q2 - q));
      dist = 0;
    }
    if (dist > 0 && q === qc) {
      mc = Math.round(m);
      if (cell(mc + s, qc)) m += s * dist;
      else m = s > 0 ? Math.min(m + dist, Math.max(m, mc)) : Math.max(m - dist, Math.min(m, mc));
    }
    if (horiz) { e.x = m; e.y = q; } else { e.y = m; e.x = q; }
  }

  placeBomb() {
    const pl = this.pl, c = Math.round(pl.x), r = Math.round(pl.y);
    if (pl.active >= this.player.bombs || this.bombAt(c, r) || this.grid[r * COLS + c] !== FLOOR) return false;
    this.bombs.push({ id: this.nextId++, c, r, t: FUSE, age: 0, range: this.player.range, pass: true, chained: false });
    pl.active++;
    this.emit('bomb', { c, r });
    return true;
  }

  explode(b) {
    this.bombs.splice(this.bombs.indexOf(b), 1);
    this.pl.active = Math.max(0, this.pl.active - 1);
    let centerMask = 16;
    for (let d = 1; d <= 4; d++) {
      const arm = []; let hitSoft = false;
      for (let i = 1; i <= b.range; i++) {
        const c = b.c + DX[d] * i, r = b.r + DY[d] * i, k = r * COLS + c, g = this.grid[k];
        if (g === HARD) break;
        if (g === SOFT) { if (!this.breakingSet[k]) this.breakBlock(k); hitSoft = true; break; }
        arm.push(k);
        const ob = this.bombAt(c, r);
        if (ob) { if (ob.t > CHAIN_DELAY) { ob.t = CHAIN_DELAY; ob.chained = true; } break; }
      }
      if (arm.length || hitSoft) centerMask |= BIT[d];
      arm.forEach((k, j) => this.addFlame(k, BIT[OPP[d]] | ((j < arm.length - 1 || hitSoft) ? BIT[d] : 0)));
    }
    this.addFlame(b.r * COLS + b.c, centerMask);
    this.emit('explode', { c: b.c, r: b.r, chain: b.chained, range: b.range });
  }
  addFlame(k, mask) {
    if (this.flameT[k] <= 0) this.flameMask[k] = 0;
    this.flameT[k] = FLAME_DUR; this.flameMask[k] |= mask; this.flameStart[k] = this.time;
  }
  breakBlock(k) {
    this.breakingSet[k] = 1;
    this.breaking.push({ k, c: k % COLS, r: (k / COLS) | 0, t: BREAK_TIME });
    this.player.score += 10;
    this.emit('break', { c: k % COLS, r: (k / COLS) | 0 });
  }

  step(dt = DT) {
    this.time += dt;
    const pl = this.pl;
    if (this.phase === 'intro') {
      this.phaseT -= dt;
      for (const e of this.enemies) e.anim += dt;
      if (this.phaseT <= 0) { this.phase = 'play'; this.emit('go'); }
      return;
    }
    if (this.phase === 'over' || this.phase === 'won') { pl.anim += dt; return; }
    this.stageTime += dt;
    if (this.phase === 'play') this.updatePlayer(dt);
    else { pl.anim += dt; pl.moving = false; if (pl.inv > 0) pl.inv -= dt; }

    for (const b of this.bombs) { b.t -= dt; b.age += dt; }
    for (let guard = 0; guard < 64; guard++) {
      let due = null;
      for (const b of this.bombs) if (b.t <= 0 && (!due || b.t < due.t)) due = b;
      if (!due) break;
      this.explode(due);
    }
    for (let k = 0; k < N; k++) if (this.flameT[k] > 0) {
      this.flameT[k] -= dt;
      if (this.flameT[k] <= 0) { this.flameT[k] = 0; this.flameMask[k] = 0; }
    }
    for (let i = this.breaking.length - 1; i >= 0; i--) {
      const br = this.breaking[i];
      br.t -= dt;
      if (br.t <= 0) {
        this.grid[br.k] = FLOOR; this.breakingSet[br.k] = 0;
        if (this.hidden[br.k]) { this.items[br.k] = this.hidden[br.k]; this.hidden[br.k] = 0; this.emit('reveal', { c: br.c, r: br.r, item: this.items[br.k] }); }
        this.breaking.splice(i, 1);
      }
    }
    this.comboT += dt;
    for (const e of this.enemies) {
      if (e.dead) { e.deadT += dt; continue; }
      e.anim += dt;
      if (e.kind === 'boss') this.updateBoss(e, dt); else this.updateWalker(e, dt);
    }
    this.checkHits();
    if (pl.state === 'alive') {
      const k = Math.round(pl.y) * COLS + Math.round(pl.x), it = this.items[k];
      if (it) { this.items[k] = 0; this.applyItem(it); this.emit('item', { item: it, c: k % COLS, r: (k / COLS) | 0 }); }
    }
    if (this.phase === 'play' && pl.state === 'alive' && this.enemies.length && this.enemies.every(e => e.dead)) {
      this.phase = 'clear'; this.phaseT = this.clearTime; pl.inv = 0;
      this.player.score += 1000;
      this.emit('stage_clear', { last: this.isLastStage, no: this.stageNo });
    }
    if (this.phase === 'clear') {
      this.phaseT -= dt;
      if (this.phaseT <= 0) {
        if (this.isLastStage) { this.phase = 'won'; this.emit('all_clear'); }
        else { this.stagePos++; this.loadStage(); }
      }
    }
  }

  updatePlayer(dt) {
    const pl = this.pl;
    if (pl.inv > 0) pl.inv -= dt;
    if (pl.state === 'hit') {
      pl.stateT -= dt;
      if (pl.stateT <= 0) {
        if (this.player.lives > 0) { pl.state = 'newface'; pl.stateT = 1.0; this.emit('new_face', { x: pl.x, y: pl.y }); }
        else { pl.state = 'gone'; this.phase = 'over'; this.emit('game_over'); }
      }
      return;
    }
    if (pl.state === 'newface') {
      pl.stateT -= dt;
      if (pl.stateT <= 0) { pl.state = 'alive'; pl.inv = 2.2; this.emit('genki', { x: pl.x, y: pl.y }); }
      return;
    }
    if (pl.state !== 'alive') return;
    const inp = this.input;
    if (inp.bomb && !this.bombLatch) this.placeBomb();
    this.bombLatch = !!inp.bomb;
    pl.moving = false;
    if (inp.dir) {
      pl.dir = inp.dir;
      const ox = pl.x, oy = pl.y;
      this.move(pl, inp.dir, this.playerSpeed() * dt);
      pl.moving = ox !== pl.x || oy !== pl.y;
    }
    if (pl.moving) pl.anim += dt;
    for (const b of this.bombs) if (b.pass && (Math.abs(pl.x - b.c) >= 0.98 || Math.abs(pl.y - b.r) >= 0.98)) b.pass = false;
  }

  hitPlayer(cause) {
    const pl = this.pl;
    pl.state = 'hit'; pl.stateT = 1.1; pl.moving = false;
    this.player.lives--;
    this.emit('hit', { cause, x: pl.x, y: pl.y, lives: this.player.lives });
  }

  updateWalker(e, dt) {
    if (e.spawnT > 0) { e.spawnT -= dt; return; }
    if (e.idle > 0) { e.idle -= dt; if (e.idle <= 0) this.chooseNext(e); return; }
    if (!this.enemyCan(e.tx, e.ty) && this.enemyCan(e.fx, e.fy)) {   // 進む先にボムが置かれたら引き返す
      const tx = e.tx, ty = e.ty;
      e.tx = e.fx; e.ty = e.fy; e.fx = tx; e.fy = ty; e.dir = OPP[e.dir];
    }
    const step = e.speed * dt, dx = e.tx - e.x, dy = e.ty - e.y;
    if (Math.abs(dx) + Math.abs(dy) <= step) { e.x = e.tx; e.y = e.ty; this.chooseNext(e); }
    else { e.x += Math.sign(dx) * Math.min(step, Math.abs(dx)); e.y += Math.sign(dy) * Math.min(step, Math.abs(dy)); }
  }
  chooseNext(e) {
    const c = Math.round(e.x), r = Math.round(e.y), opts = [];
    for (let d = 1; d <= 4; d++) {
      const nc = c + DX[d], nr = r + DY[d];
      if (this.enemyCan(nc, nr) && this.flameT[nr * COLS + nc] <= 0) opts.push(d);
    }
    if (!opts.length) { e.tx = c; e.ty = r; e.idle = 0.25; return; }
    let d = 0;
    const chase = e.kind === 'robo' ? 0.5 : e.kind === 'boss' ? 0.5 : 0.2;
    if (chase && this.pl.state === 'alive' && this.rng() < chase) d = this.stepToward(c, r, Math.round(this.pl.x), Math.round(this.pl.y), opts);
    if (!d) {
      const nonRev = opts.filter(o => o !== OPP[e.dir]);
      if (opts.indexOf(e.dir) >= 0 && this.rng() < 0.7) d = e.dir;
      else if (nonRev.length) d = nonRev[(this.rng() * nonRev.length) | 0];
      else d = opts[0];
    }
    e.dir = d; e.fx = c; e.fy = r; e.tx = c + DX[d]; e.ty = r + DY[d];
    if (e.kind === 'kabi' && this.rng() < 0.08) { e.tx = c; e.ty = r; e.idle = 0.4 + this.rng() * 0.6; }
  }
  stepToward(c, r, tc, tr, opts) {
    const start = r * COLS + c, goal = tr * COLS + tc;
    if (start === goal) return 0;
    const prev = new Int16Array(N).fill(-1); prev[start] = start;
    const q = [start]; let found = false;
    for (let qi = 0; qi < q.length && qi < 200; qi++) {
      const k = q[qi];
      if (k === goal) { found = true; break; }
      const kc = k % COLS, kr = (k / COLS) | 0;
      for (let d = 1; d <= 4; d++) {
        const nc = kc + DX[d], nr = kr + DY[d], nk = nr * COLS + nc;
        if (prev[nk] !== -1) continue;
        if (nk !== goal && !this.enemyCan(nc, nr)) continue;
        prev[nk] = k; q.push(nk);
      }
    }
    if (!found) return 0;
    let k = goal;
    while (prev[k] !== start) k = prev[k];
    const nc = k % COLS, nr = (k / COLS) | 0;
    for (const d of opts) if (c + DX[d] === nc && r + DY[d] === nr) return d;
    return 0;
  }
  updateBoss(e, dt) {
    if (e.inv > 0) e.inv -= dt;
    if (e.state === 'enter') { e.stateT += dt; if (e.stateT >= 1.3) { e.state = 'fight'; e.idle = 0.3; } return; }
    if (e.state === 'flyaway') { e.stateT += dt; if (e.stateT >= 2.3) { e.dead = true; e.deadT = 9; } return; }
    e.summonT -= dt;
    if (e.summonT <= 0) { e.summonT = 8.5; if (this.summon(e, 1)) this.emit('boss_laugh', { x: e.x, y: e.y }); }
    this.updateWalker(e, dt);
  }
  summon(boss, n) {
    const alive = this.enemies.filter(m => !m.dead && m.kind !== 'boss').length;
    let made = 0;
    for (let i = 0; i < n && alive + made < 3; i++) {
      const bc = Math.round(boss.x), br = Math.round(boss.y), cands = [];
      for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
        const md = Math.abs(c - bc) + Math.abs(r - br);
        if (md < 1 || md > 3 || !this.enemyCan(c, r) || this.flameT[r * COLS + c] > 0) continue;
        if (Math.abs(c - this.pl.x) + Math.abs(r - this.pl.y) < 4) continue;
        if (this.enemies.some(m => !m.dead && Math.round(m.x) === c && Math.round(m.y) === r)) continue;
        cands.push([c, r]);
      }
      if (!cands.length) break;
      const p = cands[(this.rng() * cands.length) | 0];
      this.spawnEnemy('kabi', p[0], p[1], true);
      made++;
    }
    return made > 0;
  }

  checkHits() {
    const pl = this.pl;
    const vuln = () => this.phase === 'play' && pl.state === 'alive' && pl.inv <= 0;
    if (vuln() && this.flameT[Math.round(pl.y) * COLS + Math.round(pl.x)] > 0) this.hitPlayer('fire');
    for (const e of this.enemies) {
      if (e.dead || (e.kind === 'boss' && e.state !== 'fight')) continue;
      if (this.flameT[Math.round(e.y) * COLS + Math.round(e.x)] > 0) this.damage(e);
    }
    if (vuln()) {
      for (const e of this.enemies) {
        if (e.dead || e.spawnT > 0 || (e.kind === 'boss' && e.state !== 'fight')) continue;
        const rad = e.kind === 'boss' ? 0.72 : 0.66;
        if (Math.abs(e.x - pl.x) < rad && Math.abs(e.y - pl.y) < rad) { this.hitPlayer('enemy'); break; }
      }
    }
  }
  damage(e) {
    if (e.kind === 'boss') {
      if (e.inv > 0) return;
      e.hp--; e.inv = 1.5; e.speed += 0.3;
      this.player.score += 500;
      if (e.hp <= 0) {
        e.state = 'flyaway'; e.stateT = 0;
        this.player.score += 5000;
        this.emit('boss_defeat', { x: e.x, y: e.y });
        for (const m of this.enemies) if (m !== e && !m.dead) this.kill(m, true);
      } else {
        this.emit('boss_hit', { x: e.x, y: e.y, hp: e.hp });
        this.summon(e, 1);
      }
      return;
    }
    this.kill(e);
  }
  kill(e, quiet) {
    e.dead = true; e.deadT = 0;
    if (quiet) { this.emit('poof', { x: e.x, y: e.y, kind: e.kind }); return; }
    this.combo = this.comboT < 0.7 ? this.combo + 1 : 1; this.comboT = 0;
    const pts = (e.kind === 'robo' ? 200 : 100) * this.combo;
    this.player.score += pts;
    this.emit('enemy_die', { x: e.x, y: e.y, kind: e.kind, combo: this.combo, pts });
  }
  applyItem(it) {
    const p = this.player;
    if (it === IT_BOMB) p.bombs = Math.min(8, p.bombs + 1);
    else if (it === IT_FIRE) p.range = Math.min(8, p.range + 1);
    else if (it === IT_SPEED) p.speedLv = Math.min(4, p.speedLv + 1);
    else if (it === IT_LIFE) p.lives = Math.min(9, p.lives + 1);
    p.score += 50;
  }
}

// =====================================================================
//  オートプレイAI（デモ／動画用）
// =====================================================================
class Bot {
  constructor() { this.goal = -1; this.ban = new Map(); this.cool = 0; this.t = 0; this.stuckT = 0; this.lastK = -1; }

  // 爆発の予測（連鎖・箱の破壊タイミングも考慮した小さなシミュレーション）
  danger(g, extra) {
    const ds = new Float32Array(N).fill(Infinity), de = new Float32Array(N).fill(-Infinity), doomed = new Uint8Array(N);
    for (let k = 0; k < N; k++) if (g.flameT[k] > 0) { ds[k] = 0; de[k] = g.flameT[k]; }
    const rem = new Float32Array(N).fill(Infinity);
    for (const b of g.breaking) { rem[b.k] = b.t; doomed[b.k] = 1; }
    const bs = g.bombs.map(b => ({ c: b.c, r: b.r, t: Math.max(0, b.t), range: b.range, done: false }));
    if (extra) bs.push({ c: extra.c, r: extra.r, t: extra.t, range: extra.range, done: false });
    for (;;) {
      let b = null;
      for (const x of bs) if (!x.done && (!b || x.t < b.t)) b = x;
      if (!b) break;
      b.done = true;
      const T = b.t;
      const mark = k => { if (T < ds[k]) ds[k] = T; if (T + FLAME_DUR > de[k]) de[k] = T + FLAME_DUR; };
      mark(b.r * COLS + b.c);
      for (let d = 1; d <= 4; d++) for (let i = 1; i <= b.range; i++) {
        const c = b.c + DX[d] * i, r = b.r + DY[d] * i, k = r * COLS + c;
        let cell = g.grid[k];
        if (cell === SOFT && rem[k] <= T) cell = FLOOR;
        if (cell === HARD) break;
        if (cell === SOFT) { if (rem[k] === Infinity) rem[k] = T + BREAK_TIME; doomed[k] = 1; break; }
        mark(k);
        const ob = bs.find(x => !x.done && x.c === c && x.r === r);
        if (ob) { if (ob.t > T + CHAIN_DELAY) ob.t = T + CHAIN_DELAY; break; }
      }
    }
    return { ds, de, doomed };
  }
  bfs(g, D, start, avoid) {
    const pl = g.pl, step = 1 / g.playerSpeed();
    const dist = new Int16Array(N).fill(-1), prev = new Int16Array(N).fill(-1), tarr = new Float32Array(N);
    const sc = start % COLS, sr = (start / COLS) | 0;
    dist[start] = 0; tarr[start] = (Math.abs(pl.x - sc) + Math.abs(pl.y - sr)) * step;
    const q = [start];
    for (let qi = 0; qi < q.length; qi++) {
      const k = q[qi], c = k % COLS, r = (k / COLS) | 0;
      for (let d = 1; d <= 4; d++) {
        const nc = c + DX[d], nr = r + DY[d], nk = nr * COLS + nc;
        if (dist[nk] >= 0 || g.grid[nk] !== FLOOR || g.bombAt(nc, nr)) continue;
        if (avoid && avoid[nk]) continue;
        let ta;
        if (k === start) {
          // 実際の位置から隣のマスまでの距離で到着時間を計算
          ta = (Math.abs(pl.x - nc) + Math.abs(pl.y - nr)) * step;
          if (D && D.ds[start] > 0 && D.ds[start] !== Infinity && ta - 0.5 * step > D.ds[start] - 0.08) continue;
        } else ta = tarr[k] + step;
        if (D) { const a = ta - step * 0.6, b = ta + step * 0.6; if (!(b < D.ds[nk] - 0.1 || a > D.de[nk] + 0.1)) continue; }
        dist[nk] = dist[k] + 1; prev[nk] = k; tarr[nk] = ta; q.push(nk);
      }
    }
    return { dist, prev, tarr, step };
  }
  pathTo(B, from, to) { const p = [to]; let k = to; while (k !== from && B.prev[k] >= 0) { k = B.prev[k]; p.push(k); } return p.reverse(); }
  safeStand(D, B, k) { return D.ds[k] === Infinity || B.tarr[k] - B.step * 0.6 > D.de[k] + 0.12; }
  escape(g, D, start, avoid) {
    const B = this.bfs(g, D, start, avoid);
    let best = -1, bestD = 1e9;
    for (let k = 0; k < N; k++) {
      const d = B.dist[k];
      if (d < 0 || d >= bestD || !this.safeStand(D, B, k)) continue;
      best = k; bestD = d;
    }
    return best >= 0 ? this.pathTo(B, start, best) : null;
  }
  liveEnemies(g) { return g.enemies.filter(e => !e.dead && !(e.kind === 'boss' && e.state !== 'fight')); }
  avoidMap(g, selfK) {
    const a = new Uint8Array(N);
    const mark = (c, r) => { if (c > 0 && r > 0 && c < COLS - 1 && r < ROWS - 1) a[r * COLS + c] = 1; };
    for (const e of this.liveEnemies(g)) {
      const ec = Math.round(e.x), er = Math.round(e.y);
      mark(ec, er); mark(e.tx, e.ty);
      for (let d = 1; d <= 4; d++) mark(ec + DX[d], er + DY[d]);
      if (e.kind === 'boss') { for (let d = 1; d <= 4; d++) mark(e.tx + DX[d], e.ty + DY[d]); mark(e.tx + DX[e.dir], e.ty + DY[e.dir]); }
    }
    a[selfK] = 0;
    return a;
  }
  bombValue(g, D, c, r) {
    let soft = 0, enemy = 0;
    const cells = [r * COLS + c];
    for (let d = 1; d <= 4; d++) for (let i = 1; i <= g.player.range; i++) {
      const cc = c + DX[d] * i, rr = r + DY[d] * i, k = rr * COLS + cc, cell = g.grid[k];
      if (cell === HARD) break;
      if (cell === SOFT) { if (!D.doomed[k]) soft++; break; }
      cells.push(k);
      if (g.bombAt(cc, rr)) break;
    }
    for (const e of this.liveEnemies(g)) {
      if (e.kind === 'boss' && e.inv > 0.6) continue;
      const ek = Math.round(e.y) * COLS + Math.round(e.x), tk = e.ty * COLS + e.tx;
      if (cells.indexOf(ek) >= 0 || cells.indexOf(tk) >= 0) enemy += e.kind === 'boss' ? 2 : 1;
    }
    return { soft, enemy, total: soft + enemy };
  }
  edist(e, x, y) { return Math.abs(e.x - x) + Math.abs(e.y - y) - (e.kind === 'boss' ? 0.8 : e.kind === 'robo' ? 0.3 : 0); }
  threat(g) {
    let m = 99;
    for (const e of this.liveEnemies(g)) m = Math.min(m, Math.abs(e.x - g.pl.x) + Math.abs(e.y - g.pl.y) - (e.kind === 'boss' ? 0.8 : 0) - (e.kind === 'robo' ? 0.3 : 0));
    return m;
  }
  steer(g, path, out) {
    const pl = g.pl;
    if (!path || !path.length) return out;
    const c = Math.round(pl.x), r = Math.round(pl.y);
    if (path.length === 1) {
      if (Math.abs(pl.x - c) > 0.12) out.dir = pl.x < c ? 4 : 3;
      else if (Math.abs(pl.y - r) > 0.12) out.dir = pl.y < r ? 2 : 1;
      return out;
    }
    const nk = path[1], nc = nk % COLS, nr = (nk / COLS) | 0;
    out.dir = nc > c ? 4 : nc < c ? 3 : nr > r ? 2 : 1;
    return out;
  }
  update(g) {
    const out = { dir: 0, bomb: false };
    this.t += DT;
    if (this.cool > 0) this.cool -= DT;
    const pl = g.pl;
    if (g.phase !== 'play' || pl.state !== 'alive') { this.goal = -1; return out; }
    const c = Math.round(pl.x), r = Math.round(pl.y), k = r * COLS + c;
    const D = this.danger(g, null);
    const avoid = this.avoidMap(g, k);

    const bv = this.bombValue(g, D, c, r);
    // 1) 危ない！逃げる（余裕があれば連鎖ボムを置いてから）
    if (D.ds[k] !== Infinity) {
      if (D.ds[k] > 0.9 && bv.total >= 1 && pl.active < g.player.bombs && !g.bombAt(c, r) && this.cool <= 0) {
        const D2 = this.danger(g, { c, r, t: FUSE, range: g.player.range });
        const p2 = this.escape(g, D2, k, avoid);
        if (p2 && p2.length <= 6) { out.bomb = true; this.cool = 0.3; this.goal = -1; return this.steer(g, p2, out); }
      }
      const p = this.escape(g, D, k, avoid) || this.escape(g, D, k, null);
      return this.steer(g, p, out);
    }
    // 2) ここにボムを置く？
    const th = this.threat(g);
    const want = bv.total >= 2 || (bv.total >= 1 && this.goal === k) || bv.enemy > 0;
    if (want && pl.active < g.player.bombs && !g.bombAt(c, r) && this.cool <= 0 && !(this.ban.get(k) > this.t)) {
      const D2 = this.danger(g, { c, r, t: FUSE, range: g.player.range });
      const p = this.escape(g, D2, k, avoid);
      if (p && p.length <= 7) { out.bomb = true; this.cool = 0.3; this.goal = -1; return this.steer(g, p, out); }
      this.ban.set(k, this.t + 2.5);
    }
    // 3) 敵が近い → 離れる
    if (th < 1.7) {
      const B = this.bfs(g, D, k, avoid);
      let best = k, bestS = -1e9;
      const es = this.liveEnemies(g);
      for (let nk = 0; nk < N; nk++) {
        const d = B.dist[nk];
        if (d < 0 || d > 6 || !this.safeStand(D, B, nk)) continue;
        const ncx = nk % COLS, nry = (nk / COLS) | 0;
        let md = 99;
        for (const e of es) md = Math.min(md, this.edist(e, ncx, nry));
        const s = Math.min(md, 4) * 3 - d;
        if (s > bestS) { bestS = s; best = nk; }
      }
      if (best !== k) return this.steer(g, this.pathTo(B, k, best), out);
    }
    // 4) 目的地を決める（アイテム / ボムを置く場所 / 敵に近づく）
    let B = this.bfs(g, D, k, avoid);
    let pick = this.chooseGoal(g, D, B, k);
    if (pick.best < 0) { B = this.bfs(g, D, k, null); pick = this.chooseGoal(g, D, B, k); }
    if (pick.best >= 0) {
      // 立ち往生チェック
      if (k === this.lastK) this.stuckT += DT; else { this.stuckT = 0; this.lastK = k; }
      if (this.stuckT > 4 && pick.best !== k) { this.ban.set(pick.best, this.t + 4); this.stuckT = 0; }
      this.goal = pick.best;
      return this.steer(g, this.pathTo(B, k, pick.best), out);
    }
    return out;
  }
  chooseGoal(g, D, B, k) {

      let s = -1e9;

      for (const e of es) md = Math.min(md, this.edist(e, nk % COLS, (nk / COLS) | 0));
      if (s < 0 && es.length && md >= 2) s = -20 - Math.abs(md - 2.5) * 4 - d * 0.5;
      if (md < 1.6) s -= 14;

// =====================================================================
//  描画ヘルパー
// =====================================================================
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

  ctx.bezierCurveTo(x + s * 0.32, y - s * 0.56, x + s * 0.62, y - s * 0.02, x, y + s * 0.38);

}
function otext(ctx, s, x, y, o) {
  ctx.font = (o.weight ? o.weight + ' ' : '') + Math.max(1, Math.round(o.size)) + 'px ' + (o.font || FONT_POP);

// ---- 共通 ----
const INK = '#24160e';
function hiMark(ctx, x, y, w, h, rot) {   // 白いハイライト（角丸の四角）
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  rrect(ctx, -w / 2, -h / 2, w, h, Math.min(w, h) * 0.35); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
  ctx.restore();
}
function limb(ctx, x1, y1, x2, y2, w, col, lw) {   // ふちどり付きの太い線（うで・あし）
  ctx.lineCap = 'round';

// ---- アンパンマンの顔 ----
function drawAnpanFace(ctx, x, y, R, o) {
  o = o || {};
  const fx = (o.look || 0) * R * 0.22, fy = (o.lookY || 0) * R * 0.1, expr = o.expr || 'smile';
  const lw = Math.max(1, R * 0.07);

  if (o.rot) ctx.rotate(o.rot);

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const g = ctx.createRadialGradient(-R * 0.38, -R * 0.45, R * 0.08, 0, 0, R * 1.05);
  g.addColorStop(0, '#f4c38c'); g.addColorStop(0.55, '#e3a367'); g.addColorStop(1, '#cf8a4c');
  circle(ctx, 0, 0, R); ctx.fillStyle = g; ctx.fill();
  ctx.save(); circle(ctx, 0, 0, R); ctx.clip();
  ctx.strokeStyle = INK;

    const cx = s * R * 0.47 + fx * 0.85, cy = R * 0.08 + fy, r = R * 0.235;
    circle(ctx, cx, cy, r); ctx.fillStyle = '#f65a33'; ctx.fill(); ctx.lineWidth = lw * 0.7; ctx.stroke();

  }

  circle(ctx, nx, ny, nr); ctx.fillStyle = '#ee3b1c'; ctx.fill(); ctx.lineWidth = lw * 0.75; ctx.stroke();
  hiMark(ctx, nx - nr * 0.34, ny - nr * 0.4, nr * 0.46, nr * 0.28, -0.45);
  ctx.fillStyle = INK;
  for (const s of [-1, 1]) {                       // め・まゆげ
    const ex = s * R * 0.28 + fx, ey = -R * 0.28 + fy;
    if (expr === 'happy') { ctx.lineWidth = R * 0.08; ctx.beginPath(); ctx.arc(ex, ey + R * 0.06, R * 0.085, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (expr === 'squeeze') { const a = R * 0.08; ctx.lineWidth = R * 0.075; ctx.beginPath(); ctx.moveTo(ex + s * a, ey - a); ctx.lineTo(ex - s * a, ey); ctx.lineTo(ex + s * a, ey + a); ctx.stroke(); }

    else ctx.arc(ex, -R * 0.47 + fy, R * 0.125, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();
  }
  const mx = fx;                                   // くち
  if (expr === 'squeeze') {
    ellipse(ctx, mx, R * 0.58 + fy, R * 0.1, R * 0.12); ctx.fillStyle = '#8f2418'; ctx.fill(); ctx.lineWidth = lw * 0.6; ctx.stroke();
  } else if (expr === 'sad') {
    ctx.lineWidth = R * 0.07; ctx.beginPath(); ctx.arc(mx, R * 0.72 + fy, R * 0.2, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
  } else {
    const mouth = () => {
      ctx.beginPath();
      ctx.moveTo(mx - R * 0.32, R * 0.44 + fy);
      ctx.quadraticCurveTo(mx, R * 0.5 + fy, mx + R * 0.32, R * 0.44 + fy);
      ctx.bezierCurveTo(mx + R * 0.31, R * 0.67 + fy, mx + R * 0.18, R * 0.83 + fy, mx, R * 0.83 + fy);
      ctx.bezierCurveTo(mx - R * 0.18, R * 0.83 + fy, mx - R * 0.31, R * 0.67 + fy, mx - R * 0.32, R * 0.44 + fy);
      ctx.closePath();
    };
    mouth(); ctx.fillStyle = '#8f2418'; ctx.fill();
    ctx.save(); mouth(); ctx.clip(); ellipse(ctx, mx, R * 0.84 + fy, R * 0.2, R * 0.13); ctx.fillStyle = '#e0584a'; ctx.fill(); ctx.restore();
    mouth(); ctx.lineWidth = lw * 0.75; ctx.stroke();
  }
  ctx.restore();
  circle(ctx, 0, 0, R); ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
  if (o.tint) { circle(ctx, 0, 0, R); ctx.fillStyle = o.tint; ctx.fill(); }
  ctx.restore();
}

// ---- 顔ボム ----
function drawFaceBomb(ctx, x, y, T, b) {
  const p = clamp(1 - b.t / FUSE, 0, 1), R = T * 0.37;
  const sc = 1 + Math.sin(b.age * (6 + p * 18)) * (0.035 + p * 0.05);

  const sy = (2 - sc) * pop;
  const fx0 = x + R * 0.12, fy0 = cy - R * 0.9 * sy;
  const fx1 = x + R * (0.12 + 0.44 * L) * pop, fy1 = fy0 - R * 0.55 * L * pop;

  ctx.strokeStyle = '#7a5230'; ctx.lineWidth = T * 0.055; ctx.stroke();
  const tintA = p > 0.55 ? (p - 0.55) * 0.9 * (0.6 + 0.4 * Math.sin(b.age * 40)) : 0;
  drawAnpanFace(ctx, x, cy, R, { sx: sc * pop, sy, expr: b.t < 0.65 ? 'squeeze' : 'smile', tint: tintA > 0 ? 'rgba(255,40,20,' + tintA.toFixed(3) + ')' : null });

  starPath(ctx, fx1, fy1, sr * 1.5, sr * 0.6, 6, b.age * 8); ctx.fillStyle = '#ff9f1a'; ctx.fill();
  starPath(ctx, fx1, fy1, sr * 0.9, sr * 0.35, 6, -b.age * 6); ctx.fillStyle = '#fff6a8'; ctx.fill();
}
function drawMiniBomb(ctx, x, y, R) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + R * 0.15, y - R * 0.9); ctx.quadraticCurveTo(x + R * 0.2, y - R * 1.3, x + R * 0.55, y - R * 1.35);
  ctx.strokeStyle = INK; ctx.lineWidth = R * 0.16 + 2; ctx.stroke(); ctx.strokeStyle = '#7a5230'; ctx.lineWidth = R * 0.16; ctx.stroke();
  drawAnpanFace(ctx, x, y, R, {});
  starPath(ctx, x + R * 0.58, y - R * 1.38, R * 0.36, R * 0.15, 6, 0.3); ctx.fillStyle = '#ffb11a'; ctx.fill();
}

// ---- アンパンマン（プレイヤー）----
function drawAnpanman(ctx, x, y, T, o) {
  const u = T, dir = o.dir || 2, side = dir === 3 ? -1 : dir === 4 ? 1 : 0, back = dir === 1;
  const walk = o.moving ? Math.sin(o.anim * 12) : 0;
  const bob = (o.moving ? -Math.abs(Math.sin(o.anim * 12)) * 0.04 * u : 0) - (o.jump || 0) * u;
  const flap = Math.sin(o.anim * 14 + 1) * (o.moving ? 1 : 0.35);

  ctx.save();

  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = lw;
  const fs = col => { ctx.fillStyle = col; ctx.fill(); ctx.stroke(); };
  if (!back) {                                     // マント（うしろ）
    ctx.beginPath();
    if (side === 0) {
      ctx.moveTo(-0.13 * u, 0.08 * u);
      ctx.quadraticCurveTo(-0.26 * u, 0.18 * u, (-0.31 - flap * 0.02) * u, 0.39 * u);
      ctx.quadraticCurveTo(0, 0.35 * u, (0.31 + flap * 0.02) * u, 0.39 * u);
      ctx.quadraticCurveTo(0.26 * u, 0.18 * u, 0.13 * u, 0.08 * u);
    } else {
      const s = -side;
      ctx.moveTo(s * 0.02 * u, 0.07 * u);
      ctx.quadraticCurveTo(s * 0.3 * u, 0.08 * u, s * (0.44 + flap * 0.05) * u, (0.3 + flap * 0.03) * u);
      ctx.quadraticCurveTo(s * 0.28 * u, 0.42 * u, s * 0.02 * u, 0.36 * u);
    }
    ctx.closePath(); fs(CAPE);
  }
  const lx = side === 0 ? 0.075 : 0.04;            // あし・ブーツ
  for (const s of [-1, 1]) {
    const lift = (s < 0 ? walk > 0.2 : walk < -0.2) ? -0.035 * u : 0;
    rrect(ctx, s * lx * u - 0.045 * u, 0.29 * u + lift, 0.09 * u, 0.08 * u, 0.02 * u); fs(RED);
    rrect(ctx, s * lx * u + side * 0.02 * u - 0.072 * u, 0.345 * u + lift, 0.144 * u, 0.088 * u, 0.044 * u); fs(YEL);
  }

  ctx.save(); torso(); ctx.clip();
  ctx.fillStyle = 'rgba(110,0,0,.2)'; ctx.fillRect((side >= 0 ? tw - 0.075 : -tw) * u, 0.075 * u, 0.075 * u, 0.26 * u);
  ctx.fillStyle = YEL; ctx.fillRect(-tw * u, 0.255 * u, tw * 2 * u, 0.045 * u);
  ctx.beginPath(); ctx.moveTo(-tw * u, 0.255 * u); ctx.lineTo(tw * u, 0.255 * u); ctx.moveTo(-tw * u, 0.3 * u); ctx.lineTo(tw * u, 0.3 * u); ctx.lineWidth = lw * 0.8; ctx.stroke();
  ctx.restore();
  torso(); ctx.lineWidth = lw; ctx.stroke();
  if (!back) {
    if (side === 0) { rrect(ctx, -0.042 * u, 0.246 * u, 0.084 * u, 0.064 * u, 0.012 * u); ctx.lineWidth = lw * 0.8; fs(YEL); }
    const ex = side * 0.055 * u, ey = 0.196 * u, er = 0.041 * u;   // ニコちゃんマーク
    circle(ctx, ex, ey, er); ctx.lineWidth = lw * 0.8; fs(YEL);
    if (u >= 36) {
      ctx.fillStyle = INK;
      circle(ctx, ex - er * 0.35, ey - er * 0.2, er * 0.13); ctx.fill(); circle(ctx, ex + er * 0.35, ey - er * 0.2, er * 0.13); ctx.fill();
      ctx.beginPath(); ctx.arc(ex, ey + er * 0.05, er * 0.5, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = Math.max(0.8, er * 0.16); ctx.stroke();
    }
  }
  ctx.lineWidth = lw;                              // うで・てぶくろ
  if (side === 0) {
    for (const s of [-1, 1]) {
      const gx = s * 0.245 * u, gy = 0.215 * u + s * walk * 0.03 * u;
      limb(ctx, s * 0.15 * u, 0.11 * u, gx - s * 0.03 * u, gy - 0.02 * u, 0.075 * u, RED, lw);
      circle(ctx, gx, gy, 0.07 * u); fs(YEL);
    }
  } else {
    const gx = side * (0.12 + walk * 0.06) * u, gy = 0.215 * u;
    limb(ctx, side * 0.02 * u, 0.12 * u, gx, gy - 0.02 * u, 0.075 * u, RED, lw);
    circle(ctx, gx, gy, 0.072 * u); fs(YEL);
  }
  if (back) {                                      // うしろ向き：マントが前
    ctx.beginPath(); ctx.moveTo(-0.17 * u, 0.08 * u); ctx.lineTo(0.17 * u, 0.08 * u); ctx.lineTo((0.3 + flap * 0.03) * u, 0.4 * u);
    ctx.quadraticCurveTo(0.15 * u, 0.35 * u, 0, 0.4 * u); ctx.quadraticCurveTo(-0.15 * u, 0.35 * u, (-0.3 - flap * 0.03) * u, 0.4 * u);
    ctx.closePath(); ctx.lineWidth = lw; fs(CAPE);
  }
  const collar = e2 => {                           // ちゃいろのえり
    ctx.beginPath(); ctx.ellipse(0, 0.09 * u, 0.165 * u + e2, 0.04 * u + e2, 0, 0, Math.PI * 2);
    for (let i = -2; i <= 2; i++) {
      const cx = i * 0.066 * u, cy = 0.115 * u - Math.abs(i) * 0.01 * u;
      ctx.moveTo(cx + 0.037 * u + e2, cy); ctx.arc(cx, cy, 0.037 * u + e2, 0, Math.PI * 2);
    }
  };
  collar(lw); ctx.fillStyle = INK; ctx.fill(); collar(0); ctx.fillStyle = COLLAR; ctx.fill();
  if (!o.headless) {                               // あたま
    if (back) {
      const g = ctx.createRadialGradient(-0.1 * u, -0.3 * u, 0.02 * u, 0, -0.2 * u, 0.32 * u);
      g.addColorStop(0, '#f2bf86'); g.addColorStop(1, '#cd8749');
      circle(ctx, 0, -0.2 * u, 0.29 * u); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = Math.max(1, 0.29 * u * 0.07); ctx.stroke();
    } else drawAnpanFace(ctx, 0, -0.2 * u, 0.29 * u, { look: side, expr: o.expr });
  }
  ctx.restore();
}

// ---- カビルンルン ----
function drawKabi(ctx, x, y, T, e) {
  const u = T, a = e.anim, sq = 1 + Math.sin(a * 9) * 0.05, wig = Math.sin(a * 7);
  const dx = DX[e.dir] || 0, dy = DY[e.dir] || 0;
  const lw = Math.max(1, u * 0.022), thin = Math.max(1, u * 0.017);

  ellipse(ctx, x, y + 0.42 * u, 0.22 * u, 0.06 * u); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
  ctx.save(); ctx.translate(x, y + 0.01 * u); ctx.scale(1.08, 1.08);

  const tip = (px, py, rx, ry, rot) => { ellipse(ctx, px, py, rx, ry, rot); ctx.fillStyle = PUR; ctx.fill(); ctx.lineWidth = thin; ctx.stroke(); };
  for (const s of [-1, 1]) {
    const w = wig * s;
    const ax = s * 0.13 * u, ay = (-0.45 + 0.01 * w) * u;                 // しょっかく
    stalk(s * 0.05 * u, -0.22 * u, s * 0.03 * u, -0.36 * u, ax, ay);
    tip(ax + s * 0.01 * u, ay - 0.012 * u, 0.045 * u, 0.026 * u, s * 0.35);
    const ux = s * 0.41 * u, uy = (-0.17 + 0.03 * w) * u;                 // 上のうで
    stalk(s * 0.19 * u, -0.06 * u, s * 0.28 * u, -0.19 * u, ux, uy);
    tip(ux + s * 0.03 * u, uy - 0.005 * u, 0.045 * u, 0.026 * u, -s * 0.15);
    const lx2 = s * 0.44 * u, ly2 = (0.09 - 0.03 * w) * u;                // 下のうで
    stalk(s * 0.24 * u, 0.1 * u, s * 0.35 * u, 0.06 * u, lx2, ly2);
    circle(ctx, lx2 + s * 0.025 * u, ly2, 0.035 * u); ctx.fillStyle = PUR; ctx.fill(); ctx.lineWidth = thin; ctx.stroke();
    const fx = s * 0.13 * u, fy = 0.4 * u;                                // あし
    stalk(s * 0.1 * u, 0.27 * u, s * 0.13 * u, 0.33 * u, fx, fy - 0.025 * u);
    tip(fx + s * 0.012 * u, fy, 0.058 * u, 0.027 * u, 0);

  ctx.save(); ctx.translate(0, 0.3 * u); ctx.scale(sq, 2 - sq); ctx.translate(0, -0.3 * u);
  const body = () => {
    ctx.beginPath(); ctx.moveTo(0, -0.26 * u);
    ctx.bezierCurveTo(0.16 * u, -0.26 * u, 0.2 * u, -0.13 * u, 0.235 * u, 0.0);
    ctx.bezierCurveTo(0.285 * u, 0.15 * u, 0.28 * u, 0.3 * u, 0, 0.3 * u);
    ctx.bezierCurveTo(-0.28 * u, 0.3 * u, -0.285 * u, 0.15 * u, -0.235 * u, 0.0);
    ctx.bezierCurveTo(-0.2 * u, -0.13 * u, -0.16 * u, -0.26 * u, 0, -0.26 * u);
    ctx.closePath();
  };
  const g = ctx.createRadialGradient(-0.08 * u, -0.12 * u, 0.02 * u, 0, 0.05 * u, 0.32 * u);
  g.addColorStop(0, '#83ad9e'); g.addColorStop(1, '#5c887a');
  body(); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = lw; ctx.stroke();
  const px = dx * 0.016 * u, py = dy * 0.018 * u;
  ctx.lineWidth = thin;
  for (const s of [-1, 1]) {

}
class Music {
  constructor(syn) { this.syn = syn; this.tr = null; this.bus = null; }
  play(name, t) {
    this.stop(t);

    if (!tr) return;

    this.bus = this.syn.ctx.createGain(); this.bus.gain.setValueAtTime(1, t); this.bus.connect(this.syn.musBus);
  }
  stop(t) {

  }
  schedule(until) {
    const tr = this.tr;

    for (;;) {
      const t = this.t0 + this.step * tr.sd;
      if (t >= until) break;
      const a = tr.at[this.step % tr.steps];
      for (const n of a.lead) this.syn.lead(t, n.m, n.len * tr.sd * 0.95, this.bus);
      for (const n of a.bass) this.syn.bass(t, n.m, n.len * tr.sd * 0.9, this.bus);
      if (a.drum.indexOf('k') >= 0) this.syn.kick(t, this.bus);
      if (a.drum.indexOf('s') >= 0) this.syn.snare(t, this.bus);
      if (a.drum.indexOf('h') >= 0) this.syn.hat(t, this.bus);

const PLAY_BGM = false;   // BGMなし（効果音だけ）。BGMを流すときは true にする
const SFX_OF = { bomb: 'bomb', explode: 'explode', item: 'item', enemy_die: 'enemy', hit: 'hit', new_face: 'newface', genki: 'genki', go: 'go', boss_hit: 'bosshit', boss_defeat: 'bossdefeat', boss_laugh: 'laugh' };
class SoundManager {
  constructor() { this.ctx = null; this.syn = null; this.mus = null; this.muted = false; }
  unlock() {
    try {
      if (!this.ctx) {

        setInterval(() => { if (this.mus && this.ctx.state === 'running') this.mus.schedule(this.ctx.currentTime + 0.3); }, 70);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* 音が出せない環境 */ }
  }
  sfx(name) { if (this.syn) this.syn.sfx(name, this.ctx.currentTime + 0.01); }
  music(name) { if (this.mus && PLAY_BGM) this.mus.play(name, this.ctx.currentTime + 0.05); }
  stopMusic() { if (this.mus) this.mus.stop(); }
  setMuted(m) { this.muted = m; if (this.syn) this.syn.master.gain.setValueAtTime(m ? 0 : 0.9, this.ctx.currentTime); }
  onGameEvent(g, ev) {
    if (ev.type === 'stage_start') this.music(g.stage.bgm);
    else if (ev.type === 'stage_clear') { this.stopMusic(); this.sfx(ev.last ? 'allclear' : 'clear'); }
    else if (ev.type === 'game_over') { this.stopMusic(); this.sfx('gameover'); }

}

// =====================================================================
//  画面・入力（プレイ用シェル）
// =====================================================================
function boot() {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), screenEl = $('screen');
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');
  const renderer = new Renderer(99), sound = new SoundManager();
  let T = 40, hudH = 44, boardX = 0;
  let game = null, bot = null, mode = 'title', paused = false, pending = null;
  let bombQueued = false, touchDir = 0, padDir = 0, padBombPrev = false;
  const keyDirs = [];

  function newAttract() { game = new Game({ seed: (Math.random() * 1e9) | 0, introTime: 0.6, clearTime: 2.0, lives: 9, bombs: 2 }); bot = new Bot(); renderer.reset(); }
  function show(id, on) { $(id).classList.toggle('show', on); }
  function toTitle() {
    mode = 'title'; paused = false; pending = null; sound.stopMusic();
    show('title', true); show('pause', false); show('result', false); show('demoTag', false);
    newAttract();
  }
  function startGame(demo) {
    sound.unlock(); sound.sfx('select');
    game = new Game({ seed: (Math.random() * 1e9) | 0, bombs: demo ? 2 : 1 });
    bot = demo ? new Bot() : null;
    renderer.reset(); mode = demo ? 'demo' : 'play'; paused = false; pending = null;
    show('title', false); show('pause', false); show('result', false); show('demoTag', !!demo);
    sound.onGameEvent(game, { type: 'stage_start' });
    keyDirs.length = 0; bombQueued = false;
  }
  function showResult(won) {
    mode = 'result';
    $('resTitle').textContent = won ? 'ゲームクリア！' : 'ゲームオーバー';
    $('resScore').textContent = 'スコア ' + game.player.score;
    show('result', true);
  }
  function togglePause(force) {
    if (mode !== 'play') return;
    paused = force != null ? force : !paused;
    show('pause', paused);
    if (paused) sound.stopMusic(); else sound.music(game.stage.bgm);
  }
  function toggleMute() { sound.setMuted(!sound.muted); $('btnMute').textContent = sound.muted ? '🔇' : '🔊'; }

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight, landscape = vw > vh;
    document.body.classList.toggle('landscape', landscape);
    const padH = isTouch && !landscape ? Math.min(230, Math.max(168, vh * 0.25)) : 0;
    const availW = vw - 24, availH = vh - padH - 30, ratio = COLS / (ROWS + HUD_ROWS);
    let w = availW, h = w / ratio;
    if (h > availH) { h = availH; w = h * ratio; }
    w = Math.floor(w); h = Math.floor(h);
    screenEl.style.width = w + 'px'; screenEl.style.height = h + 'px';
    screenEl.style.setProperty('--u', (w / COLS).toFixed(2) + 'px');
    $('pad').style.height = padH ? padH + 'px' : '';
    const sys = $('sysbtns'), wantIn = isTouch && !landscape;
    if (wantIn && sys.parentNode !== $('pad')) $('pad').insertBefore(sys, $('bombBtn'));
    else if (!wantIn && sys.parentNode !== document.body) document.body.appendChild(sys);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    T = Math.floor(cv.width / COLS); hudH = cv.height - T * ROWS; boardX = Math.floor((cv.width - T * COLS) / 2);
    renderer.sprites = {};
  }
  window.addEventListener('resize', layout);
  layout();

  const KEY = { ArrowUp: 1, KeyW: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3, ArrowRight: 4, KeyD: 4 };
  window.addEventListener('keydown', e => {
    sound.unlock();
    if (KEY[e.code]) {
      e.preventDefault();
      if (mode === 'demo') { toTitle(); return; }
      if (keyDirs.indexOf(KEY[e.code]) < 0) keyDirs.push(KEY[e.code]);
      return;
    }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (mode === 'title') startGame(false);
      else if (mode === 'demo') toTitle();
      else if (mode === 'result') { if (e.code === 'Enter' || e.code === 'Space') startGame(false); }
      else if (mode === 'play' && !paused) bombQueued = true;
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') toggleMute();
  });
  window.addEventListener('keyup', e => { if (KEY[e.code]) { const i = keyDirs.indexOf(KEY[e.code]); if (i >= 0) keyDirs.splice(i, 1); } });
  window.addEventListener('blur', () => { keyDirs.length = 0; touchDir = 0; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });

  const dpad = $('dpad'), keysEl = { 1: dpad.querySelector('.u'), 2: dpad.querySelector('.d'), 3: dpad.querySelector('.l'), 4: dpad.querySelector('.r') };
  let dpadPointer = null;
  const dpadDir = e => {
    const r = dpad.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(x, y) < r.width * 0.1) return 0;
    return Math.abs(x) > Math.abs(y) ? (x > 0 ? 4 : 3) : (y > 0 ? 2 : 1);
  };
  const padUI = () => { for (const d in keysEl) keysEl[d].classList.toggle('on', +d === touchDir); };
  dpad.addEventListener('pointerdown', e => { e.preventDefault(); sound.unlock(); if (mode === 'demo') { toTitle(); return; } dpadPointer = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} touchDir = dpadDir(e); padUI(); });
  dpad.addEventListener('pointermove', e => { if (e.pointerId !== dpadPointer) return; touchDir = dpadDir(e); padUI(); });
  const endPad = e => { if (e.pointerId !== dpadPointer) return; dpadPointer = null; touchDir = 0; padUI(); };

  $('btnDemo').addEventListener('click', () => startGame(true));

  $('btnQuit').addEventListener('click', toTitle);
  $('btnRetry').addEventListener('click', () => startGame(false));
  $('btnToTitle').addEventListener('click', toTitle);

  $('btnMute').addEventListener('click', () => { sound.unlock(); toggleMute(); });

        else if (mode === 'demo') pending = { t: 2.0, fn: toTitle };

      }
    }
  }

  // タイトルの顔ボム
  const lb = $('logoBomb'), lctx = lb.getContext('2d'), fakeBomb = { t: FUSE, age: 0 };
  function drawLogoBomb(dt) {
    fakeBomb.age += dt; fakeBomb.t -= dt * 0.6; if (fakeBomb.t < 0.3) fakeBomb.t = FUSE;
    lctx.clearRect(0, 0, lb.width, lb.height);
    const bob = Math.abs(Math.sin(fakeBomb.age * 3)) * 12;
    drawFaceBomb(lctx, 80, 90 - bob, 150, fakeBomb);
  }

  let last = performance.now(), acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    pollPad();
    if (game && !paused && mode !== 'result') {
      acc += dt;
      let steps = 0;
      while (acc >= DT && steps < 6) {
        if (mode === 'play') { game.input = { dir: keyDirs.length ? keyDirs[keyDirs.length - 1] : (touchDir || padDir), bomb: bombQueued }; bombQueued = false; }
        else game.input = bot.update(game);

        if (game.events.length) { handleEvents(game.events); game.events.length = 0; }

      if (steps >= 6) acc = 0;

    ctx.fillStyle = '#86c95f'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (game) {
      renderer.drawHUD(ctx, game, 0, 0, cv.width, hudH);
      renderer.drawBoard(ctx, game, boardX, hudH, T, { noBanner: mode === 'title' });
    }
    if (mode === 'title') drawLogoBomb(dt);

window.AnpanBomb = { COLS, ROWS, N, DT, FUSE, FLAME_DUR, HUD_ROWS, STAGES, THEMES, FONT_POP, FONT_UI, DX, DY,
  Game, Bot, Renderer, Synth, Music, SoundManager, TRACKS, SFX_OF, mulberry32, clamp, easeOutBack,
  draw: { rrect, circle, ellipse, starPath, heartPath, otext, drawAnpanFace, drawFaceBomb, drawMiniBomb, drawAnpanman, drawKabi, drawRobo, drawBaikin, drawBoss, drawPinkGlove, drawGlove, drawCapeIcon, drawItemTile } };

}
