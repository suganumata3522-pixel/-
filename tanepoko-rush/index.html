<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タネポコ・ラッシュ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="小さな隊長がタネポコを投げて、まん中から攻めてくるムシをくい止めるレーンバトル。両サイドの数字の回数だけ当てるとアイテムや仲間が手に入る。">
<meta name="theme-color" content="#1f6f9e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: one full-bleed canvas world (a stone bridge over a pond); HUD and menus float above it in a phone-width column. */
:root {
  --pond: #3aa7d6;
  --pond-deep: #1f6f9e;
  --ink: #33224a;
  --paper: #fff8ea;
  --leaf: #58c23a;
  --sun: #ffc93a;
  --berry: #ff4d6a;
  --font-display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --outline: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 4px 0 var(--ink);
  --col-w: 100%;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  height: 100%; margin: 0; background: var(--pond-deep); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: var(--col-w); max-width: 100%;
  padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 10;
}
.hud-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.hearts { display: flex; gap: 1px; min-width: 0; flex-wrap: wrap; }
.hearts.hit { animation: shake .4s; }
.heart { width: clamp(17px, 5.6vw, 25px); aspect-ratio: 26 / 24; }
.heart svg { width: 100%; height: 100%; display: block; fill: var(--berry); stroke: var(--ink); stroke-width: 2.2; }
.heart.empty svg { fill: rgba(255, 248, 234, .5); }
.stage-box { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.stage-label { font-family: var(--font-display); font-size: 16px; color: #fff; text-shadow: var(--outline); letter-spacing: .04em; line-height: 1.1; white-space: nowrap; }
.prog { position: relative; width: 118px; height: 12px; border: 3px solid var(--ink); border-radius: 999px; background: rgba(255, 248, 234, .8); overflow: hidden; }
.prog-fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--sun); transition: width .3s; }
.hud-btns { display: flex; gap: 8px; justify-content: flex-end; }
.icon-btn {
  pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink);
  background: var(--paper); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer;
  box-shadow: 0 4px 0 rgba(51, 34, 74, .45); transition: transform .06s, box-shadow .06s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(51, 34, 74, .45); }
.icon-btn svg { width: 22px; height: 22px; display: block; }
.boss-bar { display: flex; align-items: center; gap: 8px; align-self: center; width: min(100%, 300px); }
.boss-name { font-family: var(--font-display); font-size: 13px; color: #fff; text-shadow: var(--outline); white-space: nowrap; }
.boss-track { flex: 1; height: 14px; border: 3px solid var(--ink); border-radius: 999px; background: rgba(255, 248, 234, .85); overflow: hidden; }
.boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6a, #ff8a3d); transition: width .15s; }
.buffs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.chip {
  font-size: 11px; font-weight: 800; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--paper);
  border: 2px solid var(--ink); display: inline-flex; align-items: center; gap: 4px; line-height: 1.3;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; border: 1.5px solid var(--ink); }

/* ---------- hint & banner ---------- */
.hint {
  position: absolute; left: 50%; bottom: 3.5%; transform: translateX(-50%); width: max-content;
  max-width: min(calc(100% - 32px), 360px); padding: 8px 14px; border-radius: 16px; background: rgba(255, 248, 234, .95);
  border: 3px solid var(--ink); font-weight: 800; font-size: 14px; line-height: 1.45; text-align: center;
  pointer-events: none; z-index: 12; box-shadow: 0 4px 0 rgba(51, 34, 74, .35); animation: hintBob 1.6s ease-in-out infinite;
}
.banner {
  position: absolute; left: 16px; right: 16px; top: 24%; margin: 0 auto; width: fit-content; max-width: 400px;
  transform: translateY(-50%); display: flex; align-items: center; gap: 10px;
  padding: 10px 20px 10px 12px; background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
  box-shadow: 0 6px 0 rgba(51, 34, 74, .4); pointer-events: none; z-index: 15;
}
.banner.no-icon { padding: 10px 22px; }
.banner.danger { background: #ffe3e8; }
.banner.pop { animation: pop .42s cubic-bezier(.2, 1.6, .4, 1) both; }
.banner.out { animation: fadeOut .3s ease-in both; }
.banner-icon { width: 54px; height: 54px; flex: none; }
.banner-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.banner-title { font-family: var(--font-display); font-size: 24px; color: var(--sun); text-shadow: var(--outline); line-height: 1.25; white-space: nowrap; }
.banner.danger .banner-title { color: var(--berry); }
.banner-sub { font-size: 13px; font-weight: 800; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }

/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 50% 40%, rgba(31, 111, 158, .08), rgba(20, 62, 96, .62));
}
.panel {
  width: min(100%, 380px); margin: auto; background: var(--paper); border: 4px solid var(--ink); border-radius: 28px;
  box-shadow: 0 8px 0 rgba(51, 34, 74, .45); padding: 16px 18px 18px; display: flex; flex-direction: column; align-items: center;
  gap: 12px; text-align: center;
}
.logo { margin: 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: var(--font-display); font-weight: 400; }
.logo-main { font-size: clamp(40px, 12.5vw, 56px); color: var(--leaf); text-shadow: var(--outline); transform: rotate(-3deg); letter-spacing: .02em; }
.logo-sub { font-size: clamp(24px, 7.5vw, 32px); color: var(--sun); text-shadow: var(--outline); transform: rotate(2deg); margin-top: 6px; }
.title-art { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 1; display: block; }
.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; width: 100%; text-align: left; }
.howto li {
  display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; font-size: 13px; font-weight: 800; line-height: 1.45;
  background: #fff; border: 2px solid rgba(51, 34, 74, .16); border-radius: 14px; padding: 6px 10px 6px 6px; min-width: 0;
}
.howto-icon { width: 40px; height: 40px; display: block; }
.btn-col { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn {
  font-family: var(--font-display); font-size: 22px; line-height: 1.2; padding: 12px 18px 13px; border-radius: 999px;
  border: 4px solid var(--ink); cursor: pointer; color: #fff; background: var(--leaf); box-shadow: 0 6px 0 var(--ink);
  text-shadow: 0 2px 0 rgba(51, 34, 74, .55); transition: transform .07s, box-shadow .07s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn-sub { background: var(--paper); color: var(--ink); font-size: 17px; text-shadow: none; }
.btn:focus-visible, .icon-btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.fine { margin: 0; font-size: 12px; font-weight: 800; color: rgba(51, 34, 74, .72); line-height: 1.5; }
.panel-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1.3; color: var(--sun); text-shadow: var(--outline); text-wrap: balance; }
.panel-title.sad { color: #9fd7ff; }
.stars { display: flex; gap: 6px; }
.star svg { width: 46px; height: 46px; display: block; fill: var(--sun); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.star.off svg { fill: rgba(51, 34, 74, .14); }
.stats {
  margin: 0; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-weight: 800; font-size: 15px;
  background: #fff; border-radius: 16px; border: 2px solid rgba(51, 34, 74, .16); padding: 10px 14px;
}
.stats dt { text-align: left; color: rgba(51, 34, 74, .78); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-display); }

@keyframes pop { from { transform: translateY(-50%) scale(.4); opacity: 0; } to { transform: translateY(-50%) scale(1); opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(-50%) scale(1); } to { opacity: 0; transform: translateY(-80%) scale(.9); } }
@keyframes hintBob { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (max-height: 680px) {
  .title-art { max-width: 230px; }
  .howto li { font-size: 12px; }
  .panel { gap: 9px; padding-top: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint, .hearts.hit { animation: none; }
  .banner.pop, .banner.out { animation-duration: .01s; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="ゲーム画面"></canvas>

  <div id="hud" hidden>
    <div class="hud-row">
      <div class="hearts" id="hearts" role="img" aria-label="ライフ"></div>
      <div class="stage-box">
        <div class="stage-label" id="stageLabel">ステージ 1</div>
        <div class="prog" aria-hidden="true"><div class="prog-fill" id="progFill"></div></div>
      </div>
      <div class="hud-btns">
        <button class="icon-btn" id="btnSound" type="button" aria-label="音をオフにする"></button>
        <button class="icon-btn" id="btnPause" type="button" aria-label="一時停止">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="boss-bar" id="bossBar" hidden><span class="boss-name">ボス オオアゴ</span><div class="boss-track"><div class="boss-fill" id="bossFill"></div></div></div>
    <div class="buffs" id="buffs"></div>
  </div>

  <div class="hint" id="hint" hidden></div>
  <div class="banner" id="banner" hidden>
    <canvas class="banner-icon" id="bannerIcon" width="108" height="108"></canvas>
    <div class="banner-text"><div class="banner-title" id="bannerTitle"></div><div class="banner-sub" id="bannerSub"></div></div>
  </div>

  <section class="screen" id="screenTitle" aria-labelledby="logoTitle">
    <div class="panel">
      <h1 class="logo" id="logoTitle"><span class="logo-main">タネポコ</span><span class="logo-sub">ラッシュ！</span></h1>
      <canvas class="title-art" id="titleArt" width="640" height="320" aria-hidden="true"></canvas>
      <ul class="howto">
        <li><canvas class="howto-icon" data-icon="seed" width="80" height="80" aria-hidden="true"></canvas><span>左右にドラッグで隊長が移動。タネポコは自動で投げるよ</span></li>
        <li><canvas class="howto-icon" data-icon="bug" width="80" height="80" aria-hidden="true"></canvas><span>まん中から来るムシをたおそう。下の線まで来るとライフが減る</span></li>
        <li><canvas class="howto-icon" data-icon="gate" width="80" height="80" aria-hidden="true"></canvas><span>両サイドは数字の回数だけ当てると、アイテムや仲間をゲット</span></li>
      </ul>
      <div class="btn-col">
        <button class="btn" id="btnStart" type="button">あそぶ</button>
        <button class="btn btn-sub" id="btnContinue" type="button" hidden>つづきから</button>
      </div>
      <p class="fine" id="bestLine">音が出ます。キーボードなら ← → でも動かせます</p>
    </div>
  </section>

  <section class="screen" id="screenPause" hidden aria-labelledby="pauseTitle">
    <div class="panel">
      <h2 class="panel-title" id="pauseTitle">ひとやすみ</h2>
      <div class="btn-col">
        <button class="btn" id="btnResume" type="button">つづける</button>
        <button class="btn btn-sub" id="btnRetry" type="button">さいしょから</button>
        <button class="btn btn-sub" id="btnToTitle" type="button">タイトルへ</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screenResult" hidden aria-labelledby="resultTitle">
    <div class="panel">
      <h2 class="panel-title" id="resultTitle">ステージ 1 クリア！</h2>
      <div class="stars" id="resultStars"></div>
      <dl class="stats" id="resultStats"></dl>
      <div class="btn-col">
        <button class="btn" id="btnNext" type="button">つぎのステージへ</button>
        <button class="btn btn-sub" id="btnResultTitle" type="button">タイトルへ</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   Utilities
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const store = {
  get(k, d) { try { const v = localStorage.getItem('tanepoko-rush:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tanepoko-rush:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const INK = '#33224a';
const FONT_NUM = '"Mochiy Pop One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif';
const FONT_UI = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';

function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function seg(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }

/* =====================================================================
   World, camera, projection
   ===================================================================== */
const WORLD = {
  lanes: [{ cx: -3.3, half: 1.12 }, { cx: 0, half: 1.42 }, { cx: 3.3, half: 1.12 }],
  laneStartZ: 9,
  capZ: 1.4,
  breachZ: 2.7,
  gateZ: 10.4,
  spawnZ: 50,
  fogNear: 27,
  fogFar: 52,
  capMin: -4.0,
  capMax: 4.0,
};
const BASE_RATE = 3.0, IMPACT = 1, DPS = 1.5, START_SQUAD = 6, MAX_SQUAD = 200, THROW_RANGE = 23;
const laneOf = x => (x < -1.82 ? 0 : x > 1.82 ? 2 : 1);

const cam = { y: 13, z: -9, pitch: 50 * Math.PI / 180, s: 0, c: 0, f: 600, cx: 0, cy: 0 };
const TOP_Z = 50, CAP_FRAC = 0.70, MIN_HALF = 4.4;
const P = { x: 0, y: 0, s: 1 };
function camDepth(y, z) { return -(y - cam.y) * cam.s + (z - cam.z) * cam.c; }
function camUp(y, z) { return (y - cam.y) * cam.c + (z - cam.z) * cam.s; }
function proj(x, y, z, out) {
  out = out || P;
  const dy = y - cam.y, dz = z - cam.z;
  const Z = -dy * cam.s + dz * cam.c;
  const Y = dy * cam.c + dz * cam.s;
  const k = cam.f / Z;
  out.x = cam.cx + x * k; out.y = cam.cy - Y * k; out.s = k;
  return out;
}
function setupCamera() {
  cam.s = Math.sin(cam.pitch); cam.c = Math.cos(cam.pitch);
  const rTop = camUp(0, TOP_Z) / camDepth(0, TOP_Z);
  const rCap = camUp(0, WORLD.capZ) / camDepth(0, WORLD.capZ);
  const capY = CAP_FRAC * VH;
  cam.f = capY / (rTop - rCap);
  const Zc = camDepth(0, WORLD.capZ);
  if ((VW / 2) * Zc / cam.f < MIN_HALF) cam.f = (VW / 2) * Zc / MIN_HALF;
  cam.cy = capY + cam.f * rCap;
  cam.cx = VW / 2;
}
function pathWorld(g, pts) {
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (i === 0) g.moveTo(p.x, p.y); else g.lineTo(p.x, p.y);
  }
  g.closePath();
}
function quadW(g, a, b, c, d, fill, stroke) {
  pathWorld(g, [a, b, c, d]);
  g.fillStyle = fill; g.fill();
  if (stroke) { g.strokeStyle = stroke; g.stroke(); }
}

/* =====================================================================
   DOM & canvas
   ===================================================================== */
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('game'), ctx = canvas.getContext('2d');
const hud = $('hud');
let DPR = 1, VW = 390, VH = 844, GW = 390;
const bgCanvas = document.createElement('canvas'), bgCtx = bgCanvas.getContext('2d');

/* =====================================================================
   Sound (Web Audio, synthesized)
   ===================================================================== */
const Sound = {
  ctx: null, master: null, sfx: null, music: null, muted: !!store.get('muted', false), last: Object.create(null), noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.6; this.sfx.connect(this.master);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.16; this.music.connect(this.master);
  },
  setMuted(m) {
    this.muted = m; store.set('muted', m);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.03);
  },
  ok(key, ms) {
    if (!this.ctx || this.muted) return false;
    const now = performance.now();
    if (key && this.last[key] && now - this.last[key] < ms) return false;
    if (key) this.last[key] = now;
    return true;
  },
  tone(freq, dur, o) {
    o = o || {};
    const c = this.ctx; if (!c || this.muted) return;
    const t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    const v = o.vol || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  noise(dur, o) {
    o = o || {};
    const c = this.ctx; if (!c || this.muted) return;

function drawSpr(spr, sx, sy, s, rot, alpha, mul, white) {
  const k = s * spr.wh / spr.h * (mul || 1);
  const w = spr.w * k, h = spr.h * k;
  const a = alpha == null ? 1 : alpha;
  if (a <= 0) return;
  const img = spr.half && h * DPR < spr.img.height * 0.55 ? spr.half : spr.img;
  ctx.globalAlpha = a;
  if (rot) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot);
    ctx.drawImage(img, -spr.ax * k, -spr.ay * k, w, h);
    if (white > 0) { ctx.globalAlpha = a * white; ctx.drawImage(whiteOf(spr), -spr.ax * k, -spr.ay * k, w, h); }
    ctx.restore();
  } else {
    ctx.drawImage(img, sx - spr.ax * k, sy - spr.ay * k, w, h);
    if (white > 0) { ctx.globalAlpha = a * white; ctx.drawImage(whiteOf(spr), sx - spr.ax * k, sy - spr.ay * k, w, h); }
  }
  ctx.globalAlpha = 1;
}

  $('btnNext').textContent = win ? 'つぎのステージへ' : 'もういちど';
  showScreen('result');
}

/* ---- title illustration & small icons ---- */
function drawTitleArt() {
  const cv = $('titleArt'), g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  const W2 = cv.width, H2 = cv.height;
  const gr = g.createRadialGradient(W2 / 2, H2 * 0.92, 10, W2 / 2, H2 * 0.92, W2 * 0.55);
  gr.addColorStop(0, 'rgba(130,200,90,0.55)'); gr.addColorStop(1, 'rgba(130,200,90,0)');
  g.fillStyle = gr; ell(g, W2 / 2, H2 * 0.9, W2 * 0.48, H2 * 0.16); g.fill();
  const seedAt = (x, y, sc, type, view, rot) => { g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(sc, sc); g.translate(-30, view === 'ball' ? -42 : -70); drawSeed(g, type, view, 0); g.restore(); };
  g.save(); g.translate(318 - 60 * 2.05, 300 - 150 * 2.05); g.scale(2.05, 2.05); drawCaptainFront(g); g.restore();
  seedAt(150, 300, 1.55, 'normal', 'front');
  seedAt(92, 288, 1.3, 'thunder', 'front');
  seedAt(470, 300, 1.55, 'fire', 'front');
  seedAt(530, 286, 1.25, 'normal', 'front');
  seedAt(470, 92, 1.35, 'normal', 'ball', 0.5);
  g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(388, 140); g.quadraticCurveTo(410, 104, 436, 96); g.stroke();
  g.beginPath(); g.moveTo(404, 156); g.quadraticCurveTo(424, 124, 446, 116); g.stroke();
  g.save(); g.translate(586 - 36 * 1.35, 230 - 69 * 1.35); g.scale(1.35, 1.35); drawBug(g, 0); g.restore();
  g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = 3;
  g.font = '28px ' + FONT_NUM; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.strokeText('!?', 612, 112); g.fillText('!?', 612, 112);
}
function drawDomIcons() {
  document.querySelectorAll('canvas[data-icon]').forEach(cv => {
    const g = cv.getContext('2d'), W2 = cv.width, H2 = cv.height;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W2, H2);
    const kind = cv.dataset.icon;
    if (kind === 'seed') { g.save(); g.translate(W2 / 2 - 30 * 1.05, H2 - 4 - 70 * 1.05); g.scale(1.05, 1.05); drawSeed(g, 'normal', 'front', 0); g.restore(); }
    else if (kind === 'bug') { g.save(); g.translate(W2 / 2 - 36 * 1.0, H2 - 4 - 69 * 1.0); drawBug(g, 0); g.restore(); }
    else {
      g.lineJoin = 'round'; g.lineWidth = 3; g.strokeStyle = INK;
      g.fillStyle = '#8ccaff'; g.beginPath(); g.moveTo(10, 30); g.lineTo(20, 20); g.lineTo(70, 20); g.lineTo(60, 30); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#2766c4'; g.beginPath(); g.moveTo(60, 30); g.lineTo(70, 20); g.lineTo(70, 64); g.lineTo(60, 74); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#3d8bf2'; rr(g, 10, 30, 50, 44, 3); g.fill(); g.stroke();
      g.font = '26px ' + FONT_NUM; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeText('3', 35, 53); g.fillStyle = '#fff'; g.fillText('3', 35, 53);
    }
  });
}

/* =====================================================================
   Input
   ===================================================================== */
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (G.mode !== 'play') return;
  drag = { id: e.pointerId, x0: e.clientX, t0: G.cap.tx };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || G.mode !== 'play') return;
  const ppu = cam.f / camDepth(0, WORLD.capZ);
  const raw = drag.t0 + (e.clientX - drag.x0) / ppu * 1.15;
  const v = clamp(raw, WORLD.capMin, WORLD.capMax);
  if (v !== raw) { drag.t0 = v; drag.x0 = e.clientX; }
  G.cap.tx = v;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; if (G.mode === 'play') e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; if (G.mode === 'play') e.preventDefault(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { if (G.mode === 'play') pauseGame(); else if (G.mode === 'pause') resumeGame(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => { keys.left = keys.right = false; });

$('btnStart').addEventListener('click', () => startGame(1));
$('btnContinue').addEventListener('click', () => startGame(best + 1));
$('btnPause').addEventListener('click', pauseGame);
$('btnResume').addEventListener('click', resumeGame);
$('btnRetry').addEventListener('click', () => startGame(G.stage));
$('btnToTitle').addEventListener('click', showTitle);
$('btnNext').addEventListener('click', () => startGame(G.mode === 'clear' ? G.stage + 1 : G.stage));
$('btnResultTitle').addEventListener('click', showTitle);
$('btnSound').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); updateSoundButton(); });

/* =====================================================================
   Resize & main loop
   ===================================================================== */
function onResize() {
  const w = app.clientWidth, h = app.clientHeight;
  if (w < 10 || h < 10) return;
  DPR = Math.min(window.devicePixelRatio || 1, lowPower ? 1.25 : 2);
  VW = w; VH = h;
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  GW = Math.min(VW, Math.max(360, VH * 0.62));
  app.style.setProperty('--col-w', GW + 'px');
  setupCamera();
  buildBackground();
  buildSprites(false);
}
let resizeTimer = 0, lowPower = false, perfN = 0, perfAcc = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 120); });

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  if (G.mode === 'play') {
    if (!lowPower && DPR > 1.25 && dt > 0) {
      perfAcc += dt;
      if (++perfN === 120) {
        if (perfAcc / perfN > 0.026) { lowPower = true; onResize(); }
        perfN = 0; perfAcc = 0;
      }
    }
    let rem = dt, guard = 0;
    while (rem > 1e-6 && guard++ < 8) { const h = Math.min(rem, 1 / 60); update(h); rem -= h; if (G.mode !== 'play') break; }
  } else if (G.mode !== 'pause') ambient(dt);
  render();
  updateHUD();
}

function boot(data) {
  if (data && typeof data.best === 'number' && data.best > best) best = data.best;
  document.documentElement.lang = 'ja';
  onResize();
  updateSoundButton();
  showTitle();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildSprites(true); drawTitleArt(); }).catch(() => {});
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ best })); } catch (e) { /* optional */ } }
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});

// Small hook for automated play-testing.
window.__tanepoko = { G, update, render, prepareStage, startGame, showResult, laneOf, WORLD, frontGate, ITEMS };
})();
