<script>
(()=>{
'use strict';
const REC=!!window.__RECORD__;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry32(1);
const PR=Math.random;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const FONT_UI="'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";
const FONT_LOGO="'Mochiy Pop One','DotGothic16','Hiragino Maru Gothic ProN',sans-serif";
const ALLTXT='どうぶつカートGPスタートキャラクターをえらんでねけっていもういちどレースけっかゴールファイナルラップロケットドリフトでミニターボにんじんゲットぶんぶんバチどんぐりいっきにかそくめいちゅうトップにたったアップ位ブラウザであそべるよみこみちゅうアクセルハンドルアイテムスピードかそくハンドル8ひきのなかまと3しゅうたぬきうさぎかえるペンギンきつねくまねこひよこポコミミケロスケペンタコンタゴローチャチャピッピタッチボタンスマホはオンオフおとLAP0123456789\'"-:/!！？…・ 　';

// ---------- screen & world constants ----------
const W=360,H=640,F=420,HZ=176,CAM_H=140,CAM_D=196;
const MAP=2048,MIPS=6,RW=92,CURB=10,WALL=RW+72,SP=8;
const BASE_V=520,LAPS=3,NF=24;

// ---------- colour helpers ----------
const hexc={};
function rgb(h){if(hexc[h])return hexc[h];let s=h.slice(1);if(s.length===3)s=s.split('').map(c=>c+c).join('');const n=parseInt(s,16);return hexc[h]=[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,k){const c=rgb(h);return`rgb(${clamp(c[0]*k,0,255)|0},${clamp(c[1]*k,0,255)|0},${clamp(c[2]*k,0,255)|0})`;}

// ---------- racers (all original characters) ----------
const CHARS=[
 {name:'ポコ',kind:'たぬき',kart:'#f28b2a',trim:'#ffe08a',fur:'#a8763f',fur2:'#f2dcb3',ear:'round',mask:'#4b3322',tail:'stripe',spd:3,acc:3,hdl:3},
 {name:'ミミ',kind:'うさぎ',kart:'#ff79b0',trim:'#fff0f6',fur:'#fbf7f2',fur2:'#ffd3e2',ear:'long',cheek:'#ff9ab8',nose:'#ff7a9c',spd:2,acc:5,hdl:4},
 {name:'ケロスケ',kind:'かえる',kart:'#2fb457',trim:'#e3f76b',fur:'#74d04c',fur2:'#eaf8c0',ear:'frog',cheek:'#ff9f9f',spd:3,acc:3,hdl:4},
 {name:'ペンタ',kind:'ペンギン',kart:'#3a8eea',trim:'#c9ecff',fur:'#2e3350',fur2:'#ffffff',ear:'none',beak:'#ffa42b',face:'#ffffff',spd:4,acc:2,hdl:3},
 {name:'コンタ',kind:'きつね',kart:'#e5413b',trim:'#ffd59a',fur:'#f28a2b',fur2:'#fff5e6',ear:'pointy',earIn:'#5a2b17',tail:'tip',spd:4,acc:3,hdl:2},
 {name:'ゴロー',kind:'くま',kart:'#7a53d8',trim:'#ddd0ff',fur:'#7d5234',fur2:'#d9b48a',ear:'round',spd:5,acc:2,hdl:2},
 {name:'チャチャ',kind:'ねこ',kart:'#16b3b0',trim:'#c6fff6',fur:'#9aa0ab',fur2:'#ffffff',ear:'pointy',earIn:'#ffb0c4',tail:'plain',nose:'#ff8fa8',spd:3,acc:4,hdl:3},
 {name:'ピッピ',kind:'ひよこ',kart:'#f4f1e8',trim:'#ff8a3d',fur:'#ffd93b',fur2:'#fff3a6',ear:'tuft',beak:'#ff9a1f',cheek:'#ffb08a',spd:2,acc:4,hdl:5},
];

// ---------- tiny 3D sprite renderer (pre-renders karts from 24 angles) ----------
const PITCH=0.5,CPI=Math.cos(PITCH),SPI=Math.sin(PITCH);
const LT=(()=>{const v=[-0.45,-0.55,0.7],l=Math.hypot(...v);return v.map(x=>x/l);})();
const rot=(p,c,s)=>[p[0]*c+p[1]*s,-p[0]*s+p[1]*c,p[2]];
function render3D(g,ox,oy,th,spu,build){
  const c=Math.cos(th),s=Math.sin(th),L=[[],[]];
  const P=p=>{const r=rot(p,c,s);return{x:ox+r[0]*spu,y:oy+(-r[2]*CPI-r[1]*SPI)*spu,d:r[1]*CPI-r[2]*SPI};};
  const FACES=[[0,1,2,3,0,0,-1],[4,5,6,7,0,0,1],[0,1,5,4,0,-1,0],[2,3,7,6,0,1,0],[1,2,6,5,1,0,0],[3,0,4,7,-1,0,0]];
  const api={
    box(x0,x1,y0,y1,z0,z1,col,layer=0){
      const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]].map(P);
      for(const f of FACES){
        const n=rot([f[4],f[5],f[6]],c,s);
        if(n[1]*CPI-n[2]*SPI>-0.02)continue;
        const br=0.6+0.45*Math.max(0,n[0]*LT[0]+n[1]*LT[1]+n[2]*LT[2]);
        const q=[v[f[0]],v[f[1]],v[f[2]],v[f[3]]],d=(q[0].d+q[1].d+q[2].d+q[3].d)/4,fill=shade(col,br);
        L[layer].push({d,draw(){g.fillStyle=fill;g.strokeStyle=fill;g.lineWidth=0.9;g.beginPath();g.moveTo(q[0].x,q[0].y);for(let i=1;i<4;i++)g.lineTo(q[i].x,q[i].y);g.closePath();g.fill();g.stroke();}});
      }
    },
    sphere(x,y,z,r,col,layer=1,decals){
      const p=P([x,y,z]),RR=r*spu;
      L[layer].push({d:p.d,draw(){
        const gr=g.createRadialGradient(p.x-RR*0.35,p.y-RR*0.4,RR*0.1,p.x,p.y,RR);
        gr.addColorStop(0,shade(col,1.16));gr.addColorStop(0.6,col);gr.addColorStop(1,shade(col,0.74));
        g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,RR,0,TAU);g.fill();
        if(!decals)return;
        for(const dc of decals){
          const n=rot(dc.dir,c,s),facing=-(n[1]*CPI-n[2]*SPI);
          if(facing<0.1)continue;
          const px=p.x+n[0]*RR,py=p.y+(-n[2]*CPI-n[1]*SPI)*RR;
          const ang=Math.atan2(py-p.y,px-p.x),sz=dc.r*spu;
          g.fillStyle=dc.col;g.beginPath();g.ellipse(px,py,Math.max(0.4,sz*facing),sz*(dc.ry||1),ang,0,TAU);g.fill();
          if(dc.eye){g.fillStyle='#ffffff';g.beginPath();g.arc(px-sz*0.25,py-sz*0.45,Math.max(0.7,sz*0.38),0,TAU);g.fill();}
        }
      }});
    },
    tri(a,b,cc,col,layer=1,inner){
      const A=P(a),B=P(b),C=P(cc),d=(A.d+B.d+C.d)/3;
      L[layer].push({d,draw(){
        g.fillStyle=col;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.lineTo(C.x,C.y);g.closePath();g.fill();
        if(inner){const mx=(A.x+B.x+C.x)/3,my=(A.y+B.y+C.y)/3,k=0.5;g.fillStyle=inner;g.beginPath();g.moveTo(mx+(A.x-mx)*k,my+(A.y-my)*k+1);g.lineTo(mx+(B.x-mx)*k,my+(B.y-my)*k+1);g.lineTo(mx+(C.x-mx)*k,my+(C.y-my)*k);g.closePath();g.fill();}
      }});
    }
  };
  build(api);
  for(const l of L){l.sort((a,b)=>b.d-a.d);for(const p of l)p.draw();}
}
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
function buildChar(api,ch,headOnly){
  const hx=0,hy=headOnly?0:-2.5,hz=headOnly?0:21.5,hr=7.5;
  if(!headOnly){
    const K=ch.kart,T=ch.trim,D='#2a2a35',M='#606674';
    for(const sx of[-1,1])for(const wy of[[7,13.5],[-13.5,-6.5]])api.box(sx<0?-14.5:9,sx<0?-9:14.5,wy[0],wy[1],0,7,D,0);
    api.box(-9,9,-13,12,2.5,8,K,0);
    api.box(-6.5,6.5,12,19,2.5,6.2,K,0);
    api.box(-8.5,8.5,18,20.5,1.5,4.5,T,0);
    api.box(-9.5,9.5,-14.5,-12.5,2,6.5,T,0);
    api.box(-6,6,-11,-7,8,13.5,shadeHex(K,0.8),1);
    api.box(-11,11,-16,-12.5,11,12.6,T,1);
    api.box(-6,-4,-15,-13,7,11,M,1);api.box(4,6,-15,-13,7,11,M,1);
    api.box(-3.5,3.5,4,5.5,10,13,D,1);
    api.sphere(0,-3,13.5,6,ch.fur,1,[{dir:nrm([0,1,0.15]),r:3.8,col:ch.fur2}]);
    api.sphere(-4.3,1.5,12.8,2.2,ch.fur,1);api.sphere(4.3,1.5,12.8,2.2,ch.fur,1);
    if(ch.tail==='stripe'){api.sphere(0,-16.5,9.5,3.6,ch.fur,1);api.sphere(0,-19.2,8.6,3.3,ch.mask,1);api.sphere(0,-21.6,8,2.9,ch.fur,1);}
    if(ch.tail==='tip'){api.sphere(0,-16.5,10,3.8,ch.fur,1);api.sphere(0,-19.6,10.8,3.5,ch.fur,1);api.sphere(0,-22.2,11.8,2.8,'#ffffff',1);}
    if(ch.tail==='plain'){for(let i=0;i<4;i++)api.sphere(0,-15.2-i*0.4,12+i*3,1.7,ch.fur,1);}
  }
  const dec=[];
  const eyeL=nrm([-0.36,0.86,0.12]),eyeR=nrm([0.36,0.86,0.12]);
  if(ch.face)dec.push({dir:nrm([0,1,0.02]),r:5.8,ry:1.05,col:ch.face});
  if(ch.mask){dec.push({dir:nrm([-0.4,0.85,0.06]),r:2.7,ry:1.1,col:ch.mask});dec.push({dir:nrm([0.4,0.85,0.06]),r:2.7,ry:1.1,col:ch.mask});}
  if(!ch.face&&!ch.beak&&ch.ear!=='frog')dec.push({dir:nrm([0,0.93,-0.36]),r:3.1,ry:1.05,col:ch.fur2});
  if(ch.ear!=='frog'){dec.push({dir:eyeL,r:1.45,ry:1.4,col:'#1b1b26',eye:true});dec.push({dir:eyeR,r:1.45,ry:1.4,col:'#1b1b26',eye:true});}
  if(!ch.beak&&ch.ear!=='frog')dec.push({dir:nrm([0,0.96,-0.22]),r:1.15,col:ch.nose||'#2a1d1a'});
  if(ch.ear==='frog')dec.push({dir:nrm([0,0.9,-0.4]),r:0.55,ry:5,col:'#2b5a24'});
  if(ch.cheek){dec.push({dir:nrm([-0.66,0.68,-0.28]),r:1.5,col:ch.cheek});dec.push({dir:nrm([0.66,0.68,-0.28]),r:1.5,col:ch.cheek});}
  api.sphere(hx,hy,hz,hr,ch.fur,1,dec);
  if(ch.beak)api.sphere(hx,hy+7.4,hz-1.2,2.1,ch.beak,1);
  for(const s of[-1,1]){
    if(ch.ear==='round')api.sphere(hx+s*5.3,hy-0.6,hz+5.3,2.8,ch.fur,1,[{dir:[0,1,0],r:1.5,col:ch.fur2}]);
    else if(ch.ear==='pointy')api.tri([hx+s*2.2,hy,hz+6.4],[hx+s*6.9,hy,hz+3.1],[hx+s*6.3,hy-0.4,hz+11.6],ch.fur,1,ch.earIn);
    else if(ch.ear==='long')for(let t=0;t<5;t++)api.sphere(hx+s*(2.4+t*0.35),hy-0.6-t*0.25,hz+6.6+t*2.6,2.5-t*0.12,ch.fur,1,t>0?[{dir:[0,1,0],r:1.1,ry:1.6,col:'#ffc0d4'}]:null);
    else if(ch.ear==='frog')api.sphere(hx+s*3.6,hy+1.4,hz+5.3,2.9,ch.fur,1,[{dir:nrm([0,1,0.25]),r:2.1,col:'#ffffff'},{dir:nrm([0,1,0.25]),r:1.15,ry:1.2,col:'#1b1b26',eye:true}]);
  }
  if(ch.ear==='tuft'){api.sphere(hx,hy-0.5,hz+7.6,1.7,ch.fur,1);api.sphere(hx+1.4,hy-1,hz+7,1.3,ch.fur,1);api.sphere(hx-1.3,hy,hz+7.1,1.2,ch.fur,1);}
}
function shadeHex(h,k){const c=rgb(h);return'#'+c.map(v=>clamp(Math.round(v*k),0,255).toString(16).padStart(2,'0')).join('');}
function outline(cv,col=[24,20,48]){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height,id=g.getImageData(0,0,w,h),d=id.data,a=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)a[i]=d[i*4+3]>100?1:0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(a[i])continue;if(a[i-1]|a[i+1]|a[i-w]|a[i+w]){const j=i*4;d[j]=col[0];d[j+1]=col[1];d[j+2]=col[2];d[j+3]=255;}}
  g.putImageData(id,0,0);
}

// ---------- 2D sprites & icons ----------
function drawCarrot(g,x,y,s){
  g.save();g.translate(x,y);g.rotate(-0.7);g.scale(s,s);
  g.fillStyle='#3bb54a';g.beginPath();g.ellipse(-3.2,-14,3,7,-0.45,0,TAU);g.ellipse(3.2,-14,3,7,0.45,0,TAU);g.ellipse(0,-16,2.6,8,0,0,TAU);g.fill();
  g.fillStyle='#ff8a1f';g.beginPath();g.moveTo(-7.5,-8);g.quadraticCurveTo(0,-11.5,7.5,-8);g.lineTo(1.4,16);g.quadraticCurveTo(0,18.5,-1.4,16);g.closePath();g.fill();
  g.fillStyle='#ffb867';g.beginPath();g.ellipse(-2.8,-3,1.6,6,0.12,0,TAU);g.fill();
  g.strokeStyle='#c65808';g.lineWidth=1.3;g.beginPath();g.moveTo(1,-3);g.lineTo(5,-4);g.moveTo(-3,5);g.lineTo(0.5,5.5);g.moveTo(0.5,11);g.lineTo(2.6,10.6);g.stroke();
  g.restore();
}
function drawAcorn(g,x,y,s){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#b86b2b';g.beginPath();g.ellipse(0,4,10,12,0,0,TAU);g.fill();
  g.fillStyle='#e39a5c';g.beginPath();g.ellipse(-3.5,2,2.6,6,0.2,0,TAU);g.fill();
  g.fillStyle='#6e4a2a';g.beginPath();g.ellipse(0,-6,12.5,6.5,0,0,TAU);g.fill();
  g.strokeStyle='#4d3219';g.lineWidth=1.1;g.beginPath();for(let i=-9;i<=9;i+=4.5){g.moveTo(i-3,-10);g.lineTo(i+3,-2);g.moveTo(i+3,-10);g.lineTo(i-3,-2);}g.stroke();
  g.fillStyle='#4d3219';g.fillRect(-1.4,-16,2.8,6);
  g.restore();
}
function drawBee(g,x,y,s,flap=0){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(232,248,255,0.95)';g.beginPath();g.ellipse(-4,-9-flap*2,5.5,8.5-flap*3,-0.5,0,TAU);g.ellipse(5,-9-flap*2,5.5,8.5-flap*3,0.5,0,TAU);g.fill();
  g.fillStyle='#ffd21f';g.beginPath();g.ellipse(0,2,12,9,0,0,TAU);g.fill();
  g.save();g.beginPath();g.ellipse(0,2,12,9,0,0,TAU);g.clip();g.fillStyle='#2a2230';g.fillRect(-3,-8,3.4,20);g.fillRect(4,-8,3.4,20);g.restore();
  g.fillStyle='#2a2230';g.beginPath();g.moveTo(11,1);g.lineTo(17,3);g.lineTo(11,5.5);g.closePath();g.fill();
  g.beginPath();g.arc(-7.5,0,2,0,TAU);g.fill();
  g.fillStyle='#ff9aa8';g.beginPath();g.arc(-8,5,1.8,0,TAU);g.fill();
  g.restore();
}
function drawIcon(g,type,x,y,size){if(type==='carrot')drawCarrot(g,x,y,size/40);else if(type==='acorn')drawAcorn(g,x,y+size*0.04,size/38);else drawBee(g,x,y+size*0.05,size/40,0);}
function makeTree(kind){
  const c=mk(84,124),g=c.getContext('2d');
  g.fillStyle='#7a4a2a';g.fillRect(36,80,12,44);g.fillStyle='#5b351c';g.fillRect(44,80,4,44);
  const blob=(col,arr)=>{g.fillStyle=col;g.beginPath();for(const[x,y,r]of arr){g.moveTo(x+r,y);g.arc(x,y,r,0,TAU);}g.fill();};

    else if(PR()<0.5)emit(r,rx-sa*k.drift*10,ry+ca*k.drift*10,2,-ca*30,-sa*30,30,0.35,'#e6e6ee',3.5,0);}

function onLap(r,k){

    return;}

    if(k.lap===r.laps){sfx('final');bgm('race',172,true);r.msgs.push({text:'ファイナルラップ！',t0:r.clock,dur:2,size:38,col:'#ff7a5a'});ev('final');}
    else{sfx('lap');r.msgs.push({text:'LAP '+k.lap,t0:r.clock,dur:1.6,size:44,col:'#ffffff'});}

function ranks(r){
  const arr=r.karts.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.place-b.place;if(a.finished)return-1;if(b.finished)return 1;return b.prog-a.prog;});

}
function stepRace(r,dt){
  const prev=r.clock;r.clock+=dt;const c=r.clock;
  if(!r.attract)for(const m of[-3,-2,-1]){const tm=m*r.cd;if(prev<tm&&c>=tm)sfx('count');}
  const ref=r.player;
  for(const k of r.karts){
    let rb=1;if(ref&&!k.isPlayer&&!ref.finished){const pd=ref.prog-k.prog;if(pd>30)rb=1+Math.min(0.09,(pd-30)*0.0009);else if(pd<-50)rb=1-Math.min(0.07,(-pd-50)*0.0007);}
    k.skill=k.baseSkill*rb;
    const inp=(k.isPlayer&&!k.demo&&!k.finished)?playerInput():aiInput(r,k,dt);
    if(c<0){if(inp.thr){if(k.thrStart==null)k.thrStart=c;}else k.thrStart=null;k.rev=inp.thr;continue;}
    if(prev<0&&!r.attract){if(k.thrStart!=null&&k.thrStart>=-0.45*r.cd){k.boostT=0.75;k.speed=BASE_V*0.35;if(k.isPlayer){sfx('boost');ev('rocket');}}}
    updateKart(r,k,inp,dt);
  }
  if(prev<0&&c>=0&&!r.attract){sfx('go');bgm('race',150);ev('go');r.msgs.push({text:'GO!',t0:c,dur:0.9,size:92,col:'#ffd23f'});}
  if(c>=0){
    const K=r.karts;
    for(let i=0;i<K.length;i++)for(let j=i+1;j<K.length;j++){const a=K[i],b=K[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<26*26&&d2>0.01){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(26-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const im=rv*0.5;a.vx+=im*nx;a.vy+=im*ny;b.vx-=im*nx;b.vy-=im*ny;if((a.isPlayer||b.isPlayer)&&-rv>90){const p=a.isPlayer?a:b;if(p.bumpCd<=0){sfx('bump');p.bumpCd=0.4;}}}}}
    for(const b of r.boxes){if(!b.active){b.t-=dt;if(b.t<=0)b.active=true;continue;}
      for(const k of K){if((k.x-b.x)**2+(k.y-b.y)**2<24*24){b.active=false;b.t=2.5;for(let i=0;i<8;i++)emit(r,b.x,b.y,12,(PR()-0.5)*200,(PR()-0.5)*200,80+PR()*80,0.45,['#56c8ff','#ff4f86','#ffffff'][i%3],3,300);
        if(!k.item&&k.roulette<=0){k.nextItem=pickItem(r,k);k.roulette=1.1;if(k.isPlayer){sfx('box');sfx('roll');}}else if(k.isPlayer)sfx('box');break;}}}
    for(const a of r.acorns){a.t+=dt;for(const k of K){if(k===a.owner&&a.t<0.7)continue;if((k.x-a.x)**2+(k.y-a.y)**2<18*18){hitKart(r,k,a.owner,'acorn');a.dead=true;break;}}}
    r.acorns=r.acorns.filter(a=>!a.dead);
    for(const b of r.bees){b.t+=dt;let tx,ty;const tg=b.target;
      if(tg&&!tg.finished){tx=tg.x;ty=tg.y;}else{const p=T.pts[(b.idx+14)%T.N];tx=p.x;ty=p.y;}
      const d=wrapA(Math.atan2(ty-b.y,tx-b.x)-b.a),tr=(b.t<0.25?2:7)*dt;b.a+=clamp(d,-tr,tr);
      b.x+=Math.cos(b.a)*820*dt;b.y+=Math.sin(b.a)*820*dt;locate(b);
      if(PR()<0.5)emit(r,b.x,b.y,14,0,0,10,0.3,'#fff6b0',2,0);
      for(const k of K){if(k===b.owner&&b.t<1.2)continue;if((k.x-b.x)**2+(k.y-b.y)**2<22*22){hitKart(r,k,b.owner,'bee');b.dead=true;break;}}
      if(b.t>7)b.dead=true;}
    r.bees=r.bees.filter(b=>!b.dead);
  }
  ranks(r);
  if(r.player){if(r.player.rank<r.prevRank&&c>1)ev('rankup',r.player.rank);if(r.player.rank>=3)ev('behind');r.prevRank=r.player.rank;}
  for(const p of r.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.h+=p.vh*dt;p.vh-=p.grav*dt;if(p.h<0){p.h=0;p.vh*=-0.3;}}
  r.parts=r.parts.filter(p=>p.life>0);
  for(const q of r.conf){q.x+=q.vx*dt;q.y+=q.vy*dt;q.a+=q.va*dt;}
  r.conf=r.conf.filter(q=>q.y<700);
  // camera
  const k=camTarget(r),cm=r.cam;
  cm.f+=((F-(k.boostT>0?46:0))-cm.f)*Math.min(1,dt*5);
  cm.a+=wrapA(k.a-cm.a)*Math.min(1,dt*6.5);cm.h=CAM_H;
  cm.x=k.x-Math.cos(cm.a)*CAM_D;cm.y=k.y-Math.sin(cm.a)*CAM_D;cm.shake=Math.max(0,cm.shake-dt*20);
}

const lo=mk(W,H),L=lo.getContext('2d',{willReadFrequently:false});
const floorImg=L.createImageData(W,H),FB=new Uint32Array(floorImg.data.buffer);
const HAZE=[205,236,255];
function drawFloor(cam){
  const ca=Math.cos(cam.a),sa=Math.sin(cam.a),half=W/2,f=cam.f;
  for(let y=HZ+1;y<H;y++){
    const dy=y-HZ,z=cam.h*f/dy,sc=z/f;
    let lv=0;if(sc>1)lv=Math.min(MIPS-1,Math.floor(Math.log2(sc)+0.25));
    const tex=MIP[lv],sz=MAP>>lv,sh=1/(1<<lv),cx=cam.x+ca*z,cy=cam.y+sa*z;
    let tx=(cx+sa*half*sc)*sh,ty=(cy-ca*half*sc)*sh;const dtx=-sa*sc*sh,dty=ca*sc*sh;
    let o=y*W;const end=o+W;
    if(lv<=1){for(;o<end;o++){const ix=tx|0,iy=ty|0;FB[o]=(tx>=0&&ty>=0&&ix<sz&&iy<sz)?tex[iy*sz+ix]:OUTT[((iy<<lv)&63)*64+((ix<<lv)&63)];tx+=dtx;ty+=dty;}}
    else{for(;o<end;o++){const ix=tx|0,iy=ty|0;FB[o]=(tx>=0&&ty>=0&&ix<sz&&iy<sz)?tex[iy*sz+ix]:OUT_AVG;tx+=dtx;ty+=dty;}}
    if(dy<46){const ht=(1-dy/46)*0.7,ih=1-ht,hr=HAZE[0]*ht,hg=HAZE[1]*ht,hb=HAZE[2]*ht;
      for(let q=y*W;q<end;q++){const v=FB[q];FB[q]=0xff000000|((((v>>16)&255)*ih+hb)<<16)|((((v>>8)&255)*ih+hg)<<8)|(((v&255)*ih+hr)|0);}}
  }
  L.putImageData(floorImg,0,0,0,HZ+1,W,H-HZ-1);
}

function muteBtn(){rr(306,12,42,30,10,'rgba(16,18,46,0.72)','#ffffff',2);txt(SND.muted?'おとOFF':'おとON',327,27,9.5,'#ffffff',{stroke:null});S.hits.push({x:306,y:12,w:42,h:30,fn:()=>setMuted(!SND.muted)});}
function drawBars(x,y,label,v){txt(label,x,y,13,'#ffffff',{align:'left',stroke:null});for(let i=0;i<5;i++)rr(x+72+i*24,y-7,20,14,3,i<v?'#ffd23f':'rgba(255,255,255,0.18)');}
function drawSelect(){
  D.fillStyle='rgba(12,18,48,0.72)';D.fillRect(0,0,DW,DH);
  txt('キャラクターを えらんでね',180,44,20,'#ffffff',{sw:6});
  const ch=CHARS[S.sel];
  D.save();D.fillStyle='rgba(255,255,255,0.08)';D.beginPath();D.ellipse(180*u,236*u,120*u,30*u,0,0,TAU);D.fill();D.restore();
  const fr=Math.floor(S.t*7)%NF;D.imageSmoothingEnabled=true;D.drawImage(ATLAS[S.sel],fr*FW,0,FW,FH,(180-100)*u,(236-200)*u,200*u,248*u);
  txt(ch.name,180,290,30,'#ffd23f',{font:FONT_LOGO,sw:8});
  txt(ch.kind,180,322,14,'#cfe3ff',{stroke:null});
  drawBars(96,350,'スピード',ch.spd);drawBars(96,372,'かそく',ch.acc);drawBars(96,394,'ハンドル',ch.hdl);
  for(let i=0;i<8;i++){const x=24+(i%4)*80,y=418+Math.floor(i/4)*82,on=i===S.sel;rr(x,y,72,74,12,on?'#ffd23f':'rgba(255,255,255,0.12)',on?'#ffffff':null,3);D.drawImage(FACEIMG[i],x*u,(y-2)*u,72*u,80*u);
    S.hits.push({x,y,w:72,h:74,fn:()=>{if(S.sel===i)startRace();else{S.sel=i;sfx('sel');}}});}
  button('けってい！',100,592,160,40,startRace,{size:20});
  muteBtn();
}
function drawResults(r,buttons){
  const a=REC?ease((DIR.T-DIR.goalT-2.6)/0.4):1;
  D.globalAlpha=a;D.fillStyle='rgba(12,18,48,0.62)';D.fillRect(0,0,DW,DH);
  rr(24,120,312,392,18,'rgba(20,22,60,0.92)','#ffffff',3);
  txt('レース けっか',180,150,24,'#ffd23f',{font:FONT_LOGO,sw:7});
  r.order.forEach((k,i)=>{const y=184+i*40,me=k.isPlayer;if(me)rr(36,y-17,288,36,10,'rgba(255,210,63,0.28)','#ffd23f',2);
    txt(String(k.finished?k.place:i+1),62,y,22,i===0?'#ffd23f':'#ffffff',{font:FONT_LOGO,sw:5});
    D.drawImage(FACEIMG[k.ci],84*u,(y-19)*u,34*u,38*u);
    txt(k.ch.name,128,y,17,'#ffffff',{align:'left',sw:4});
    txt(k.finished?fmt(k.finishTime):'--\'--"--',314,y,14,'#ffffff',{align:'right',sw:4});});
  if(buttons){button('もういちど',30,528,144,46,()=>startRace(),{size:18});button('キャラをえらぶ',186,528,144,46,goSelect,{size:16,fill:'#bfe6ff'});}
  D.globalAlpha=1;
}
function render(){
  const r=S.race;if(!r)return;const cam=r.cam;
  drawFloor(cam);drawSky(cam);drawWorld(r,cam);
  if(r.player&&r.player.boostT>0){L.strokeStyle='rgba(255,255,255,0.55)';L.lineWidth=1;for(let i=0;i<7;i++){const a=PR()*TAU,r0=150+PR()*40;L.beginPath();L.moveTo(W/2+Math.cos(a)*r0,360+Math.sin(a)*r0*1.4);L.lineTo(W/2+Math.cos(a)*(r0+60),360+Math.sin(a)*(r0+60)*1.4);L.stroke();}}
  S.hits=[];
  const sh=cam.shake&&!RM?cam.shake:0;
  D.imageSmoothingEnabled=false;D.drawImage(lo,(PR()-0.5)*sh*2*u,(PR()-0.5)*sh*2*u,DW,DH);D.imageSmoothingEnabled=true;
  if(S.mode==='race'||S.mode==='result'){if(!(REC&&DIR.T<DIR.intro))drawHUD(r);}
  if(S.mode==='title')drawTitle();
  else if(S.mode==='select')drawSelect();
  else if(S.mode==='result')drawResults(r,!REC);
  if(REC)drawDirector(r);
}
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- screens & input ----------
function goTitle(){S.mode='title';R=mulberry32(Date.now()&0xffff);S.race=newRace({attract:true});S.focus=Math.floor(PR()*8);S.focusT=0;bgm('title',128);showPads(false);}
function goSelect(){audioInit();sfx('ok');S.mode='select';if(!S.race||!S.race.attract){S.race=newRace({attract:true});}if(BGM.mode!=='title')bgm('title',128);showPads(false);}
function startRace(){audioInit();sfx('ok');R=mulberry32((Date.now()*7)&0xffffff);S.race=newRace({pc:S.sel,laps:LAPS});S.mode='race';bgm(null);showPads(S.touch);}
function update(dt){
  S.t+=dt;if(REC)DIR.T+=dt;
  const r=S.race;if(!r)return;
  if(r.attract){S.focusT+=dt;if(S.focusT>9){S.focusT=0;S.focus=(S.focus+1+Math.floor(PR()*6))%8;const k=camTarget(r);r.cam.a=k.a;}}
  stepRace(r,dt);
  if(S.mode==='race'&&r.player&&r.player.finished&&r.clock-r.player.finishTime>3&&!REC){S.mode='result';showPads(false);bgm('title',118);}
}
const pads=document.getElementById('pads');
function showPads(v){pads.hidden=!v;}
function bindPad(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();audioInit();if(key==='i'){itemEdge=true;}else touch[key]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}};const off=e=>{e.preventDefault();if(key!=='i')touch[key]=false;el.classList.remove('on');};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);el.addEventListener('contextmenu',e=>e.preventDefault());}
bindPad('padL','l');bindPad('padR','r');bindPad('padD','d');bindPad('padI','i');
const GAMEKEYS=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight','KeyW','KeyA','KeyS','KeyD','KeyC','KeyX','Enter']);
window.addEventListener('keydown',e=>{
  if(REC)return;if(GAMEKEYS.has(e.code))e.preventDefault();
  audioInit();keys[e.code]=true;if(e.repeat)return;
  if(e.code==='KeyM'){setMuted(!SND.muted);return;}
  if(S.mode==='title'&&(e.code==='Enter'||e.code==='Space'))goSelect();
  else if(S.mode==='select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){S.sel=(S.sel+7)%8;sfx('sel');}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){S.sel=(S.sel+1)%8;sfx('sel');}
    else if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='KeyW'||e.code==='KeyS'){S.sel=(S.sel+4)%8;sfx('sel');}
    else if(e.code==='Enter'||e.code==='Space')startRace();
    else if(e.code==='Escape')goTitle();
  }
  else if(S.mode==='race'){if(e.code==='Space'||e.code==='KeyX')itemEdge=true;if(e.code==='Escape')goTitle();}
  else if(S.mode==='result'){if(e.code==='Enter'||e.code==='Space')startRace();else if(e.code==='Escape'||e.code==='Backspace')goSelect();}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touch.l=touch.r=touch.d=false;});
disp.addEventListener('pointerdown',e=>{
  if(REC)return;audioInit();disp.focus();
  if(e.pointerType==='touch'&&!S.touch){S.touch=true;if(S.mode==='race')showPads(true);}
  const b=disp.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*360,y=(e.clientY-b.top)/b.height*640;
  for(let i=S.hits.length-1;i>=0;i--){const h=S.hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return;}}
  if(S.mode==='title')goSelect();
});
function fit(){
  if(REC)return;
  const cs=getComputedStyle(document.body),pl=parseFloat(cs.paddingLeft)||16,pr=parseFloat(cs.paddingRight)||16;
  const aw=Math.max(200,window.innerWidth-pl-pr),ah=Math.max(300,window.innerHeight-24);
  const ch=Math.min(ah,aw*16/9),cw=ch*9/16,dpr=Math.min(2,window.devicePixelRatio||1);
  disp.style.width=cw+'px';disp.style.height=ch+'px';DW=Math.round(cw*dpr);DH=Math.round(DW*16/9);disp.width=DW;disp.height=DH;u=DW/360;
  const pw=Math.max(52,Math.min(84,cw*0.19));for(const el of pads.querySelectorAll('.pad')){el.style.width=(el.classList.contains('wide')||el.classList.contains('sm')?pw*1.4:pw)+'px';el.style.height=(el.classList.contains('sm')?pw*0.7:pw)+'px';el.style.fontSize=Math.round(pw*0.22)+'px';}
}
window.addEventListener('resize',fit);
function loadingScreen(){D.fillStyle='#0e2419';D.fillRect(0,0,DW,DH);D.fillStyle='#fff7e0';D.font=`${18*u}px ${FONT_UI}`;D.textAlign='center';D.fillText('よみこみちゅう…',DW/2,DH/2);}
let last=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000||0);last=now;
  let acc=(loop.acc||0)+dt;while(acc>=1/60){update(1/60);acc-=1/60;}loop.acc=acc;
  render();engineUpdate();bgmPump();
  requestAnimationFrame(loop);
}

// ---------- recording director (used only to make the Shorts video) ----------
function caption(text,dur=1.8){DIR.cap={text,t0:DIR.T,dur};}
function dirEvent(n,d){
  const f=DIR.flags;
  if(n==='rocket')f.rocket=true;
  else if(n==='behind'){if(f.top)f.fell=1;}
  else if(n==='go')caption(f.rocket?'ロケットスタート！':'スタート！',1.6);
  else if(n==='miniturbo'){if(!f.mt&&d===2){f.mt=1;caption('ドリフトで ミニターボ！',1.9);}}
  else if(n==='itemget'){if(!f['it_'+d]){f['it_'+d]=1;caption(d==='carrot'?'にんじんロケット ゲット！':d==='bee'?'ぶんぶんバチ ゲット！':'どんぐり ゲット！',1.6);}}
  else if(n==='hurt'){f.fell=1;caption(d==='acorn'?'どんぐりで スリップ！':'ハチに さされた！',1.6);}
  else if(n==='hitother')caption(d==='acorn'?'どんぐり ヒット！':'めいちゅう！',1.4);
  else if(n==='carrot')caption('いっきに かそく！',1.4);
  else if(n==='rankup'){if(d===1&&(!f.top||f.fell)){caption(f.top?'ぎゃくてん トップ！':'トップに たった！',2);f.top=1;f.fell=0;}else if(d>1&&DIR.T-(f.lr||0)>3.2&&!(DIR.cap&&DIR.T-DIR.cap.t0<DIR.cap.dur)){f.lr=DIR.T;caption(d+'位に アップ！',1.3);}}
  else if(n==='goal'){DIR.goalT=DIR.T;caption(d+'位で ゴール！',2.4);}
}
function dirUpdate(){
  const r=S.race;
  if(DIR.T<DIR.intro){const uu=ease(DIR.T/DIR.intro),k=r.player,ang=k.a+(1-uu)*2.2,dist=lerp(980,CAM_D,uu);r.cam.h=lerp(760,CAM_H,uu);r.cam.a=ang;r.cam.x=k.x-Math.cos(ang)*dist;r.cam.y=k.y-Math.sin(ang)*dist;}
  if(DIR.goalT!=null){const g=DIR.T-DIR.goalT;if(g>2.6&&S.mode!=='result'){S.mode='result';bgm('title',118);}if(g>DIR.o.tail)DIR.done=true;}
  engineUpdate();
}
function drawDirector(r){
  const T0=DIR.T;
  if(T0<DIR.intro){const a=T0<DIR.intro-0.35?1:(DIR.intro-T0)/0.35;D.globalAlpha=clamp(a,0,1);const pop=ease(T0/0.45);
    D.fillStyle='rgba(12,18,48,0.25)';D.fillRect(0,0,DW,DH);
    drawLogo(180,160,1.2*(0.6+0.4*pop),T0);
    if(T0>0.5){D.globalAlpha=clamp(a,0,1)*ease((T0-0.5)/0.3);rr(40,248,280,44,22,'rgba(16,18,46,0.8)');txt('どうぶつたちの カートレース！',180,271,18,'#ffffff',{stroke:null});}
    D.globalAlpha=1;}
  const cp=DIR.cap;
  if(cp&&T0-cp.t0<cp.dur&&!(DIR.goalT!=null&&T0-DIR.goalT>2.6)){const lt=T0-cp.t0,sc=lt<0.12?0.6+lt/0.12*0.55:lt<0.22?1.15-(lt-0.12)/0.1*0.15:1,al=lt>cp.dur-0.2?(cp.dur-lt)/0.2:1;
    D.globalAlpha=clamp(al,0,1);txt(cp.text,180,222,30*sc,'#ffffff',{font:FONT_LOGO,sw:10*sc,stroke:'#e5413b'});D.globalAlpha=1;}
  if(DIR.goalT!=null){const g=T0-DIR.goalT;
    if(g>2.6&&g<DIR.o.endAt){drawResults(r,false);}
    if(g>=DIR.o.endAt){const a=ease((g-DIR.o.endAt)/0.35);D.globalAlpha=a;D.fillStyle='#17286b';D.fillRect(0,0,DW,DH);
      const gr=D.createRadialGradient(DW/2,DH*0.35,10,DW/2,DH*0.35,DH*0.6);gr.addColorStop(0,'rgba(79,195,255,0.45)');gr.addColorStop(1,'rgba(23,40,107,0)');D.fillStyle=gr;D.fillRect(0,0,DW,DH);
      drawLogo(180,190,1.3,T0);
      for(let i=0;i<8;i++){const x=18+i*41.5,y=330+Math.sin(T0*5+i)*5;D.drawImage(FACEIMG[i],x*u,y*u,40*u,44*u);}
      txt('ブラウザで あそべる！',180,430,24,'#ffd23f',{font:FONT_LOGO,sw:7});
      txt('8ひきから えらんで レースしよう',180,470,16,'#ffffff',{sw:5});
      D.globalAlpha=1;}
  }
}
if(REC){
  window.REC={
    async init(o){await ready;DIR.o=Object.assign({tail:10.4,endAt:7.4},o);DIR.intro=o.intro||2.4;
      disp.width=DW=1080;disp.height=DH=1920;u=3;
      R=mulberry32(o.seed||1);
      S.race=newRace({pc:o.pc,pslot:o.pslot,laps:o.laps||LAPS,cd:o.cd||0.7,demo:true,force:o.force,skill:o.skill||0.92,pre:0});
      S.race.clock=-(DIR.intro+3*S.race.cd);S.mode='race';
      bgm('title',150);
      return{N:T.N,len:T.len};},
    step(){for(let i=0;i<2;i++){update(1/60);dirUpdate();}render();return{T:DIR.T,done:DIR.done,rank:S.race.player.rank,lap:S.race.player.lap};},
    sim(maxT=120){const rk=[];let nx=0;while(!DIR.done&&DIR.T<maxT){update(1/60);dirUpdate();if(DIR.T>=nx){rk.push(S.race.player.rank);nx+=2;}}const r=S.race;return{T:DIR.T,goal:DIR.goalT,order:r.order.map(k=>k.ch.name+(k.isPlayer?'*':'')),place:r.player.place,rk:rk.join(''),hits:r.player.hitN||0,walls:r.player.wallN||0,laps:r.karts.map(k=>k.ch.name+':'+(k.hitN||0)+'/'+(k.wallN||0)).join(' '),ev:LOG.sfx.filter(e=>!['count','hop','box','roll','bump'].includes(e.name)).map(e=>e.name+'@'+e.t.toFixed(1)).join(' ')};},
    map(){const c=mk(1024,1024);c.getContext('2d').drawImage(T.mapCanvas,0,0,1024,1024);return c.toDataURL('image/png');},
    frame(q){return disp.toDataURL('image/jpeg',q||0.9);},
    async audio(){return renderAudio(DIR.T+0.2);}
  };
}

// ---------- boot ----------
const ready=(async()=>{
  fit();loadingScreen();
  try{await Promise.race([Promise.all([document.fonts.load(`20px DotGothic16`,ALLTXT),document.fonts.load(`20px 'Mochiy Pop One'`,ALLTXT)]),new Promise(r=>setTimeout(r,REC?15000:2500))]);}catch(_){}
  buildTrack();buildAssets();
  if(!REC){goTitle();S.mode='title';requestAnimationFrame(t=>{last=t;loop(t);});}
})();
})();
</script>
