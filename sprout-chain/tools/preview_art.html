<canvas id="c" width="900" height="560" style="background:#2c2018"></canvas>
<script src="../src/art.js"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const soil = Art.makeSoil(900, 560, 140, 6, 4); ctx.drawImage(soil, 0, 0);
for (let col = 1; col <= 5; col++) for (let st = 0; st < 3; st++)
  Art.drawSprout(ctx, 90 + (col - 1) * 170, 110 + st * 160, 140, col, { stage: st, time: 0.3 * col, look: st - 1, happy: st === 2 && col % 2 === 0, blink: col === 3 && st === 1 ? 0.5 : 0 });
// two linked reds
Art.drawLink(ctx, 800, 480, 800, 480, 60, 1);
</script>
