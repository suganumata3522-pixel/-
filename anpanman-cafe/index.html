const NOISE=new WeakMap();

function tone(ac,out,t,o){

  if(o.sus) g.gain.exponentialRampToValueAtTime(vol*0.5,t+dur*0.8);

const BPM={normal:120,lunch:156}, STEP_N=128;
const stepDur=m=>60/BPM[m]/4;
const MEL=[76,0,79,76,72,0,74,76, 69,0,72,76,74,0,72,0, 77,0,81,77,72,0,74,77, 79,0,77,76,74,0,0,0,

const CHD={C:[60,64,67],Am:[57,60,64],F:[57,60,65],G:[55,59,62],Dm:[57,62,65]};
const ROOT={C:48,Am:45,F:41,G:43,Dm:50};
const PROG=[['C','C'],['Am','Am'],['F','F'],['G','G'],['C','C'],['Am','Am'],['Dm','G'],['C','C']];
const mf=m=>440*Math.pow(2,(m-69)/12);
function schedStep(ac,out,step,t,mode){
  const L=mode==='lunch', tr=L?2:0, beat=60/BPM[mode];
  const s=step%STEP_N, bar=s>>4, pos=s&15;
  if(pos&1){ if(L) nz(ac,out,t,{dur:0.03,vol:0.03,hp:7000}); return; }
  const off=(pos&3)===2, tt=t+((!L&&off)?beat/6:0), ch=PROG[bar][pos>>3];
  const mi=bar*8+(pos>>1), n=MEL[mi];
  if(n){
    let k=1; while(k<4&&!MEL[(mi+k)%64]) k++;
    const d=k*beat/2*0.92;
    tone(ac,out,tt,{type:'square',f:mf(n+tr),dur:d,vol:L?0.05:0.045,a:0.006,lp:L?4200:3200,sus:1});
    tone(ac,out,tt,{type:'triangle',f:mf(n+tr-12),dur:d,vol:0.05,sus:1});
  }
  if(!off){
    const q=pos>>2, r=ROOT[ch]+tr+((q&1)?7:0);
    tone(ac,out,tt,{type:'triangle',f:mf(r),dur:beat*0.5,vol:0.24,a:0.005});
    if(L||!(q&1)) tone(ac,out,tt,{type:'sine',f:150,f2:45,dur:0.13,vol:L?0.36:0.26});

    for(const m of CHD[ch]) tone(ac,out,tt,{type:'triangle',f:mf(m+tr),dur:0.13,vol:0.035});
    nz(ac,out,tt,{dur:0.03,vol:L?0.045:0.03,hp:7000});

}
// 録画用：イベントログから同じ音をオフラインで書き出す
async function renderAudio(total){
  const sr=44100, ac=new OfflineAudioContext(2,Math.ceil(total*sr),sr), o={};
  buildGraph(o,ac,ac.destination);
  const evs=AU.log.slice().sort((a,b)=>a.t-b.t), mEvs=evs.filter(e=>e.k==='m');
  let mode='normal', step=0, tn=0, playing=false;
  for(let i=0;i<mEvs.length;i++){
    const e=mEvs[i], end=i+1<mEvs.length?mEvs[i+1].t:total;
    if(e.a==='start'){ step=0; tn=e.t+0.05; playing=true; mode=e.m; }
    else if(e.a==='mode') mode=e.m; else playing=false;
    if(playing) while(tn<end){ schedStep(ac,o.musG,step,tn,mode); tn+=stepDur(mode); step++; }
  }
  for(const e of evs) if(e.k==='s') SFX[e.n](ac,o.sfxG,e.t+0.01);
  return wavB64(await ac.startRendering());
}
function wavB64(buf){
  const n=buf.length, L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L;
  const ab=new ArrayBuffer(44+n*4), v=new DataView(ab);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+n*4,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24,44100,true); v.setUint32(28,44100*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*4,true);
  let p=44; for(let i=0;i<n;i++){ v.setInt16(p,clamp(L[i],-1,1)*32767,true); v.setInt16(p+2,clamp(R[i],-1,1)*32767,true); p+=4; }
  const u8=new Uint8Array(ab); let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}

/* ================= Canvas ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let S=1,GX=0,GY=0, BACK=null, FRONT=null, FRAME=null, SPR=[], SIL=[];
const VID={w:1080,h:1920,gx:90,gy:70,gw:900,gh:1600};
function layout(){
  if(RECORD){ cv.width=VID.w; cv.height=VID.h; cv.style.width=VID.w+'px'; cv.style.height=VID.h+'px'; S=VID.gw/W; GX=VID.gx; GY=VID.gy; }
  else{
    const wr=document.getElementById('wrap'), sc=Math.min((wr.clientWidth||innerWidth)/W,(wr.clientHeight||innerHeight)/H), dpr=Math.min(devicePixelRatio||1,3);
    cv.style.width=Math.floor(W*sc)+'px'; cv.style.height=Math.floor(H*sc)+'px';
    cv.width=Math.round(W*sc*dpr); cv.height=Math.round(H*sc*dpr); S=cv.width/W; GX=0; GY=0;
  }
  buildSprites(); BACK=buildBack(); FRONT=buildFront(); if(RECORD) FRAME=buildFrame();
}
function mk(w,h){ const cnv=document.createElement('canvas'); cnv.width=Math.ceil(w*S); cnv.height=Math.ceil(h*S); const c=cnv.getContext('2d'); c.scale(S,S); return cnv; }

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,PI2); }
function ell(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,PI2); }
function fs(c,fill,lw=3,stroke=OL){ c.fillStyle=fill; c.fill(); if(lw){ c.lineWidth=lw; c.strokeStyle=stroke; c.lineJoin='round'; c.stroke(); } }
function line(c,x1,y1,x2,y2,lw,col){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineWidth=lw; c.strokeStyle=col; c.lineCap='round'; c.stroke(); }
function text(c,s,x,y,size,fill,o={}){
  c.font=`${o.w||800} ${size}px ${FONT}`; c.textAlign=o.align||'center'; c.textBaseline=o.base||'middle';
  if(o.stroke){ c.lineJoin='round'; c.lineWidth=o.sw||4; c.strokeStyle=o.stroke; c.strokeText(s,x,y); }
  c.fillStyle=fill; c.fillText(s,x,y);
}
function fitText(c,s,x,y,size,fill,maxW,o={}){
  c.font=`${o.w||800} ${size}px ${FONT}`; const w=c.measureText(s).width;
  text(c,s,x,y,w>maxW?size*maxW/w:size,fill,o);
}
function star(c,x,y,r,ri=r*0.48){ c.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, q=k%2?ri:r; c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } c.closePath(); }
function heart(c,x,y,s){ c.beginPath(); c.moveTo(x,y+s*0.9); c.bezierCurveTo(x-s*1.6,y-s*0.1,x-s*0.7,y-s*1.3,x,y-s*0.45); c.bezierCurveTo(x+s*0.7,y-s*1.3,x+s*1.6,y-s*0.1,x,y+s*0.9); c.closePath(); }
function check(c,x,y,r){
  circ(c,x,y,r); fs(c,'#3fbf5a',2.5,'#fff');
  c.beginPath(); c.moveTo(x-r*0.45,y+r*0.02); c.lineTo(x-r*0.1,y+r*0.38); c.lineTo(x+r*0.5,y-r*0.36);
  c.lineWidth=r*0.32; c.strokeStyle='#fff'; c.lineCap='round'; c.lineJoin='round'; c.stroke();
}

/* ---------- パン ---------- */
function shadowE(c,x,y,rx){ ell(c,x,y,rx,rx*0.16); c.fillStyle='rgba(90,50,20,0.16)'; c.fill(); }
function lcg(seed){ let s=seed; return ()=>(s=(s*16807)%2147483647)/2147483647; }
function drawItemShape(c,id){
  c.lineJoin='round'; c.lineCap='round';
  if(id==='anpan'){
    shadowE(c,0,36,40);
    const g=c.createRadialGradient(-14,-12,4,0,2,50); g.addColorStop(0,'#efb878'); g.addColorStop(0.6,'#d08840'); g.addColorStop(1,'#a85d22');
    c.beginPath(); c.moveTo(-43,22); c.bezierCurveTo(-47,-34,47,-34,43,22); c.quadraticCurveTo(0,38,-43,22); c.closePath(); fs(c,g,3.5);
    ell(c,-17,-6,13,6,-0.45); c.fillStyle='rgba(255,255,255,0.35)'; c.fill();
    ell(c,2,-7,6.5,4.5); c.fillStyle='#6b3412'; c.fill();
    c.fillStyle='#fff4dc'; for(const [x,y,r] of [[-9,-13,0.5],[11,-15,-0.4],[14,-5,0.2],[-12,-3,-0.3],[3,-17,0.1]]){ ell(c,x,y,2.6,1.3,r); c.fill(); }
  } else if(id==='shoku'){
    shadowE(c,0,44,38);
    const P=()=>{ c.beginPath(); c.moveTo(-32,40); c.lineTo(-32,-6); c.bezierCurveTo(-49,-8,-49,-42,-22,-40); c.bezierCurveTo(-12,-53,12,-53,22,-40); c.bezierCurveTo(49,-42,49,-8,32,-6); c.lineTo(32,40); c.closePath(); };
    P(); fs(c,'#d4893a',3.5);
    c.save(); c.translate(0,3); c.scale(0.8,0.8); P(); c.restore(); c.fillStyle='#fff1cc'; c.fill();
    c.fillStyle='rgba(205,150,80,0.4)'; for(const [x,y] of [[-12,-14],[8,-22],[14,6],[-6,14],[-16,24],[10,26],[0,-2],[18,-10]]){ circ(c,x,y,1.8); c.fill(); }
    c.beginPath(); c.moveTo(-40,-24); c.quadraticCurveTo(-38,-36,-26,-38); c.lineWidth=2.5; c.strokeStyle='rgba(255,230,190,0.7)'; c.stroke();
  } else if(id==='curry'){
    shadowE(c,0,34,44);
    c.save(); c.rotate(-0.18);
    const g=c.createLinearGradient(0,-30,0,30); g.addColorStop(0,'#f2b955'); g.addColorStop(1,'#bb6a20');
    ell(c,0,2,47,29); fs(c,g,3.5);
    c.save(); ell(c,0,2,45,27); c.clip();
    const r=lcg(11);
    for(let k=0;k<90;k++){ const a=r()*PI2, d=Math.sqrt(r()); const x=Math.cos(a)*d*42, y=2+Math.sin(a)*d*25; c.fillStyle=k%3?'rgba(255,220,140,0.85)':'rgba(150,75,20,0.55)'; c.save(); c.translate(x,y); c.rotate(r()*3); c.fillRect(-2.2,-1.2,4.4,2.4); c.restore(); }
    c.restore();
    ell(c,-14,-10,14,5,-0.2); c.fillStyle='rgba(255,255,255,0.3)'; c.fill();
    c.restore();
  } else if(id==='melon'){
    shadowE(c,0,34,42);
    const P=()=>{ c.beginPath(); c.moveTo(-44,20); c.bezierCurveTo(-48,-42,48,-42,44,20); c.quadraticCurveTo(0,35,-44,20); c.closePath(); };
    const g=c.createRadialGradient(-10,-14,4,0,0,52); g.addColorStop(0,'#f6f3a0'); g.addColorStop(0.55,'#e9d46a'); g.addColorStop(1,'#cf9e3e');
    P(); fs(c,g,0);
    c.save(); P(); c.clip(); c.strokeStyle='rgba(160,110,30,0.5)'; c.lineWidth=2.2;
    for(let k=-90;k<=90;k+=15){ line(c,k-45,-45,k+45,45,2.2,'rgba(160,110,30,0.5)'); line(c,k+45,-45,k-45,45,2.2,'rgba(160,110,30,0.5)'); }
    const r=lcg(5); c.fillStyle='rgba(255,255,255,0.9)'; for(let k=0;k<26;k++){ circ(c,-40+r()*80,-28+r()*48,1.2); c.fill(); }
    c.restore();
    P(); c.lineWidth=3.5; c.strokeStyle=OL; c.stroke();
  } else if(id==='croissant'){
    shadowE(c,0,36,46);
    const g=c.createLinearGradient(0,-32,0,34); g.addColorStop(0,'#f6c46e'); g.addColorStop(1,'#bd6c26');
    const segs=[[200,13,9],[340,13,9],[228,19,13],[312,19,13],[270,25,17]];
    for(const [deg,rx,ry] of segs){
      const a=deg*Math.PI/180, x=42*Math.cos(a), y=26+40*Math.sin(a);
      ell(c,x,y,rx,ry,a); fs(c,g,3.2);
      c.beginPath(); c.ellipse(x,y,rx*0.62,ry*0.55,a,Math.PI*1.1,Math.PI*1.7); c.lineWidth=2.2; c.strokeStyle='rgba(255,236,190,0.75)'; c.stroke();
    }
  } else if(id==='cornet'){
    shadowE(c,-4,38,40);
    const tip={x:-40,y:30}, mo={x:20,y:-18}, ang=Math.atan2(mo.y-tip.y,mo.x-tip.x);
    const g=c.createLinearGradient(-30,-30,20,40); g.addColorStop(0,'#eeb260'); g.addColorStop(1,'#b2631f');
    circ(c,tip.x-2,tip.y+2,5); fs(c,g,3);
    for(let k=0;k<6;k++){ const t=(k+0.5)/6, x=tip.x+(mo.x-tip.x)*t, y=tip.y+(mo.y-tip.y)*t, r=6+20*t; ell(c,x,y,7+5*t,r,ang); fs(c,g,3); }
    const ex=mo.x+Math.cos(ang)*8, ey=mo.y+Math.sin(ang)*8;
    ell(c,ex,ey,11,26,ang); fs(c,'#e9a656',3.2);
    ell(c,ex+Math.cos(ang)*2,ey+Math.sin(ang)*2,7,19,ang); fs(c,'#5a2e14',2);
    ell(c,ex+Math.cos(ang)*3-3,ey+Math.sin(ang)*3-6,2.5,6,ang); c.fillStyle='rgba(255,255,255,0.55)'; c.fill();
  } else if(id==='donut'){
    shadowE(c,0,38,40);
    circ(c,0,4,40); fs(c,'#d9964b',3.5);
    c.beginPath(); for(let i=0;i<=72;i++){ const th=i/72*PI2, r=33+2.6*Math.sin(th*9); c.lineTo(Math.cos(th)*r,4+Math.sin(th)*r); } c.closePath(); fs(c,'#ff8fb6',2.2,'#d65f8c');
    c.beginPath(); c.arc(0,4,27,Math.PI*1.1,Math.PI*1.45); c.lineWidth=4; c.strokeStyle='rgba(255,255,255,0.6)'; c.stroke();
    const cols=['#ffffff','#5ec8f2','#ffd84d','#7ccf5a','#ff5a4e'], r=lcg(3);
    for(let k=0;k<18;k++){ const a=k/18*PI2+r()*0.2, d=19+r()*10; c.save(); c.translate(Math.cos(a)*d,4+Math.sin(a)*d); c.rotate(r()*3); c.fillStyle=cols[k%5]; rr(c,-3.5,-1.3,7,2.6,1.3); c.fill(); c.restore(); }
    c.save(); c.globalCompositeOperation='destination-out'; circ(c,0,4,12); c.fill(); c.restore();
    circ(c,0,4,12); c.lineWidth=3.2; c.strokeStyle=OL; c.stroke();
  } else if(id==='milk'){
    shadowE(c,0,47,26);
    const P=()=>{ c.beginPath(); c.moveTo(-12,-40); c.lineTo(12,-40); c.lineTo(12,-28); c.quadraticCurveTo(26,-20,26,-2); c.lineTo(26,38); c.quadraticCurveTo(26,46,18,46); c.lineTo(-18,46); c.quadraticCurveTo(-26,46,-26,38); c.lineTo(-26,-2); c.quadraticCurveTo(-26,-20,-12,-28); c.closePath(); };
    P(); fs(c,'#ffffff',0);
    c.save(); P(); c.clip();
    c.fillStyle='#eef6ff'; c.fillRect(8,-40,20,90);
    c.fillStyle='#4aa3df'; c.fillRect(-30,4,60,24);
    text(c,'MILK',0,16.5,13,'#ffffff');
    c.fillStyle='rgba(255,255,255,0.75)'; rr(c,-21,-14,6,16,3); c.fill();
    c.restore();
    P(); c.lineWidth=3.5; c.strokeStyle=OL; c.stroke();
    rr(c,-15,-49,30,12,5); fs(c,'#4aa3df',3);
    rr(c,-10,-46,9,3,1.5); c.fillStyle='rgba(255,255,255,0.6)'; c.fill();
  }
}
const SPR_BOX=110;
function buildSprites(){
  SPR=ITEMS.map(it=>{ const cnv=mk(SPR_BOX,SPR_BOX), c=cnv.getContext('2d'); c.translate(SPR_BOX/2,SPR_BOX/2); drawItemShape(c,it.id); return cnv; });
  SIL=SPR.map(s=>{ const cnv=document.createElement('canvas'); cnv.width=s.width; cnv.height=s.height; const c=cnv.getContext('2d'); c.drawImage(s,0,0); c.globalCompositeOperation='source-in'; c.fillStyle='#3d3150'; c.fillRect(0,0,cnv.width,cnv.height); return cnv; });
}
function drawSpr(c,i,x,y,size,sil=false,alpha=1){
  const img=(sil?SIL:SPR)[i]; if(!img) return;
  if(alpha<1){ c.save(); c.globalAlpha*=alpha; }
  c.drawImage(img,x-size/2,y-size/2,size,size);
  if(alpha<1) c.restore();
}

/* ---------- 顔パーツ ---------- */
const CL='#2a2422';
function fk(c,fill,lw=2.6){ fs(c,fill,lw,CL); }
function blob(c,circles,fill,lw=2.2){
  c.lineWidth=lw*2; c.strokeStyle=CL; for(const [x,y,r] of circles){ circ(c,x,y,r); c.stroke(); }
  c.fillStyle=fill; for(const [x,y,r] of circles){ circ(c,x,y,r); c.fill(); }
}
function eyes(c,ex,ey,m,blink,o={}){
  const s=o.s||1, col=o.col||INK;
  for(const sx of [-1,1]){
    const x=sx*ex, y=ey;
    if(m==='happy'){ c.beginPath(); c.moveTo(x-6*s,y+2*s); c.quadraticCurveTo(x,y-7*s,x+6*s,y+2*s); c.lineWidth=3.5*s; c.strokeStyle=col; c.lineCap='round'; c.stroke(); }
    else if(blink){ line(c,x-5*s,y,x+5*s,y,3*s,col); }
    else{ ell(c,x,y,4.6*s,6.2*s); c.fillStyle=col; c.fill(); circ(c,x+1.6*s,y-2.3*s,1.8*s); c.fillStyle='#fff'; c.fill(); }
    if(m==='sad') line(c,x-sx*6*s,y-14*s,x+sx*7*s,y-10*s,2.8*s,col);
  }
}
// アンパンマン風の点の目
function dotEyes(c,ex,ey,rx,ry,m,blink){
  for(const sx of [-1,1]){
    const x=sx*ex;
    if(m==='happy'){ c.beginPath(); c.moveTo(x-rx*1.7,ey+ry*0.35); c.quadraticCurveTo(x,ey-ry*1.25,x+rx*1.7,ey+ry*0.35); c.lineWidth=2.6; c.strokeStyle=CL; c.lineCap='round'; c.stroke(); }
    else if(blink) line(c,x-rx*1.4,ey,x+rx*1.4,ey,2.4,CL);
    else { ell(c,x,ey,rx,ry); c.fillStyle=CL; c.fill(); }
  }
}
// まゆげ：always のキャラはふだんも弓なり、それ以外は困り顔・おこり顔のときだけ
function brows(c,bx,by,w,m,o={}){
  c.lineWidth=o.lw||2.2; c.strokeStyle=o.col||CL; c.lineCap='round';
  for(const sx of [-1,1]){
    const x=sx*bx, ix=x-sx*w/2, ox=x+sx*w/2;
    c.beginPath();
    if(m==='angry'){ c.moveTo(ox,by-4); c.lineTo(ix,by+3); }
    else if(m==='wait'){ c.moveTo(ox,by+2); c.quadraticCurveTo(x,by-1,ix,by-4); }
    else if(o.always){ c.moveTo(ox,by+1); c.quadraticCurveTo(x,by-(o.arch||4),ix,by+1); }
    else continue;
    c.stroke();
  }
}
function mouth(c,mx,my,m,s=1,col=INK){
  c.lineWidth=3*s; c.strokeStyle=col; c.lineCap='round'; c.lineJoin='round';
  if(m==='happy'){ c.beginPath(); c.moveTo(mx-9*s,my-2*s); c.quadraticCurveTo(mx,my+15*s,mx+9*s,my-2*s); c.closePath(); c.fillStyle='#c0392b'; c.fill(); c.stroke(); ell(c,mx,my+5*s,4*s,2.4*s); c.fillStyle='#ff8a8a'; c.fill(); }
  else if(m==='normal'){ c.beginPath(); c.moveTo(mx-6*s,my); c.quadraticCurveTo(mx,my+7*s,mx+6*s,my); c.stroke(); }
  else if(m==='wait'){ line(c,mx-5*s,my+2*s,mx+5*s,my+2*s,3*s,col); }
  else { c.beginPath(); c.moveTo(mx-7*s,my+5*s); c.quadraticCurveTo(mx,my-3*s,mx+7*s,my+5*s); c.stroke(); }
}
function bunnyMouth(c,mx,my,m){
  if(m!=='normal'){ mouth(c,mx,my+5,m,0.85,CL); return; }
  c.beginPath(); c.moveTo(mx-7,my); c.quadraticCurveTo(mx-3.5,my+6,mx,my); c.quadraticCurveTo(mx+3.5,my+6,mx+7,my); c.lineWidth=2.4; c.strokeStyle=CL; c.lineCap='round'; c.stroke();
}
function cheeks(c,x,y,r,m){ for(const sx of [-1,1]){ ell(c,sx*x,y,r,r*0.7); c.fillStyle=m==='angry'?'rgba(255,60,60,0.55)':'rgba(255,128,150,0.38)'; c.fill(); } }
function ribbon(c,x,y,col,s=1){
  c.save(); c.translate(x,y); c.scale(s,s);
  for(const sx of [-1,1]){ c.beginPath(); c.moveTo(0,0); c.lineTo(sx*16,-10); c.quadraticCurveTo(sx*21,0,sx*16,10); c.closePath(); fk(c,col,2.2); }
  circ(c,0,0,5); fk(c,col,2.2); c.restore();
}
function bow(c,x,y,col,s=1){
  c.save(); c.translate(x,y); c.scale(s,s); c.rotate(-0.3);
  for(const sx of [-1,1]){ c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(sx*5,-13,sx*20,-13,sx*18,0); c.bezierCurveTo(sx*20,11,sx*5,11,0,0); c.closePath(); fk(c,col,2); }
  ell(c,0,0,4,5.5); fk(c,col,2); c.restore();
}
function roundCollar(c,col='#ffffff'){ for(const sx of [-1,1]){ c.beginPath(); c.moveTo(0,44); c.quadraticCurveTo(sx*6,60,sx*22,55); c.quadraticCurveTo(sx*27,46,sx*14,41); c.closePath(); fk(c,col,2.2); } }
function angerMark(c,x,y,t){
  const s=1+Math.sin(t*12)*0.12; c.save(); c.translate(x,y); c.scale(s,s); c.strokeStyle='#e8322a'; c.lineWidth=3.5; c.lineCap='round';
  for(let k=0;k<4;k++){ c.save(); c.rotate(k*Math.PI/2); c.beginPath(); c.moveTo(3,10); c.quadraticCurveTo(3,3,10,3); c.stroke(); c.restore(); }
  c.restore();
}
function sweat(c,x,y,t){ const d=(t*14)%8; c.save(); c.translate(x,y+d); c.beginPath(); c.moveTo(0,-9); c.quadraticCurveTo(7,2,0,6); c.quadraticCurveTo(-7,2,0,-9); fs(c,'#9bd9ff',2,'#3d7fb8'); c.restore(); }

/* ---------- 町のみんな ---------- */
function shirtPath(c){ c.beginPath(); c.moveTo(-48,140); c.lineTo(-48,84); c.quadraticCurveTo(-46,46,-14,42); c.lineTo(14,42); c.quadraticCurveTo(46,46,48,84); c.lineTo(48,140); c.closePath(); }
// 白目つきの目（黒目・色つきの瞳・まつげ）
function eye2(c,x,y,rx,ry,m,b,o={}){
  if(m==='happy'){ c.beginPath(); c.moveTo(x-rx*0.9,y+ry*0.25); c.quadraticCurveTo(x,y-ry*0.9,x+rx*0.9,y+ry*0.25); c.lineWidth=2.6; c.strokeStyle=o.arc||CL; c.lineCap='round'; c.stroke(); return; }
  if(b){ line(c,x-rx*0.85,y,x+rx*0.85,y,2.4,o.arc||CL); return; }
  ell(c,x,y,rx,ry); c.fillStyle=o.fill||'#fff'; c.fill();
  const px=x+(o.dx||0), py=y+(o.dy||0), pr=o.pr||rx*0.42;
  c.save(); ell(c,x,y,rx,ry); c.clip();
  if(o.iris){ ell(c,px,py,o.ir||rx*0.62,o.iry||ry*0.7); c.fillStyle=o.iris; c.fill(); }
  ell(c,px,py,pr,o.pry||pr*1.15); c.fillStyle=CL; c.fill();
  if(o.hl){ circ(c,px+pr*0.5,py-pr*0.6,Math.max(1.1,pr*0.45)); c.fillStyle='#fff'; c.fill(); }

function moodOf(cu){

function pickN(pool,n){ const a=pool.slice(), out=[]; for(let k=0;k<n;k++) out.push(a.splice(Math.floor(rng()*a.length),1)[0]); return out; }
function makeOrder(){
  const r=rng(); let list, mode='pic';
  if(!G.lunch) list=(G.t<8||r<0.7)?pickN(ALL,1):pickN(ALL,2);
  else if(r<0.2) list=pickN(ALL,2);
  else if(r<0.34){ const d=pickN(ALL,3); list=rng()<0.5?[d[0],d[0],d[1]]:d; }
  else if(r<0.48){ const a=pickN(ALL,1)[0]; list=[a,a]; }

  else { mode='text'; list=pickN(ALL,rng()<0.5?1:2); }
  const groups=[];

function spawn(i){

  const type=cands[Math.floor(rng()*cands.length)];
  G.lastTypes.push(type); if(G.lastTypes.length>2) G.lastTypes.shift();

function pressItem(i){
  if(G.state!=='play') return;

  for(const c of G.slots){ if(!c||c.state!=='wait') continue; const k=c.groups.findIndex(g=>g.item===i&&g.got<g.need); if(k>=0&&(!best||c.arr<best.arr)){ best=c; gi=k; } }

    return;
  }
  const g=best.groups[gi]; g.got++;

function complete(cu){
  cu.state='happy'; cu.st=0;

  G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);

  G.sales+=price+bonus; G.served++;
  G.gauge=Math.min(100,G.gauge+TUNE.gain+(cu.wait<1.5?TUNE.quick:0)+cu.groups.length);
  sfx('done'); if(G.combo%5===0) sfx('combo');

function endGame(kind){

function updCustomers(dt,active){
  const mult=(G.lunch?TUNE.lunchMult:1)*TUNE.mult, D=TUNE.drain;
  for(let i=0;i<3;i++){
    const c=G.slots[i]; if(!c) continue; c.st+=dt;
    if(c.state==='enter'){ if(c.st>=0.34){ c.state='wait'; c.st=0; } }
    else if(c.state==='wait'){ if(active){ c.wait+=dt; const r=c.wait<TUNE.t1?D[0]:c.wait<TUNE.t2?D[1]:D[2]; G.gauge-=r*mult*dt; if(c.wait>=TUNE.t2&&!c.angryN){ c.angryN=true; sfx('angry'); } } }
    else if(c.state==='happy'){ if(c.st>=0.62){ c.state='leave'; c.st=0; } }
    else if(c.state==='leave'){ if(c.st>=0.3){ G.slots[i]=null; const R=G.lunch?TUNE.refillL:TUNE.refill; G.slotT[i]=R[0]+rng()*R[1]; } }
  }

function updPlay(dt){
  G.t+=dt; const rem=GAME_TIME-G.t;

  const sec=Math.ceil(rem); if(sec<=5&&sec>=1&&sec!==G.lastSec){ G.lastSec=sec; sfx('tick'); }
  for(let i=0;i<3;i++) if(!G.slots[i]&&rem>0.8){ G.slotT[i]-=dt; if(G.slotT[i]<=0) spawn(i); }
  updCustomers(dt,true);
  if(G.gauge<=0){ G.gauge=0; endGame('over'); return; }
  if(G.gauge<30&&!G.lowWarned){ G.lowWarned=true; say('いそがなくっちゃ！',1.4); sfx('low'); }

}
function updFx(dt){

  G.parts=G.parts.filter(p=>p.t<p.life);

  for(const r of G.ripples) r.t+=dt; G.ripples=G.ripples.filter(r=>r.t<0.5);

  for(let i=0;i<8;i++){ G.btnA[i]=Math.max(0,G.btnA[i]-dt*6); G.btnMiss[i]=Math.max(0,G.btnMiss[i]-dt*3); }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt);
  if(G.state==='count'){
    const n=Math.floor(G.st/0.62);
    if(n!==G.cdLast){ G.cdLast=n; if(n<3) sfx('beep'); else if(n===3) sfx('go'); }
    if(G.st>=0.62*3+0.5){ G.state='play'; G.st=0; music('start','normal'); say('いらっしゃいませ！',1.5); jamPose('wave',1.2); }
  } else if(G.state==='play') updPlay(dt);

/* ================= Input ================= */
function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function tapAt(x,y){
  if(G.state==='title'){
    if(!RECORD&&Math.hypot(x-MUTE.x,y-MUTE.y)<MUTE.r+8){ setMute(!AU.muted); return; }
    startCountdown();
  } else if(G.state==='play'){
    for(let i=0;i<8;i++) if(inRect(x,y,BTNS[i])){ pressItem(i); return; }
  } else if(G.state==='result'&&G.st>0.6){
    if(!RECORD&&Math.hypot(x-MUTE.x,y-MUTE.y)<MUTE.r+8){ setMute(!AU.muted); return; }
    if(inRect(x,y,RETRY)) startCountdown();
  }
}
if(!RECORD){
  for(const ev of ['pointerup','touchend','click']) addEventListener(ev,auUnlock,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(!AU.ac) return;
    try{ if(document.hidden){ AU.ac.suspend().catch(()=>{}); if(SILENT) SILENT.pause(); } else { AU.ac.resume().catch(()=>{}); if(SILENT) SILENT.play().catch(()=>{}); } }catch(e){}
  });
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); auUnlock(); const r=cv.getBoundingClientRect(); tapAt((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); });
  const KEYS='12345678', KEYS2='qwerasdf';
  addEventListener('keydown',e=>{
    auUnlock(); const k=e.key.toLowerCase();
    if(k==='m'){ setMute(!AU.muted); return; }
    if(G.state==='play'){ let i=KEYS.indexOf(k); if(i<0) i=KEYS2.indexOf(k); if(i>=0) pressItem(i); }
    else if((k===' '||k==='enter')&&(G.state==='title'||(G.state==='result'&&G.st>0.6))){ e.preventDefault(); startCountdown(); }
  });
}

  const P=BOT.p, k=Math.min(1,dt*13);
  BOT.x+=(BOT.tx-BOT.x)*k; BOT.y+=(BOT.ty-BOT.y)*k;
  const show=G.state==='title'||G.state==='play'||G.state==='count';
  BOT.alpha=clamp(BOT.alpha+(show?dt*4:-dt*3),0,1);
  if(G.state==='title'){
    BOT.tx=270; BOT.ty=846;
    if(!BOT.started&&G.st>1.2){ BOT.started=true; BOT.x=BOT.tx; BOT.y=BOT.ty; G.ripples.push({x:BOT.x,y:BOT.y,t:0}); tapAt(270,846); }
    return;
  }
  if(G.state==='result'&&DEMO&&G.st>4){ BOT.tx=RETRY.x+RETRY.w/2; BOT.ty=RETRY.y+RETRY.h/2; if(G.st>4.6){ G.ripples.push({x:BOT.tx,y:BOT.ty,t:0}); tapAt(BOT.tx,BOT.ty); } return; }
  if(G.state!=='play'){ if(G.state==='count'){ BOT.tx=270; BOT.ty=880; } return; }
  const now=G.t;
  if(BOT.target&&(BOT.target.state!=='wait'||!G.slots.includes(BOT.target))){ BOT.target=null; BOT.plan=[]; }
  if(!BOT.plan.length){
    let best=null; for(const c of G.slots) if(c&&c.state==='wait'&&c.groups.some(g=>g.got<g.need)&&(!best||c.arr<best.arr)) best=c;
    if(!best) return;
    BOT.target=best; const plan=[];
    for(const g of best.groups) for(let j=g.got;j<g.need;j++) plan.push(g.item);
    if(brng()<P.mistake){ let w; do{ w=Math.floor(brng()*8); }while(plan.includes(w)); plan.unshift(w); }
    BOT.plan=plan;
    const think=P.think+P.perG*best.groups.length+(best.mode==='sil'?P.sil:best.mode==='text'?P.text:0)+brng()*0.12;
    BOT.next=now+Math.max(0.14,think-best.st);
    botAim(plan[0]);
  } else if(now>=BOT.next){
    const item=BOT.plan.shift();
    G.ripples.push({x:BOT.x,y:BOT.y,t:0}); pressItem(item);
    if(BOT.plan.length){ botAim(BOT.plan[0]); BOT.next=now+P.gap+brng()*P.gapJ; }
  }
}

/* ================= Main ================= */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,last?(ts-last)/1000:0); last=ts;
  if(DEMO) botUpdate(dt);
  update(dt); render(); requestAnimationFrame(frame);
}
window.REC={ready:false,done:false,hold:4.2,
  step(dt){ REC_T+=dt; botUpdate(dt); update(dt); render(); if(G.state==='result'&&G.st>=this.hold) this.done=true; },
  frame(q){ return cv.toDataURL('image/jpeg',q||0.92); },
  time(){ return REC_T; },
  audio(total){ return renderAudio(total||REC_T+0.3); },
  info(){ return {state:G.state,t:G.t,gauge:G.gauge,sales:G.sales,served:G.served,maxCombo:G.maxCombo,miss:G.miss,kind:G.endKind,stars:G.result&&G.result.stars}; },
  sim(params,seed,dt=1/60){
    AU.silent=true; Object.assign(BOT.p,params||{}); brng=mulberry32(seed*13+5); BOT.plan=[]; BOT.target=null;
    resetGame(seed); G.state='play'; G.st=0; let minG=100;
    while(G.state==='play'){ botUpdate(dt); update(dt); minG=Math.min(minG,G.gauge); }
    AU.silent=false;
    return {kind:G.endKind,t:+G.t.toFixed(1),sales:G.sales,served:G.served,minG:+minG.toFixed(1),gauge:+G.gauge.toFixed(1),maxCombo:G.maxCombo,miss:G.miss,stars:G.result.stars};
  },
  setup(seed,botp){ if(botp) Object.assign(BOT.p,botp); resetGame(seed); say('',0); G.jam.pose='idle'; SEED=seed; rng=mulberry32(seed); brng=mulberry32(seed*13+5); vr=mulberry32(seed*7+3); G.state='title'; G.st=0; G.time=0; G.plays=0; BOT.started=false; BOT.plan=[]; BOT.target=null; AU.log=[]; REC_T=0; this.done=false; AU.log.push({t:0.05,k:'s',n:'jingle'}); },
};
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load(`800 30px "M PLUS Rounded 1c"`),document.fonts.load(`500 20px "M PLUS Rounded 1c"`)]),new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  layout();
  if(RECORD){ document.body.classList.add('rec'); render(); window.REC.ready=true; }
  else{ addEventListener('resize',layout); requestAnimationFrame(frame); }
}
boot();
</script>
