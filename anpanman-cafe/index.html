function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=mulberry32(SEED), vr=mulberry32(SEED*7+3), brng=mulberry32(SEED*13+5);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const easeOut=p=>1-Math.pow(1-p,3);
const easeIn=p=>p*p*p;
const pickV=a=>a[Math.floor(vr()*a.length)];

/* ================= Audio ================= */
const AU={ac:null,master:null,sfxG:null,musG:null,muted:false,log:[],silent:false};
let REC_T=0;
const MUS={on:false,mode:'normal',step:0,next:0,timer:0};
function buildGraph(o,ac,dest){
  const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(dest);
  o.master=ac.createGain(); o.master.gain.value=0.9; o.master.connect(comp);
  o.sfxG=ac.createGain(); o.sfxG.gain.value=0.9; o.sfxG.connect(o.master);
  o.musG=ac.createGain(); o.musG.gain.value=0.55; o.musG.connect(o.master);
}
function auInit(){
  if(RECORD) return;
  if(AU.ac){ if(AU.ac.state==='suspended') AU.ac.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AU.ac=new AC(); buildGraph(AU,AU.ac,AU.ac.destination); AU.master.gain.value=AU.muted?0:0.9; }catch(e){ AU.ac=null; }
}
function setMute(m){ AU.muted=m; if(AU.master) AU.master.gain.value=m?0:0.9; }
function sfx(n){
  if(AU.silent) return;
  if(RECORD){ AU.log.push({t:REC_T,k:'s',n}); return; }
  if(!AU.ac) return;
  try{ SFX[n](AU.ac,AU.sfxG,AU.ac.currentTime+0.01); }catch(e){}
}
function music(a,m){
  if(AU.silent) return;
  if(RECORD){ AU.log.push({t:REC_T,k:'m',a,m}); return; }
  if(!AU.ac) return;
  if(a==='start'){ MUS.mode=m; MUS.step=0; MUS.next=AU.ac.currentTime+0.05; clearInterval(MUS.timer); MUS.timer=setInterval(musPump,25); MUS.on=true; }
  else if(a==='mode'){ MUS.mode=m; }
  else { MUS.on=false; clearInterval(MUS.timer); }
}
function musPump(){
  const ac=AU.ac; if(!ac||!MUS.on) return;
  if(MUS.next<ac.currentTime-0.2) MUS.next=ac.currentTime+0.05;
  while(MUS.next<ac.currentTime+0.15){ schedStep(ac,AU.musG,MUS.step,MUS.next,MUS.mode); MUS.next+=stepDur(MUS.mode); MUS.step++; }
}
const NOISE=new WeakMap();
function noiseBuf(ac){
  let b=NOISE.get(ac);
  if(!b){ b=ac.createBuffer(1,(ac.sampleRate*0.5)|0,ac.sampleRate); const d=b.getChannelData(0); let s=12345; for(let i=0;i<d.length;i++){ s=(s*1103515245+12345)&0x7fffffff; d[i]=s/0x3fffffff-1; } NOISE.set(ac,b); }
  return b;
}
function tone(ac,out,t,o){
  const f=o.f||440, type=o.type||'square', dur=o.dur||0.1, vol=o.vol||0.1, a=o.a||0.004;
  const os=ac.createOscillator(), g=ac.createGain();
  os.type=type; os.frequency.setValueAtTime(f,t); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+a);
  if(o.sus) g.gain.exponentialRampToValueAtTime(vol*0.5,t+dur*0.8);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=os; if(o.lp){ const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; os.connect(fl); n=fl; }
  n.connect(g); g.connect(out); os.start(t); os.stop(t+dur+0.03);
}
function nz(ac,out,t,o){
  const s=ac.createBufferSource(); s.buffer=noiseBuf(ac);
  const g=ac.createGain(), dur=o.dur||0.04; g.gain.setValueAtTime(o.vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=s; const add=(type,f)=>{ const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; n.connect(fl); n=fl; };
  if(o.hp) add('highpass',o.hp); if(o.bp) add('bandpass',o.bp); if(o.lp) add('lowpass',o.lp);
  n.connect(g); g.connect(out); s.start(t,(t*7.31)%0.4); s.stop(t+dur+0.02);
}
function bell(ac,out,t,f,dur,vol){
  tone(ac,out,t,{type:'sine',f,dur,vol}); tone(ac,out,t,{type:'sine',f:f*2.76,dur:dur*0.5,vol:vol*0.35}); tone(ac,out,t,{type:'sine',f:f*5.4,dur:dur*0.25,vol:vol*0.15});
}
const SFX={
  pop(ac,o,t){ tone(ac,o,t,{type:'sine',f:420,f2:900,dur:0.1,vol:0.16}); },
  serve(ac,o,t){ tone(ac,o,t,{type:'square',f:880,dur:0.06,vol:0.06,lp:5000}); tone(ac,o,t+0.05,{type:'square',f:1175,dur:0.09,vol:0.06,lp:5000}); },
  done(ac,o,t){ tone(ac,o,t,{type:'square',f:988,dur:0.08,vol:0.08,lp:6000}); tone(ac,o,t+0.075,{type:'square',f:1319,dur:0.34,vol:0.08,lp:6000}); bell(ac,o,t+0.075,2637,0.4,0.05); },
  miss(ac,o,t){ tone(ac,o,t,{type:'sawtooth',f:260,f2:110,dur:0.3,vol:0.12,lp:1200}); tone(ac,o,t+0.02,{type:'square',f:190,f2:90,dur:0.3,vol:0.05,lp:900}); },
  beep(ac,o,t){ tone(ac,o,t,{type:'square',f:660,dur:0.16,vol:0.09,lp:4000}); },
  go(ac,o,t){ tone(ac,o,t,{type:'square',f:1320,dur:0.45,vol:0.08,lp:5000}); tone(ac,o,t,{type:'square',f:660,dur:0.45,vol:0.05,lp:3000}); },
  start(ac,o,t){ tone(ac,o,t,{type:'square',f:784,dur:0.08,vol:0.08,lp:4000}); tone(ac,o,t+0.08,{type:'square',f:1568,dur:0.2,vol:0.08,lp:5000}); },
  lunch(ac,o,t){
    for(let k=0;k<6;k++) bell(ac,o,t+k*0.11,k%2?1568:2093,0.45,0.09);
    [523,659,784,1047].forEach((f,k)=>tone(ac,o,t+0.72+k*0.09,{type:'square',f,dur:0.12,vol:0.07,lp:5000}));
    tone(ac,o,t+1.08,{type:'square',f:1319,dur:0.45,vol:0.07,lp:5000}); tone(ac,o,t+1.08,{type:'square',f:1047,dur:0.45,vol:0.05,lp:5000});
  },
  tick(ac,o,t){ tone(ac,o,t,{type:'triangle',f:1500,dur:0.06,vol:0.14}); },
  angry(ac,o,t){ tone(ac,o,t,{type:'square',f:240,f2:200,dur:0.07,vol:0.05,lp:1500}); tone(ac,o,t+0.09,{type:'square',f:240,f2:200,dur:0.07,vol:0.05,lp:1500}); },
  combo(ac,o,t){ [1319,1568,2093,2637].forEach((f,k)=>tone(ac,o,t+0.18+k*0.045,{type:'triangle',f,dur:0.12,vol:0.07})); },
  low(ac,o,t){ tone(ac,o,t,{type:'square',f:880,dur:0.09,vol:0.06,lp:4000}); tone(ac,o,t+0.14,{type:'square',f:880,dur:0.09,vol:0.06,lp:4000}); },
  star(ac,o,t){ bell(ac,o,t,1760,0.5,0.1); tone(ac,o,t,{type:'triangle',f:2637,dur:0.2,vol:0.05}); },
  jingle(ac,o,t){
    [[72,0],[76,0.12],[79,0.24],[84,0.36],[81,0.6],[84,0.72]].forEach(([m,d])=>{ tone(ac,o,t+d,{type:'square',f:mf(m),dur:0.16,vol:0.07,lp:4500}); tone(ac,o,t+d,{type:'triangle',f:mf(m-12),dur:0.16,vol:0.06}); });
    for(const m of [72,76,79,84]) tone(ac,o,t+0.84,{type:'square',f:mf(m),dur:0.5,vol:0.035,lp:4500,sus:1});
    bell(ac,o,t+0.84,2093,0.6,0.06);
  },
  clear(ac,o,t){
    const seq=[523,659,784,1047,784,1047];
    seq.forEach((f,k)=>tone(ac,o,t+k*0.11,{type:'square',f,dur:0.11,vol:0.08,lp:5000}));
    for(const f of [1047,1319,1568]) tone(ac,o,t+0.7,{type:'square',f,dur:0.9,vol:0.05,lp:5000,sus:1});
    tone(ac,o,t+0.7,{type:'triangle',f:262,dur:0.9,vol:0.15,sus:1});
  },
  over(ac,o,t){
    [392,370,349,330].forEach((f,k)=>tone(ac,o,t+k*0.3,{type:'square',f,dur:k===3?0.9:0.28,vol:0.07,lp:2500,sus:1}));
    tone(ac,o,t+0.9,{type:'triangle',f:131,dur:0.9,vol:0.15,sus:1});
  },
};
// BGM（オリジナル曲）
const BPM={normal:120,lunch:156}, STEP_N=128;
const stepDur=m=>60/BPM[m]/4;
const MEL=[76,0,79,76,72,0,74,76, 69,0,72,76,74,0,72,0, 77,0,81,77,72,0,74,77, 79,0,77,76,74,0,0,0,
           76,0,79,76,84,0,83,81, 81,0,79,76,72,0,74,76, 77,76,74,77,79,0,71,74, 72,0,76,79,84,0,0,0];
const CHD={C:[60,64,67],Am:[57,60,64],F:[57,60,65],G:[55,59,62],Dm:[57,62,65]};
const ROOT={C:48,Am:45,F:41,G:43,Dm:50};
const PROG=[['C','C'],['Am','Am'],['F','F'],['G','G'],['C','C'],['Am','Am'],['Dm','G'],['C','C']];
const mf=m=>440*Math.pow(2,(m-69)/12);
function schedStep(ac,out,step,t,mode){
  const L=mode==='lunch', tr=L?2:0, beat=60/BPM[mode];
  const s=step%STEP_N, bar=s>>4, pos=s&15;
  if(pos&1){ if(L) nz(ac,out,t,{dur:0.03,vol:0.03,hp:7000}); return; }
  const off=(pos&3)===2, tt=t+((!L&&off)?beat/6:0), ch=PROG[bar][pos>>3];
  const mi=bar*8+(pos>>1), n=MEL[mi];
  if(n){
    let k=1; while(k<4&&!MEL[(mi+k)%64]) k++;
    const d=k*beat/2*0.92;
    tone(ac,out,tt,{type:'square',f:mf(n+tr),dur:d,vol:L?0.05:0.045,a:0.006,lp:L?4200:3200,sus:1});
    tone(ac,out,tt,{type:'triangle',f:mf(n+tr-12),dur:d,vol:0.05,sus:1});
  }
  if(!off){
    const q=pos>>2, r=ROOT[ch]+tr+((q&1)?7:0);
    tone(ac,out,tt,{type:'triangle',f:mf(r),dur:beat*0.5,vol:0.24,a:0.005});
    if(L||!(q&1)) tone(ac,out,tt,{type:'sine',f:150,f2:45,dur:0.13,vol:L?0.36:0.26});
    if(L&&(q&1)) nz(ac,out,tt,{dur:0.12,vol:0.1,bp:1800});
  } else {
    for(const m of CHD[ch]) tone(ac,out,tt,{type:'triangle',f:mf(m+tr),dur:0.13,vol:0.035});
    nz(ac,out,tt,{dur:0.03,vol:L?0.045:0.03,hp:7000});
  }
}
// 録画用：イベントログから同じ音をオフラインで書き出す
async function renderAudio(total){
  const sr=44100, ac=new OfflineAudioContext(2,Math.ceil(total*sr),sr), o={};
  buildGraph(o,ac,ac.destination);
  const evs=AU.log.slice().sort((a,b)=>a.t-b.t), mEvs=evs.filter(e=>e.k==='m');
  let mode='normal', step=0, tn=0, playing=false;
  for(let i=0;i<mEvs.length;i++){
    const e=mEvs[i], end=i+1<mEvs.length?mEvs[i+1].t:total;
    if(e.a==='start'){ step=0; tn=e.t+0.05; playing=true; mode=e.m; }
    else if(e.a==='mode') mode=e.m; else playing=false;
    if(playing) while(tn<end){ schedStep(ac,o.musG,step,tn,mode); tn+=stepDur(mode); step++; }
  }
  for(const e of evs) if(e.k==='s') SFX[e.n](ac,o.sfxG,e.t+0.01);
  return wavB64(await ac.startRendering());
}
function wavB64(buf){
  const n=buf.length, L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L;
  const ab=new ArrayBuffer(44+n*4), v=new DataView(ab);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+n*4,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24,44100,true); v.setUint32(28,44100*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*4,true);
  let p=44; for(let i=0;i<n;i++){ v.setInt16(p,clamp(L[i],-1,1)*32767,true); v.setInt16(p+2,clamp(R[i],-1,1)*32767,true); p+=4; }
  const u8=new Uint8Array(ab); let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let S=1,GX=0,GY=0, BACK=null, FRONT=null, FRAME=null, SPR=[], SIL=[];
const VID={w:1080,h:1920,gx:90,gy:70,gw:900,gh:1600};
function layout(){
  if(RECORD){ cv.width=VID.w; cv.height=VID.h; cv.style.width=VID.w+'px'; cv.style.height=VID.h+'px'; S=VID.gw/W; GX=VID.gx; GY=VID.gy; }
  else{
    const sc=Math.min(innerWidth/W,innerHeight/H), dpr=Math.min(devicePixelRatio||1,3);
    cv.style.width=Math.floor(W*sc)+'px'; cv.style.height=Math.floor(H*sc)+'px';
    cv.width=Math.round(W*sc*dpr); cv.height=Math.round(H*sc*dpr); S=cv.width/W; GX=0; GY=0;
  }
  buildSprites(); BACK=buildBack(); FRONT=buildFront(); if(RECORD) FRAME=buildFrame();
}
function mk(w,h){ const cnv=document.createElement('canvas'); cnv.width=Math.ceil(w*S); cnv.height=Math.ceil(h*S); const c=cnv.getContext('2d'); c.scale(S,S); return cnv; }

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,PI2); }
function ell(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,PI2); }
function fs(c,fill,lw=3,stroke=OL){ c.fillStyle=fill; c.fill(); if(lw){ c.lineWidth=lw; c.strokeStyle=stroke; c.lineJoin='round'; c.stroke(); } }
function line(c,x1,y1,x2,y2,lw,col){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineWidth=lw; c.strokeStyle=col; c.lineCap='round'; c.stroke(); }
function text(c,s,x,y,size,fill,o={}){
  c.font=`${o.w||800} ${size}px ${FONT}`; c.textAlign=o.align||'center'; c.textBaseline=o.base||'middle';
  if(o.stroke){ c.lineJoin='round'; c.lineWidth=o.sw||4; c.strokeStyle=o.stroke; c.strokeText(s,x,y); }
  c.fillStyle=fill; c.fillText(s,x,y);
}
function fitText(c,s,x,y,size,fill,maxW,o={}){
  c.font=`${o.w||800} ${size}px ${FONT}`; const w=c.measureText(s).width;
  text(c,s,x,y,w>maxW?size*maxW/w:size,fill,o);
}
function star(c,x,y,r,ri=r*0.48){ c.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, q=k%2?ri:r; c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } c.closePath(); }
function heart(c,x,y,s){ c.beginPath(); c.moveTo(x,y+s*0.9); c.bezierCurveTo(x-s*1.6,y-s*0.1,x-s*0.7,y-s*1.3,x,y-s*0.45); c.bezierCurveTo(x+s*0.7,y-s*1.3,x+s*1.6,y-s*0.1,x,y+s*0.9); c.closePath(); }
function check(c,x,y,r){

  const r=rng(); let list, mode='pic';
  if(!G.lunch) list=(G.t<8||r<0.7)?pickN(ALL,1):pickN(ALL,2);
  else if(r<0.2) list=pickN(ALL,2);

  if(G.state!=='play') return;

  for(const c of G.slots){ if(!c||c.state!=='wait') continue; const k=c.groups.findIndex(g=>g.item===i&&g.got<g.need); if(k>=0&&(!best||c.arr<best.arr)){ best=c; gi=k; } }

    G.gauge=Math.max(0,G.gauge-TUNE.miss); G.combo=0; G.miss++; G.btnMiss[i]=1; G.shake=0.25; sfx('miss');

function updCustomers(dt,active){
  const mult=(G.lunch?TUNE.lunchMult:1)*TUNE.mult, D=TUNE.drain;
  for(let i=0;i<3;i++){
    const c=G.slots[i]; if(!c) continue; c.st+=dt;
    if(c.state==='enter'){ if(c.st>=0.34){ c.state='wait'; c.st=0; } }
    else if(c.state==='wait'){ if(active){ c.wait+=dt; const r=c.wait<TUNE.t1?D[0]:c.wait<TUNE.t2?D[1]:D[2]; G.gauge-=r*mult*dt; if(c.wait>=TUNE.t2&&!c.angryN){ c.angryN=true; sfx('angry'); } } }
    else if(c.state==='happy'){ if(c.st>=0.62){ c.state='leave'; c.st=0; } }
    else if(c.state==='leave'){ if(c.st>=0.3){ G.slots[i]=null; const R=G.lunch?TUNE.refillL:TUNE.refill; G.slotT[i]=R[0]+rng()*R[1]; } }
  }
}
function updPlay(dt){
  G.t+=dt; const rem=GAME_TIME-G.t;
  if(!G.lunch&&rem<=LUNCH_AT){ G.lunch=true; G.banner={k:'lunch',t:0}; sfx('lunch'); music('mode','lunch'); say('ランチタイムだ！ いそがしくなるぞ！',2.2); jamPose('cheer',1.2); }
  const sec=Math.ceil(rem); if(sec<=5&&sec>=1&&sec!==G.lastSec){ G.lastSec=sec; sfx('tick'); }
  for(let i=0;i<3;i++) if(!G.slots[i]&&rem>0.8){ G.slotT[i]-=dt; if(G.slotT[i]<=0) spawn(i); }
  updCustomers(dt,true);
  if(G.gauge<=0){ G.gauge=0; endGame('over'); return; }
  if(G.gauge<30&&!G.lowWarned){ G.lowWarned=true; say('いそがなくっちゃ！',1.4); sfx('low'); }
  if(G.gauge>45) G.lowWarned=false;
  if(rem<=0){ G.t=GAME_TIME; endGame('clear'); }
}
function updFx(dt){
  for(const f of G.fly){ f.t+=dt; if(f.t>=f.dur&&!f.hit){ f.hit=true; burst(f.x1,f.y1,'star',5); } }
  G.fly=G.fly.filter(f=>f.t<f.dur+0.02);
  for(const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=dt*3; }
  G.parts=G.parts.filter(p=>p.t<p.life);
  for(const f of G.floats) f.t+=dt; G.floats=G.floats.filter(f=>f.t<f.life+(f.delay||0));
  for(const r of G.ripples) r.t+=dt; G.ripples=G.ripples.filter(r=>r.t<0.5);
  if(G.banner){ G.banner.t+=dt; if(G.banner.k==='lunch'&&G.banner.t>2.1) G.banner=null; }
}
function update(dt){
  G.time+=dt; G.st+=dt;
  updFx(dt);
  if(G.jam.sayT>0) G.jam.sayT-=dt; G.jam.sayAge+=dt;
  if(G.jam.poseT>0){ G.jam.poseT-=dt; if(G.jam.poseT<=0) G.jam.pose='idle'; }
  for(let i=0;i<8;i++){ G.btnA[i]=Math.max(0,G.btnA[i]-dt*6); G.btnMiss[i]=Math.max(0,G.btnMiss[i]-dt*3); }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt);
  if(G.state==='count'){
    const n=Math.floor(G.st/0.62);
    if(n!==G.cdLast){ G.cdLast=n; if(n<3) sfx('beep'); else if(n===3) sfx('go'); }
    if(G.st>=0.62*3+0.5){ G.state='play'; G.st=0; music('start','normal'); say('いらっしゃいませ！',1.5); jamPose('wave',1.2); }
  } else if(G.state==='play') updPlay(dt);
  else if(G.state==='end'){ updCustomers(dt,false); if(G.st>=1.9){ G.state='result'; G.st=0; G.starShown=-1; } }
  else if(G.state==='result'){
    const k=Math.floor((G.st-0.55)/0.32);
    if(k>=0&&k<G.result.stars&&k>G.starShown){ G.starShown=k; sfx('star'); }
  }
}

  c.save(); c.beginPath(); c.rect(40,182,460,500); c.clip(); drawJam(c,108,600,0.82,clear?'cheer':'miss',t,false); c.restore();
  c.beginPath(); c.moveTo(176,585); c.lineTo(160,600); c.lineTo(180,600); c.closePath(); fs(c,'#fff',2.5,'#e2a160');
  rr(c,172,548,306,82,20); fs(c,'#fff',2.5,'#e2a160'); c.fillStyle='#fff'; c.fillRect(170,586,8,13);
  const parts=cm.split(' ');
  const l1=parts.slice(0,Math.ceil(parts.length/2)).join(' '), l2=parts.slice(Math.ceil(parts.length/2)).join(' ');
  fitText(c,l1,325,575,18,'#5b3a1e',280); fitText(c,l2,325,603,18,'#5b3a1e',280);
  const ps=1+Math.sin(t*5)*0.04;
  c.save(); c.translate(RETRY.x+RETRY.w/2,RETRY.y+RETRY.h/2); c.scale(ps,ps);
  rr(c,-RETRY.w/2,-RETRY.h/2,RETRY.w,RETRY.h,36); const g=c.createLinearGradient(0,-36,0,36); g.addColorStop(0,'#ff6f5e'); g.addColorStop(1,'#d8352b'); fs(c,g,4);
  text(c,'もういちど',0,-1,30,'#fff',{stroke:'#a8261f',sw:5}); c.restore();
  c.restore();
  if(!RECORD) drawMute(c);
}
function drawBot(c,t){
  for(const r of G.ripples){ const p=r.t/0.5; circ(c,r.x,r.y,14+p*30); c.lineWidth=4*(1-p); c.strokeStyle=`rgba(255,255,255,${0.9*(1-p)})`; c.stroke(); }
  if(BOT.alpha<=0.01) return;
  c.save(); c.globalAlpha=BOT.alpha;
  circ(c,BOT.x+2,BOT.y+4,17); c.fillStyle='rgba(60,30,10,0.25)'; c.fill();
  circ(c,BOT.x,BOT.y,17); c.fillStyle='rgba(255,255,255,0.75)'; c.fill(); c.lineWidth=3; c.strokeStyle='rgba(91,58,30,0.8)'; c.stroke();
  c.restore();
}
function drawGame(c){
  const t=G.time;
  c.drawImage(BACK,0,0,W,H);
  drawWindowLive(c,t);
  for(const cu of G.slots) if(cu) drawCustomer(c,cu,t);
  c.drawImage(FRONT,0,0,W,H);
  for(const cu of G.slots) if(cu){ drawTag(c,cu); drawHands(c,cu,t); }
  for(const cu of G.slots) if(cu) drawBubble(c,cu,t);
  drawJamArea(c,t);
  drawButtons(c,t);
  drawHUD(c,t);
  drawFx(c,t);
  if(G.banner) drawBanner(c,t);
  if(G.state==='title') drawTitle(c,t);
  else if(G.state==='count') drawCount(c,t);
  else if(G.state==='result') drawResult(c,t);
  if(RECORD||DEMO) drawBot(c,t);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(RECORD){ ctx.drawImage(FRAME,0,0); ctx.save(); rr(ctx,VID.gx,VID.gy,VID.gw,VID.gh,36); ctx.clip(); }
  else ctx.clearRect(0,0,cv.width,cv.height);
  const k=G.shake/0.25, sx=Math.sin(G.time*95)*5*k, sy=Math.cos(G.time*83)*3*k;
  ctx.setTransform(S,0,0,S,GX+sx*S,GY+sy*S);
  drawGame(ctx);
  if(RECORD) ctx.restore();
}

/* ================= Input ================= */
function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function tapAt(x,y){
  if(G.state==='title'){
    if(!RECORD&&Math.hypot(x-MUTE.x,y-MUTE.y)<MUTE.r+8){ setMute(!AU.muted); return; }
    startCountdown();
  } else if(G.state==='play'){
    for(let i=0;i<8;i++) if(inRect(x,y,BTNS[i])){ pressItem(i); return; }
  } else if(G.state==='result'&&G.st>0.6){
    if(!RECORD&&Math.hypot(x-MUTE.x,y-MUTE.y)<MUTE.r+8){ setMute(!AU.muted); return; }
    if(inRect(x,y,RETRY)) startCountdown();
  }
}
if(!RECORD){
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); auInit(); const r=cv.getBoundingClientRect(); tapAt((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); });
  const KEYS='12345678', KEYS2='qwerasdf';
  addEventListener('keydown',e=>{
    auInit(); const k=e.key.toLowerCase();
    if(k==='m'){ setMute(!AU.muted); return; }
    if(G.state==='play'){ let i=KEYS.indexOf(k); if(i<0) i=KEYS2.indexOf(k); if(i>=0) pressItem(i); }
    else if((k===' '||k==='enter')&&(G.state==='title'||(G.state==='result'&&G.st>0.6))){ e.preventDefault(); startCountdown(); }
  });
}

/* ================= Autoplay bot (録画・デモ用) ================= */
const BOT={x:300,y:1000,tx:270,ty:840,plan:[],next:0,target:null,started:false,alpha:0,
  p:{think:0.30,perG:0.12,sil:0.26,text:0.2,gap:0.17,gapJ:0.1,mistake:0.03}};
function botAim(i){ const b=BTNS[i]; BOT.tx=b.x+b.w/2+(brng()-0.5)*22; BOT.ty=b.y+48+(brng()-0.5)*16; }
function botUpdate(dt){
  const P=BOT.p, k=Math.min(1,dt*13);
  BOT.x+=(BOT.tx-BOT.x)*k; BOT.y+=(BOT.ty-BOT.y)*k;
  const show=G.state==='title'||G.state==='play'||G.state==='count';
  BOT.alpha=clamp(BOT.alpha+(show?dt*4:-dt*3),0,1);
  if(G.state==='title'){
    BOT.tx=270; BOT.ty=846;
    if(!BOT.started&&G.st>1.2){ BOT.started=true; BOT.x=BOT.tx; BOT.y=BOT.ty; G.ripples.push({x:BOT.x,y:BOT.y,t:0}); tapAt(270,846); }
    return;
  }
  if(G.state==='result'&&DEMO&&G.st>4){ BOT.tx=RETRY.x+RETRY.w/2; BOT.ty=RETRY.y+RETRY.h/2; if(G.st>4.6){ G.ripples.push({x:BOT.tx,y:BOT.ty,t:0}); tapAt(BOT.tx,BOT.ty); } return; }
  if(G.state!=='play'){ if(G.state==='count'){ BOT.tx=270; BOT.ty=880; } return; }
  const now=G.t;
  if(BOT.target&&(BOT.target.state!=='wait'||!G.slots.includes(BOT.target))){ BOT.target=null; BOT.plan=[]; }
  if(!BOT.plan.length){
    let best=null; for(const c of G.slots) if(c&&c.state==='wait'&&c.groups.some(g=>g.got<g.need)&&(!best||c.arr<best.arr)) best=c;
    if(!best) return;
    BOT.target=best; const plan=[];
    for(const g of best.groups) for(let j=g.got;j<g.need;j++) plan.push(g.item);
    if(brng()<P.mistake){ let w; do{ w=Math.floor(brng()*8); }while(plan.includes(w)); plan.unshift(w); }
    BOT.plan=plan;
    const think=P.think+P.perG*best.groups.length+(best.mode==='sil'?P.sil:best.mode==='text'?P.text:0)+brng()*0.12;
    BOT.next=now+Math.max(0.14,think-best.st);
    botAim(plan[0]);
  } else if(now>=BOT.next){
    const item=BOT.plan.shift();
    G.ripples.push({x:BOT.x,y:BOT.y,t:0}); pressItem(item);
    if(BOT.plan.length){ botAim(BOT.plan[0]); BOT.next=now+P.gap+brng()*P.gapJ; }
  }
}

/* ================= Main ================= */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,last?(ts-last)/1000:0); last=ts;
  if(DEMO) botUpdate(dt);
  update(dt); render(); requestAnimationFrame(frame);
}
window.REC={ready:false,done:false,hold:4.2,
  step(dt){ REC_T+=dt; botUpdate(dt); update(dt); render(); if(G.state==='result'&&G.st>=this.hold) this.done=true; },
  frame(q){ return cv.toDataURL('image/jpeg',q||0.92); },
  time(){ return REC_T; },
  audio(total){ return renderAudio(total||REC_T+0.3); },
  info(){ return {state:G.state,t:G.t,gauge:G.gauge,sales:G.sales,served:G.served,maxCombo:G.maxCombo,miss:G.miss,kind:G.endKind,stars:G.result&&G.result.stars}; },
  sim(params,seed,dt=1/60){
    AU.silent=true; Object.assign(BOT.p,params||{}); brng=mulberry32(seed*13+5); BOT.plan=[]; BOT.target=null;
    resetGame(seed); G.state='play'; G.st=0; let minG=100;
    while(G.state==='play'){ botUpdate(dt); update(dt); minG=Math.min(minG,G.gauge); }
    AU.silent=false;
    return {kind:G.endKind,t:+G.t.toFixed(1),sales:G.sales,served:G.served,minG:+minG.toFixed(1),gauge:+G.gauge.toFixed(1),maxCombo:G.maxCombo,miss:G.miss,stars:G.result.stars};
  },
  setup(seed,botp){ if(botp) Object.assign(BOT.p,botp); resetGame(seed); say('',0); G.jam.pose='idle'; SEED=seed; rng=mulberry32(seed); brng=mulberry32(seed*13+5); vr=mulberry32(seed*7+3); G.state='title'; G.st=0; G.time=0; G.plays=0; BOT.started=false; BOT.plan=[]; BOT.target=null; AU.log=[]; REC_T=0; this.done=false; AU.log.push({t:0.05,k:'s',n:'jingle'}); },
};
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load(`800 30px "M PLUS Rounded 1c"`),document.fonts.load(`500 20px "M PLUS Rounded 1c"`)]),new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  layout();
  if(RECORD){ document.body.classList.add('rec'); render(); window.REC.ready=true; }
  else{ addEventListener('resize',layout); requestAnimationFrame(frame); }
}
boot();
</script>
