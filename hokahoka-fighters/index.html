<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1f3d">
<title>ほかほかファイターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f1a17; --cream:#fff8e8; --pad:#f4ead7; --pad-d:#cbbd9f; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3d2f5c,#17121f);
    color:var(--cream);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-weight:800;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  #cv{position:absolute;display:block;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#000;touch-action:none}
  .ctl{position:absolute;touch-action:none;display:none}
  body.touch .ctl{display:block}
  #dpad{border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,var(--pad) 60%,var(--pad-d));border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35)}
  #dpad::before,#dpad::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(31,26,23,.08);border-radius:8px}
  #dpad::before{width:34%;height:86%}
  #dpad::after{width:86%;height:34%}
  #dpad .ar{position:absolute;width:0;height:0;border-style:solid;z-index:1}
  #dpad .u{left:50%;top:9%;transform:translateX(-50%);border-width:0 13px 17px 13px;border-color:transparent transparent var(--ink) transparent}
  #dpad .d{left:50%;bottom:9%;transform:translateX(-50%);border-width:17px 13px 0 13px;border-color:var(--ink) transparent transparent transparent}
  #dpad .l{top:50%;left:9%;transform:translateY(-50%);border-width:13px 17px 13px 0;border-color:transparent var(--ink) transparent transparent}
  #dpad .r{top:50%;right:9%;transform:translateY(-50%);border-width:13px 0 13px 17px;border-color:transparent transparent transparent var(--ink)}
  #dpad .u.on{border-bottom-color:#e8483f} #dpad .d.on{border-top-color:#e8483f}
  #dpad .l.on{border-right-color:#e8483f} #dpad .r.on{border-left-color:#e8483f}

    text-align:center;line-height:1.05;box-shadow:0 5px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.4);touch-action:none}
  body:not(.touch) .btn{display:none}
  .btn.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  #bP{background:radial-gradient(circle at 38% 32%,#ffb08a,#f0703c 55%,#b84a1f)}
  #bK{background:radial-gradient(circle at 38% 32%,#8fd0ff,#3a8fe0 55%,#1f5fa8)}
  #bS{background:radial-gradient(circle at 38% 32%,#ffe38a,#f2b632 55%,#b8821a)}
  #bX{background:radial-gradient(circle at 38% 32%,#ff9ad0,#e8489a 55%,#a82a6a);opacity:.4}
  #bX.ready{opacity:1;animation:pulse .5s infinite alternate}
  @keyframes pulse{to{filter:brightness(1.3)}}
  #mini{position:absolute;display:flex;gap:10px}
  #mini button{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--pad);color:var(--ink);
    font:inherit;font-size:15px;padding:0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  #mini button.off{opacity:.55;text-decoration:line-through}
  #help{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;line-height:1.6;opacity:.85;display:none;padding:0 8px}
  body:not(.touch) #help{display:block}
  #rotate{position:absolute;left:0;right:0;text-align:center;font-size:13px;opacity:.8;display:none}
  noscript{display:block;padding:2em;text-align:center}
</style>
</head>
<body>
<noscript>このゲームを あそぶには JavaScript を ゆうこうに してください。</noscript>
<canvas id="cv" aria-label="ゲームがめん"></canvas>
<div id="dpad" class="ctl" aria-label="いどう"><i class="ar u"></i><i class="ar d"></i><i class="ar l"></i><i class="ar r"></i></div>
<div class="btn ctl" id="bP">パンチ</div>
<div class="btn ctl" id="bK">キック</div>
<div class="btn ctl" id="bS">ひっさつ</div>
<div class="btn ctl" id="bX">ちょう<br>ひっさつ</div>
<div id="mini"><button id="pauseBtn" title="ポーズ (P / Esc)" aria-label="ポーズ">Ⅱ</button><button id="muteBtn" title="おと (M)" aria-label="おと">♪</button></div>
<div id="help">1P： ←→↑↓ / WASD いどう　Z・F パンチ　X・G キック　C・H ひっさつ　V・T ちょうひっさつ<br>
2P（ふたりで たいせん）： ←→↑↓ いどう　1・, パンチ　2・. キック　3・/ ひっさつ　0・; ちょうひっさつ（1PはWASDとF G H T）</div>
<div id="rotate">📱 よこむきに すると あそびやすいよ</div>
<script>

  },
  setMuted(m) { this.muted = m; if (this.out) this.out.gain.setTargetAtTime(m ? 0 : 0.6, this.ac.currentTime, 0.02); },
  tone(f, dur, o = {}) {

  noise(dur, o = {}) {

const SFX = {
  whoosh(h) { Snd.noise(h ? 0.14 : 0.08, { freq: h ? 900 : 1600, fslide: h ? 3000 : 4000, vol: 0.12, ftype: 'bandpass' }); },
  hit(h) {

    Snd.tone(h ? 180 : 260, h ? 0.16 : 0.08, { slide: h ? 60 : 120, vol: 0.28, type: 'triangle' });
  },
  block() { Snd.tone(1250, 0.05, { vol: 0.12 }); Snd.noise(0.06, { freq: 5000, vol: 0.12, ftype: 'highpass' }); },
  shoot() { Snd.tone(300, 0.25, { slide: 900, vol: 0.14 }); Snd.noise(0.2, { freq: 600, fslide: 2400, vol: 0.12, ftype: 'bandpass' }); },
  rise() { Snd.tone(220, 0.3, { slide: 1100, vol: 0.16, type: 'sawtooth' }); },
  rush() { Snd.noise(0.3, { freq: 400, fslide: 1600, vol: 0.18, ftype: 'bandpass' }); },
  jump() { Snd.tone(330, 0.1, { slide: 620, vol: 0.1, type: 'triangle' }); },
  land() { Snd.noise(0.06, { freq: 700, vol: 0.14 }); },
  down() { Snd.noise(0.3, { freq: 500, fslide: 90, vol: 0.4 }); Snd.tone(90, 0.3, { slide: 45, vol: 0.25, type: 'triangle' }); },
  superFlash() { [523, 659, 784, 1047, 1319].forEach((f, i) => Snd.tone(f, 0.12, { vol: 0.13, delay: i * 0.04 })); Snd.noise(0.5, { freq: 300, fslide: 5000, vol: 0.15, ftype: 'bandpass' }); },
  ko() { Snd.noise(0.7, { freq: 1500, fslide: 60, vol: 0.5 }); Snd.tone(110, 0.8, { slide: 35, vol: 0.3, type: 'triangle' }); },
  cursor() { Snd.tone(880, 0.04, { vol: 0.1 }); },
  ok() { Snd.tone(660, 0.06, { vol: 0.14 }); Snd.tone(990, 0.1, { vol: 0.14, delay: 0.06 }); },
  bell() { Snd.tone(1568, 0.5, { vol: 0.12, type: 'triangle' }); Snd.tone(2093, 0.4, { vol: 0.08, type: 'triangle', delay: 0.02 }); },
  fight() { [392, 523, 659, 784].forEach((f, i) => Snd.tone(f, 0.18, { vol: 0.14, delay: i * 0.05 })); },
  tick() { Snd.tone(1760, 0.03, { vol: 0.06 }); },

// ------------------------------------------------------------
//  Music: step sequencer, one token = one 8th note ("-" hold, "." rest). All melodies are original.
// ------------------------------------------------------------
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

const SONGS = {
  title: { bpm: 150, loop: true, tracks: [
    { type: 'square', vol: 0.14, gate: 0.85, notes: `C5 E5 G5 C6 B5 G5 E5 G5 | A5 F5 C5 F5 A5 C6 A5 F5 | G5 E5 C5 E5 G5 B5 D6 B5 | C6 - G5 - E5 - C5 . |
      F5 A5 C6 A5 G5 B5 D6 B5 | E5 G5 C6 G5 A5 F5 D5 F5 | G5 G5 A5 B5 C6 D6 E6 D6 | C6 - - . G5 - C6 .` },
    { type: 'triangle', vol: 0.3, gate: 0.7, notes: `C3 . G3 . C3 . G3 . | F2 . C3 . F2 . C3 . | C3 . G3 . E3 . G3 . | C3 . G2 . C3 . . . |
      F2 . C3 . G2 . D3 . | C3 . G3 . F2 . C3 . | G2 . G2 . G2 . B2 . | C3 . G2 . C3 . . .` }] },
  select: { bpm: 140, loop: true, tracks: [
    { type: 'square', vol: 0.12, gate: 0.7, notes: `E5 G5 C6 G5 E5 G5 C6 G5 | F5 A5 C6 A5 F5 A5 C6 A5 | D5 G5 B5 G5 D5 G5 B5 G5 | C5 E5 G5 E5 C5 - . .` },
    { type: 'triangle', vol: 0.3, gate: 0.8, notes: `C3 . . . G2 . . . | F2 . . . C3 . . . | G2 . . . D3 . . . | C3 . . . G2 . . .` }] },
  fight1: { bpm: 168, loop: true, tracks: [
    { type: 'square', vol: 0.13, gate: 0.8, notes: `E5 . E5 G5 . E5 D5 C5 | D5 . D5 F5 . D5 C5 B4 | C5 . E5 G5 C6 . B5 A5 | G5 - - . E5 - G5 . |
      A5 . A5 C6 . A5 G5 F5 | G5 . G5 B5 . G5 F5 E5 | F5 E5 D5 E5 F5 G5 A5 B5 | C6 - G5 - C6 - . .` },
    { type: 'triangle', vol: 0.32, gate: 0.6, notes: `C3 C3 G3 C3 C3 C3 G3 C3 | G2 G2 D3 G2 G2 G2 D3 G2 | A2 A2 E3 A2 F2 F2 C3 F2 | G2 G2 D3 G2 G2 . B2 . |
      F2 F2 C3 F2 F2 F2 C3 F2 | E2 E2 B2 E2 E2 E2 B2 E2 | D2 D2 A2 D2 G2 G2 D3 G2 | C3 . G2 . C3 . . .` }] },
  fight2: { bpm: 156, loop: true, tracks: [
    { type: 'square', vol: 0.13, gate: 0.75, notes: `G5 . B5 D6 . B5 G5 . | A5 . C6 E6 . C6 A5 . | B5 A5 G5 A5 B5 D6 B5 G5 | A5 - - . D5 - - . |
      E5 . G5 B5 . G5 E5 . | F#5 . A5 D6 . A5 F#5 . | G5 A5 B5 C6 D6 C6 B5 A5 | G5 - D5 - G5 - . .` },
    { type: 'triangle', vol: 0.32, gate: 0.65, notes: `G2 . D3 . G2 . D3 . | A2 . E3 . A2 . E3 . | G2 . D3 . E2 . B2 . | D3 . A2 . D3 . F#2 . |
      E2 . B2 . E2 . B2 . | D2 . A2 . D2 . A2 . | C3 . G2 . D3 . A2 . | G2 . D3 . G2 . . .` }] },
  fight3: { bpm: 172, loop: true, tracks: [
    { type: 'square', vol: 0.12, gate: 0.75, notes: `A4 A4 C5 A4 D5 A4 E5 D5 | C5 C5 E5 C5 G5 E5 D5 C5 | F5 F5 E5 D5 E5 E5 D5 C5 | B4 - E5 - G#4 - B4 . |
      A4 A4 C5 A4 D5 A4 E5 D5 | C5 C5 E5 C5 A5 G5 F5 E5 | D5 F5 A5 F5 E5 G#5 B5 G#5 | A5 - E5 - A4 - . .` },
    { type: 'triangle', vol: 0.33, gate: 0.55, notes: `A2 A2 A3 A2 A2 A2 A3 A2 | C3 C3 C4 C3 C3 C3 C4 C3 | F2 F2 F3 F2 E2 E2 E3 E2 | E2 E2 E3 E2 E2 E2 G#2 E2 |
      A2 A2 A3 A2 A2 A2 A3 A2 | C3 C3 C4 C3 C3 C3 C4 C3 | D2 D2 D3 D2 E2 E2 E3 E2 | A2 . E2 . A2 . . .` }] },
  fight4: { bpm: 150, loop: true, tracks: [
    { type: 'square', vol: 0.12, gate: 0.8, notes: `D5 . F5 A5 . G5 F5 E5 | D5 . A4 . D5 E5 F5 . | C5 . E5 G5 . F5 E5 D5 | C#5 - A4 - E5 - . . |
      D5 . F5 A5 . A#5 A5 G5 | F5 . D5 . F5 G5 A5 . | A#5 A5 G5 F5 E5 F5 G5 E5 | D5 - A4 - D5 - . .` },
    { type: 'triangle', vol: 0.34, gate: 0.65, notes: `D2 . A2 . D2 . A2 . | D2 . A2 . D2 . A2 . | C2 . G2 . C2 . G2 . | A1 . E2 . A1 . C#2 . |
      D2 . A2 . D2 . A2 . | A#1 . F2 . A#1 . F2 . | G1 . D2 . A1 . E2 . | D2 . A1 . D2 . . .` }] },
  win: { bpm: 170, loop: false, tracks: [
    { type: 'square', vol: 0.14, gate: 0.9, notes: `G5 C6 E6 G6 - E6 G6 - - -` },
    { type: 'triangle', vol: 0.3, gate: 0.9, notes: `C3 . G3 . C3 . C3 - - -` }] },
  lose: { bpm: 120, loop: false, tracks: [
    { type: 'square', vol: 0.13, gate: 0.9, notes: `E5 D5 C5 A4 - G4 - - C4 - - -` },
    { type: 'triangle', vol: 0.3, gate: 0.9, notes: `A2 - - - F2 - - - C2 - - -` }] },
  ending: { bpm: 132, loop: true, tracks: [
    { type: 'square', vol: 0.13, gate: 0.85, notes: `C5 - E5 G5 C6 - B5 A5 | G5 - E5 - C5 - D5 E5 | F5 - A5 C6 F6 - E6 D6 | C6 - - - - - . . |

    { type: 'triangle', vol: 0.3, gate: 0.8, notes: `C3 . G3 . E3 . G3 . | C3 . G3 . E3 . G3 . | F2 . C3 . A2 . C3 . | C3 . G2 . C3 . . . |
      F2 . C3 . A2 . C3 . | G2 . D3 . B2 . D3 . | C3 . G2 . G2 . D3 . | C3 . G2 . C3 . . .` }] },

for (const k in SONGS) for (const tr of SONGS[k].tracks) tr.ev = parseTrack(tr.notes);
const Music = {
  cur: null, curName: null, timer: null,
  play(name) {
    this.stop();

    const song = SONGS[name]; if (!song) return;
    const bus = Snd.ac.createGain(); bus.connect(Snd.bgmBus);
    const t0 = Snd.ac.currentTime + 0.06;
    this.curName = name;
    this.cur = { song, bus, tracks: song.tracks.map(tr => ({ tr, i: 0, t: t0 })) };

    this.pump();
  },
  want(name) { if (this.curName !== name) this.play(name); },
  stop() {
    if (this.timer) clearInterval(this.timer);

    if (this.cur && Snd.ac) {
      const bus = this.cur.bus;
      bus.gain.setTargetAtTime(0, Snd.ac.currentTime, 0.015);
      setTimeout(() => bus.disconnect(), 400);

  pump() {

    const spb = 60 / c.song.bpm / 2, horizon = Snd.ac.currentTime + 0.2;
    let busy = false;
    for (const st of c.tracks) {
      while (st.t < horizon) {
        if (st.i >= st.tr.ev.length) { if (c.song.loop) st.i = 0; else break; }
        const e = st.tr.ev[st.i++], dur = e.len * spb;

      if (c.song.loop || st.i < st.tr.ev.length) busy = true;

    if (!busy) { clearInterval(this.timer); this.timer = null; }
  },

// ------------------------------------------------------------
//  Drawing helpers
// ------------------------------------------------------------
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));

}
function rrect(x, y, w, h, r, fill, stroke = true) { rrPath(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) ctx.stroke(); }

  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) ctx.stroke();
}

  for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, TAU); ctx.stroke(); }
  ctx.lineWidth = lw; ctx.fillStyle = fill;
  for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, TAU); ctx.fill(); }

// polyline drawn as a thick limb with an outline
function limb(pts, w, color) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);

  }

      if (chosen) {

      }

  ctx.fillStyle = g; ctx.fillText('ほかほか', W / 2, 36 + bob);
  ctx.font = `800 30px ${FONT}`;
  ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.strokeText('ファイターズ', W / 2, 72 + bob);
  ctx.lineWidth = 5; ctx.strokeStyle = OL; ctx.strokeText('ファイターズ', W / 2, 72 + bob);

  }

function drawHowto() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);

function drawSelect() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);

  text('キャラクターを えらんでね', W / 2, 24, 13, '#ffe14a', 'center', OL, 3.5);

      for (let s = 0; s < 5; s++) { ctx.lineWidth = 0.5; ctx.strokeStyle = OL; star5(x + (align === 'left' ? 34 : -44) + s * 9, 186 + j * 11, 3.6, s < c.stars[j] ? '#ffd84d' : 'rgba(255,255,255,0.2)'); }
    });
  };

  if (two) info(1, W - 22, 'right');
  else text(isTouch() ? 'タップで えらぶ' : '← → で えらんで パンチで けってい', W - 22, 196, 6.5, '#fff', 'right', OL, 2);
}
function drawVs() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  const [a, b] = Game.vs, k = Math.min(1, Game.st / 20);
  ctx.fillStyle = '#ff9a5c'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W / 2 + 30, 0); ctx.lineTo(W / 2 - 30, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#6a4ab0'; ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W / 2 + 30, 0); ctx.lineTo(W / 2 - 30, H); ctx.lineTo(W, H); ctx.fill();
  const ca = CHARS[a], cb = CHARS[b];
  drawRig(lerp(-60, 100, k), 196, 1, 2.1 * ca.sc, CHAR_ART[ca.id], CHAR_ART[ca.id].cols[0], Pz({ face: 'angry', hF: [16, -36], hB: [10, -31] }));
  drawRig(lerp(W + 60, W - 100, k), 196, -1, 2.1 * cb.sc, CHAR_ART[cb.id], CHAR_ART[cb.id].cols[a === b ? 1 : 0], Pz({ face: 'angry', hF: [16, -36], hB: [10, -31] }));
  bigText('VS', 104, 40, '#ffe14a', Game.st - 10);
  text(ca.name, 70, 210, 12, '#fff', 'center', OL, 3); text(cb.name, W - 70, 210, 12, '#fff', 'center', OL, 3);
  if (Game.mode === '1p') text(`だい ${Game.arc.idx + 1} せん　ステージ：${STAGES[cb.stage]}`, W / 2, 16, 8, '#fff', 'center', OL, 2.2);
}
function drawResult() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(stageCanvas, 0, 0);
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  ctx.fillStyle = 'rgba(20,16,30,0.5)'; ctx.fillRect(0, 0, W, H);
  const w = Game.matchWinner, c = w.ch;
  drawRig(110, 200, 1, 2 * c.sc, w.art, w.cols, Pz({ hip: [0, -16 - Math.abs(Math.sin(Game.st * 0.1)) * 3], hF: [9, -58], hB: [-9, -58], face: 'win' }));
  bigText(Game.mode === '2p' ? `${w.ctrl === 'p1' ? '1P' : '2P'} の かち！` : w.ctrl === 'p1' ? 'YOU WIN！' : 'YOU LOSE…', 40, 24, w.ctrl === 'cpu' && Game.mode === '1p' ? '#9fdcff' : '#ffe14a', Game.st);
  ctx.lineWidth = 1.2; ctx.strokeStyle = OL;
  rrect(196, 92, 190, 54, 12, '#fff8e8');
  ctx.beginPath(); ctx.moveTo(200, 128); ctx.lineTo(184, 136); ctx.lineTo(202, 136); ctx.fillStyle = '#fff8e8'; ctx.fill();
  text(c.name, 210, 106, 8, '#e8485f', 'left');
  text(`「${c.quote}」`, 291, 126, 7.5, OL);
  if (Game.st > 70 && (Game.st >> 4) % 2) text(isTouch() ? 'タップで つぎへ' : 'Enter / パンチで つぎへ', 291, 166, 7, '#fff', 'center', OL, 2);
}
function drawCont() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  ctx.fillStyle = '#1d1630'; ctx.fillRect(0, 0, W, H);
  const c = CHARS[Game.arc.player], art = CHAR_ART[c.id];
  drawRig(W / 2, 190, 1, 1.6 * c.sc, art, art.cols[0], Pz({ lean: 0.35, face: 'hurt', hF: [6, -22], hB: [-3, -22], headTilt: 0.3 }));
  bigText('つづける？', 40, 22, '#ffe14a', Game.st);
  bigText(String(Math.max(0, 9 - Math.floor(Game.st / 60))), 82, 34, '#fff', 20);
  text(isTouch() ? 'タップで つづける' : 'Enter / パンチで つづける', W / 2, 214, 7.5, '#fff', 'center', OL, 2);
}
function drawGameOver() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  ctx.fillStyle = '#120e1c'; ctx.fillRect(0, 0, W, H);
  bigText('ゲームオーバー', H / 2, 26, '#e8483f', Game.st);
}
function drawEnding() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!titleBg || titleBg.width !== cv.width) titleBg = cachedBg(0);
  ctx.drawImage(titleBg, 0, 0);
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  ctx.fillStyle = 'rgba(255,240,220,0.25)'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) {
    const x = (i * 53 + Game.t * (0.4 + (i % 3) * 0.2)) % W, y = (i * 37 + Game.t * (0.7 + (i % 4) * 0.2)) % H;
    ctx.fillStyle = ['#ff7a3d', '#ffe14a', '#4fb36a', '#3a8fe0', '#ff9ad0'][i % 5]; ctx.fillRect(x, y, 3, 2);
  }
  const p = CHARS[Game.arc.player];

  lineup(205, 1.05, i => {
    const h = Math.abs(Math.sin(Game.t * 0.12 + i)) * 4;
    return Pz({ hip: [0, -16 - h], fF: [5, -h], fB: [-5, -h], hF: [9, -58 - h], hB: [-9, -58 - h], face: 'win' });
  });
  if (Game.st > 120) text('あそんでくれて ありがとう！', W / 2, 84, 8, '#fff', 'center', OL, 2.4);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  switch (Game.scene) {
    case 'title': drawTitle(); break;
    case 'howto': drawHowto(); break;
    case 'select': drawSelect(); break;
    case 'vs': drawVs(); break;
    case 'fight': drawFight(); break;
    case 'result': drawResult(); break;
    case 'cont': drawCont(); break;
    case 'gameover': drawGameOver(); break;
    case 'ending': drawEnding(); break;
  }
  const bx = document.getElementById('bX');
  const ready = Game.scene === 'fight' && Game.f[0] && Game.f[0].meter >= 100;
  if (bx.classList.contains('ready') !== ready) bx.classList.toggle('ready', ready);
}

// ------------------------------------------------------------
//  Layout & main loop
// ------------------------------------------------------------
function isTouch() { return document.body.classList.contains('touch'); }
function setTouchMode(on) { if (isTouch() !== on) { document.body.classList.toggle('touch', on); layout(); } }
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ms = document.getElementById('mini').style, help = document.getElementById('help').style, rot = document.getElementById('rotate').style;
  const place = (id, x, y, s, fs) => { const st = document.getElementById(id).style; st.left = x + 'px'; st.top = y + 'px'; st.width = st.height = s + 'px'; if (fs) st.fontSize = fs + 'px'; };
  let cx, cy, cw, ch;
  rot.display = 'none';
  if (!isTouch()) {
    VS = Math.max(0.8, Math.min((vw - 24) / W, (vh - 84) / H));
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = Math.max(8, (vh - ch - 56) / 2);
    help.top = (cy + ch + 10) + 'px';
    if (vw - (cx + cw) > 60) { ms.left = (cx + cw + 10) + 'px'; ms.top = cy + 'px'; ms.flexDirection = 'column'; }
    else { ms.left = (cx + cw - 92) + 'px'; ms.top = (cy + ch + 50) + 'px'; ms.flexDirection = 'row'; }
  } else if (vw >= vh) {
    const side = clamp(vw * 0.2, 130, 230);
    VS = Math.min((vw - 2 * side) / W, (vh - 8) / H);
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = (vh - ch) / 2;
    const sw = cx, D = Math.min(sw * 0.88, vh * 0.5, 190), B = Math.min(sw * 0.36, vh * 0.2, 76);
    place('dpad', (sw - D) / 2, vh - D - vh * 0.08, D);
    const bx = cx + cw + sw / 2, by = vh - vh * 0.1 - B;
    place('bP', bx - B * 1.08, by - B * 0.1, B, B * 0.2); place('bK', bx + B * 0.08, by + B * 0.12, B, B * 0.2);
    place('bS', bx - B * 0.92, by - B * 1.12, B, B * 0.19); place('bX', bx + B * 0.24, by - B * 0.9, B, B * 0.17);
    ms.left = (cx + cw + (sw - 90) / 2) + 'px'; ms.top = '10px'; ms.flexDirection = 'row';
  } else {
    VS = Math.min(vw / W, vh * 0.42 / H);
    cw = W * VS; ch = H * VS; cx = (vw - cw) / 2; cy = Math.max(8, vh * 0.06);
    const top = cy + ch + 16, area = vh - top - 10, D = Math.min(vw * 0.46, area * 0.8, 200), B = Math.min(vw * 0.2, area * 0.3, 84);
    place('dpad', vw * 0.04, top + (area - D) / 2 + 20, D);
    const bx = vw - vw * 0.04 - B * 1.1, by = top + area / 2 + 10;
    place('bP', bx - B * 1.08, by, B, B * 0.2); place('bK', bx + B * 0.08, by + B * 0.22, B, B * 0.2);
    place('bS', bx - B * 0.92, by - B * 1.02, B, B * 0.19); place('bX', bx + B * 0.24, by - B * 0.8, B, B * 0.17);
    ms.left = (vw / 2 - 45) + 'px'; ms.top = (top - 4) + 'px'; ms.flexDirection = 'row';
    rot.display = 'block'; rot.top = (cy + ch + 2) + 'px';
  }
  cv.style.left = cx + 'px'; cv.style.top = cy + 'px'; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  titleBg = null;
  if (Game.scene !== 'title' && Game.f[0]) renderStage();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
let lastT = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}
document.body.classList.toggle('touch', matchMedia('(pointer: coarse)').matches);
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { titleBg = null; });
requestAnimationFrame(frame);
</script>
